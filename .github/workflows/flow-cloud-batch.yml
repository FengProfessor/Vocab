name: Google Flow Cloud Batch Generator

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Roadmap Stage number (1, 2, or 3)'
        required: true
        default: '1'
      topic:
        description: 'Topic ID (e.g. s1-topic-family, or all)'
        required: true
        default: 's1-topic-family'
      batch_size:
        description: 'Number of images generated per prompt (default 5)'
        required: true
        default: '5'

permissions:
  contents: write

jobs:
  flow-generate:
    name: Generate Vocab Images via Google Flow
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm ci --prefer-offline

      - name: Install Python dependencies & Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Restore Google Flow Authentication State
        env:
          FLOW_AUTH_STATE_B64: ${{ secrets.FLOW_AUTH_STATE }}
        run: |
          if [ -z "$FLOW_AUTH_STATE_B64" ]; then
            echo "::error::Missing FLOW_AUTH_STATE repository secret! Please export it via 'python scripts/flow/export-auth-secret.py' and add to GitHub Secrets."
            exit 1
          fi
          mkdir -p tmp/flow
          echo "$FLOW_AUTH_STATE_B64" | base64 -d > tmp/flow/flow_auth_state.json
          echo "Restored tmp/flow/flow_auth_state.json ($(wc -c < tmp/flow/flow_auth_state.json) bytes)"

      - name: Generate Prompts for Stage ${{ github.event.inputs.stage }} - Topic ${{ github.event.inputs.topic }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.topic }}" = "all" ]; then
            npx tsx scripts/flow/generate-roadmap-flow.ts --stage ${{ github.event.inputs.stage }}
          else
            npx tsx scripts/flow/generate-roadmap-flow.ts --stage ${{ github.event.inputs.stage }} --topic ${{ github.event.inputs.topic }}
          fi

      - name: Run Headless Google Flow Generator & Supabase Ingest (Cloud Worker)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          STAGE="${{ github.event.inputs.stage }}"
          TOPIC="${{ github.event.inputs.topic }}"
          BATCH_SIZE="${{ github.event.inputs.batch_size }}"

          if [ "$TOPIC" = "all" ]; then
            TOPIC_DIRS=$(find "tmp/flow/stage$STAGE" -mindepth 1 -maxdepth 1 -type d)
          else
            TOPIC_DIRS="tmp/flow/stage$STAGE/$TOPIC"
          fi

          for TARGET_DIR in $TOPIC_DIRS; do
            if [ -f "$TARGET_DIR/manifest.json" ]; then
              echo "===================================================="
              echo "🚀 Running Google Flow Generator for: $TARGET_DIR"
              echo "===================================================="
              python -u scripts/flow/run-flow-headless.py \
                --manifest "$TARGET_DIR/manifest.json" \
                --out-dir "$TARGET_DIR/output" \
                --storage-state tmp/flow/flow_auth_state.json \
                --batch-size "$BATCH_SIZE" \
                --jitter-min 4.0 \
                --jitter-max 7.0

              echo "📥 Ingesting generated images to Supabase for $TARGET_DIR..."
              npx tsx scripts/flow/ingest-flow-batch.ts --dir "$TARGET_DIR"
            fi
          done

      - name: Commit and Push Updated Roadmap JSON to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/roadmap/vocab-stages-v1.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(vocab): cloud sync flow images for stage ${{ github.event.inputs.stage }} topic ${{ github.event.inputs.topic }} [skip ci]"
            git push
          fi
