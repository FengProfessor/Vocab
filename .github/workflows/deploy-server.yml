name: Auto Deploy to Ubuntu Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  quality:
    name: Validate exact source before production changes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: p2c-isolated-test
          POSTGRES_DB: p2c_session_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Require main branch and immutable event SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/main' ] || ! [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Production deployment requires main and an exact commit SHA'
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checkout identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install isolated SQL test client without lifecycle scripts
        run: npm install --prefix scripts --no-save --package-lock=false --ignore-scripts pg@8.16.3
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'
      - name: Validate workflow definitions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11 -color=false
      - name: Validate deployment scripts and migration runner syntax
        run: |
          bash -n deploy/activate-release.sh deploy/prepare-source.sh deploy/run-deploy.sh tests/deploy/activate-release.test.sh tests/deploy/prepare-source.test.sh tests/deploy/run-deploy.test.sh
          node --check scripts/apply-p0-migrations.mjs
          node --check tests/deploy/ssh-render.test.mjs
      - name: Deployment safety tests
        run: |
          bash tests/deploy/prepare-source.test.sh
          bash tests/deploy/activate-release.test.sh
          bash tests/deploy/run-deploy.test.sh
          node tests/deploy/ssh-render.test.mjs
      - name: Security regression tests
        env:
          P2B_REDIS_TEST_PORT: '6379'
          P2C_REDIS_TEST_PORT: '6379'
          P2C_POSTGRES_TEST_URL: 'postgresql://postgres:p2c-isolated-test@127.0.0.1:5432/p2c_session_test'
        run: |
          node tests/security/cron-auth.test.mjs
          node tests/security/cron-auth-probe.test.mjs
          node tests/security/privilege-entitlement.test.mjs
          node tests/security/phase1c-auth-boundaries.test.mjs
          node tests/security/phase2a-medium.test.mjs
          node tests/security/phase2b-enforcement.test.mjs
          node tests/security/phase2c-session-store.test.mjs
          node tests/security/phase2c-provider-session.test.mjs
          node tests/security/csp.test.mjs
      - name: Validate backup safety without production access
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age
          python3 tests/backup/connection.test.py
          bash -n scripts/backup/create.sh tests/backup/create.test.sh
          bash tests/backup/create.test.sh
      - name: Lint changed TypeScript deployment route
        run: npx eslint src/app/api/health/route.ts
      - name: Build application
        run: npm run build
      - name: Browser smoke before migration and production changes
        run: npm run test:e2e:smoke
      - name: Full typecheck (known baseline debt; reporting only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm run typecheck
      - name: Full lint (known baseline debt; reporting only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm run lint

  migrate:
    name: Apply required database migrations
    needs: quality
    uses: ./.github/workflows/apply-p0-migrations.yml
    secrets: inherit

  deploy:
    name: Deploy to LingoPro Ubuntu Server
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale VPN
        uses: tailscale/github-action@4e4c49acaa9818630ce0bd7a564372c17e33fb4d # v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          EXPECTED_SHA: ${{ github.sha }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BILLING_WEBHOOK_SECRET: ${{ secrets.BILLING_WEBHOOK_SECRET }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          AUTH_SESSION_ENCRYPTION_KEY: ${{ secrets.AUTH_SESSION_ENCRYPTION_KEY }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 30m
          envs: EXPECTED_SHA,CRON_SECRET,BILLING_WEBHOOK_SECRET,UPSTASH_REDIS_REST_URL,UPSTASH_REDIS_REST_TOKEN,AUTH_SESSION_ENCRYPTION_KEY
          script: |
            set -eu
            echo "[CI/CD] Starting deployment on Ubuntu Server..."
            LIVE_DIR="$HOME/Vocab"
            BUILD_DIR="$HOME/Vocab-build"
            printf '%s\n' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'
            mkdir -p "$LIVE_DIR" "$BUILD_DIR"
            git -C "$BUILD_DIR" init -q
            git -C "$BUILD_DIR" remote remove origin 2>/dev/null || true
            git -C "$BUILD_DIR" remote add origin https://github.com/FengProfessor/Vocab.git
            git -C "$BUILD_DIR" fetch --no-tags origin "$EXPECTED_SHA"
            git -C "$BUILD_DIR" checkout --detach --force "$EXPECTED_SHA"
            bash "$BUILD_DIR/deploy/run-deploy.sh" "$EXPECTED_SHA" "$BUILD_DIR" "$LIVE_DIR"
