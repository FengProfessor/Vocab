name: Auto Deploy to Ubuntu Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  quality:
    name: Validate exact source before production changes
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch and immutable event SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/main' ] || ! [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Production deployment requires main and an exact commit SHA'
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require server-session configuration before production changes
        env:
          AUTH_SESSION_ENCRYPTION_KEY: ${{ secrets.AUTH_SESSION_ENCRYPTION_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          if ! [[ "$AUTH_SESSION_ENCRYPTION_KEY" =~ ^[0-9a-fA-F]{64}$ ]] ||
             ! [[ "$UPSTASH_REDIS_REST_URL" =~ ^https://[a-zA-Z0-9-]+\.upstash\.io/?$ ]] ||
             [ -z "$UPSTASH_REDIS_REST_TOKEN" ]; then
            echo '::error::Server-session configuration is missing or invalid'
            exit 1
          fi

      - name: Verify checkout identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 'front-end/package-lock.json'

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate deployment scripts and migration runner syntax
        run: |
          bash -n deploy/activate-release.sh deploy/prepare-source.sh deploy/run-deploy.sh
          bash -n front-end/scripts/backup/create.sh
          node --check front-end/scripts/apply-p0-migrations.mjs
          node --check front-end/tests/deploy/ssh-render.test.mjs

      - name: Deployment safety tests
        run: |
          bash front-end/tests/deploy/prepare-source.test.sh
          bash front-end/tests/deploy/activate-release.test.sh
          bash front-end/tests/deploy/run-deploy.test.sh
          node front-end/tests/deploy/ssh-render.test.mjs

      - name: Install frontend dependencies & verify build
        working-directory: front-end
        run: |
          npm ci
          npm run typecheck
          npm run test:unit
          npx vite build

      - name: Build & test .NET 10 backend
        working-directory: back-end
        run: |
          dotnet restore LingoPro.sln
          dotnet build LingoPro.sln --configuration Release --no-restore
          dotnet test LingoPro.sln --configuration Release --no-build --filter "Category!=KnownDeviation" --verbosity minimal

  migrate:
    name: Apply required database migrations
    needs: quality
    uses: ./.github/workflows/apply-p0-migrations.yml
    secrets: inherit

  deploy:
    name: Deploy to LingoPro Ubuntu Server
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale VPN
        uses: tailscale/github-action@4e4c49acaa9818630ce0bd7a564372c17e33fb4d # v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          EXPECTED_SHA: ${{ github.sha }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BILLING_WEBHOOK_SECRET: ${{ secrets.BILLING_WEBHOOK_SECRET }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          AUTH_SESSION_ENCRYPTION_KEY: ${{ secrets.AUTH_SESSION_ENCRYPTION_KEY }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 30m
          envs: EXPECTED_SHA,CRON_SECRET,BILLING_WEBHOOK_SECRET,UPSTASH_REDIS_REST_URL,UPSTASH_REDIS_REST_TOKEN,AUTH_SESSION_ENCRYPTION_KEY
          script: |
            set -eu
            echo "[CI/CD] Starting deployment on Ubuntu Server..."
            LIVE_DIR="$HOME/Vocab"
            BUILD_DIR="$HOME/Vocab-build"
            printf '%s\n' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'
            mkdir -p "$LIVE_DIR" "$BUILD_DIR"
            git -C "$BUILD_DIR" init -q
            git -C "$BUILD_DIR" remote remove origin 2>/dev/null || true
            git -C "$BUILD_DIR" remote add origin https://github.com/FengProfessor/Vocab.git
            git -C "$BUILD_DIR" fetch --no-tags origin "$EXPECTED_SHA"
            git -C "$BUILD_DIR" checkout --detach --force "$EXPECTED_SHA"
            bash "$BUILD_DIR/deploy/run-deploy.sh" "$EXPECTED_SHA" "$BUILD_DIR" "$LIVE_DIR"
