name: Auto Deploy to Ubuntu Server

on:
  push:
    branches:
      - main
      - codex/grammar-research
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to LingoPro Ubuntu Server
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT != '' && secrets.SERVER_PORT || 22 }}
          timeout: 120s
          command_timeout: 30m
          script_stop: true
          script: |
            set -ex
            echo "🚀 [CI/CD] Starting Auto-Deployment on Ubuntu Server..."
            
            TARGET_DIR="$HOME/Vocab"
            if [ ! -d "$TARGET_DIR" ]; then
              echo "Creating $TARGET_DIR directory..."
              mkdir -p "$TARGET_DIR"
            fi
            
            cd "$TARGET_DIR"
            
            if [ ! -d ".git" ]; then
              echo "Cloning repository..."
              git clone https://github.com/FengProfessor/Vocab.git .
            else
              echo "Fetching latest changes..."
              git fetch origin
              git reset --hard origin/${{ github.ref_name }}
            fi
            
            if [ -d "web-app" ]; then
              cd web-app
            fi
            
            echo "📦 Building Next.js Standalone Production Bundle..."
            npm install --production=false
            npm run build
            
            if [ -d ".next/standalone" ]; then
              echo "Copying static assets to standalone bundle..."
              cp -r .next/static .next/standalone/.next/ 2>/dev/null || true
              cp -r public .next/standalone/ 2>/dev/null || true
              mkdir -p .next/standalone/src 2>/dev/null || true
              cp -r src/data .next/standalone/src/ 2>/dev/null || true
            fi
            
            echo "🔄 Restarting lingopro.service..."
            sudo systemctl restart lingopro.service
            echo "✅ [CI/CD] Deployment Completed Successfully!"
