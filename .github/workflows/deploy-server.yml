name: Auto Deploy to Ubuntu Server

on:
  push:
    branches:
      - main
      - codex/grammar-research
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to LingoPro Ubuntu Server
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 30m
          script_stop: true
          script: |
            set -x
            echo "🚀 [CI/CD] Starting Auto-Deployment on Ubuntu Server..."
            
            TARGET_DIR="$HOME/Vocab"
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"
            echo "📍 Working directory: $(pwd)"
            
            if [ ! -d ".git" ]; then
              echo "Cloning repository..."
              git clone https://github.com/FengProfessor/Vocab.git .
            fi
            
            echo "Fetching latest code..."
            git remote set-url origin https://github.com/FengProfessor/Vocab.git 2>/dev/null || true
            git fetch origin main || echo "git fetch warning"
            git reset --hard origin/main || echo "git reset warning"
            
            if [ -d "web-app" ]; then
              cd web-app
            fi
            echo "📍 App directory: $(pwd)"
            
            echo "📦 Installing dependencies..."
            npm install --production=false
            
            echo "🏗️ Building Next.js application..."
            export NODE_OPTIONS="--max-old-space-size=4096"
            if ! npm run build; then
              echo "❌ npm run build failed!"
              exit 1
            fi
            
            if [ -d ".next/standalone" ]; then
              echo "Copying static assets to standalone bundle..."
              cp -r .next/static .next/standalone/.next/ 2>/dev/null || true
              cp -r public .next/standalone/ 2>/dev/null || true
              mkdir -p .next/standalone/src 2>/dev/null || true
              cp -r src/data .next/standalone/src/ 2>/dev/null || true
            fi
            
            echo "🔄 Restarting lingopro.service..."
            if sudo -n systemctl restart lingopro.service 2>/dev/null; then
              echo "Service restarted via sudo -n systemctl"
            elif sudo systemctl restart lingopro.service 2>/dev/null; then
              echo "Service restarted via sudo systemctl"
            elif systemctl restart lingopro.service 2>/dev/null; then
              echo "Service restarted via systemctl"
            elif pm2 restart all 2>/dev/null; then
              echo "Service restarted via pm2"
            else
              echo "Warning: Automatic service restart fallback attempted"
            fi
            
            echo "✅ [CI/CD] Deployment Completed Successfully!"
