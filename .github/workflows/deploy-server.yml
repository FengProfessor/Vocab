name: Auto Deploy to Ubuntu Server

on:
  push:
    branches:
      - main
      - codex/grammar-research
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to LingoPro Ubuntu Server
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "🚀 [CI/CD] Starting Auto-Deployment on Ubuntu Server..."
            cd ~/Vocab || exit 1
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}
            
            if [ -d "web-app" ]; then
              cd web-app
            fi
            
            echo "📦 Building Next.js Standalone Production Bundle..."
            npm install --production=false
            npm run build
            
            if [ -d ".next/standalone" ]; then
              cp -r .next/static .next/standalone/.next/ 2>/dev/null || true
              cp -r public .next/standalone/ 2>/dev/null || true
            fi
            
            echo "🔄 Restarting lingopro.service..."
            sudo systemctl restart lingopro.service
            echo "✅ [CI/CD] Deployment Completed Successfully!"
