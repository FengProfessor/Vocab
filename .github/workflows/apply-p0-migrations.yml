name: Apply P0 security migrations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260710_security_hardening.sql'
      - 'supabase/migrations/20260710_atomic_paid_order_confirmation.sql'
      - 'scripts/apply-p0-migrations.mjs'
      - '.github/workflows/apply-p0-migrations.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    if: ${{ secrets.SUPABASE_DB_PASSWORD != '' || secrets.DATABASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install pg
      - name: Apply migrations
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_REGION: ${{ secrets.SUPABASE_DB_REGION }}
        run: node scripts/apply-p0-migrations.mjs
