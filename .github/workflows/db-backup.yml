name: Daily Supabase Backup

# Sao lưu toàn bộ database Supabase mỗi đêm — MIỄN PHÍ, không cần Supabase Pro.
# Cách hoạt động: pg_dump xuất toàn bộ DB ra 1 file .sql → nén gzip → cất vào
# "Artifacts" của GitHub (giữ 30 ngày). Mất data thì tải file về dựng lại.

on:
  schedule:
    - cron: '0 19 * * *'   # 19:00 UTC = 02:00 sáng giờ VN
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump, verify & nén database
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail

          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Thiếu repo secret SUPABASE_DB_URL — xem hướng dẫn ở đầu file."
            exit 1
          fi

          STAMP=$(date +%Y%m%d_%H%M%S)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          SQL_FILE="lingopro_backup_${STAMP}.sql"
          GZ_FILE="${SQL_FILE}.gz"

          # Sửa URL Supabase để chạy pg_dump an toàn trên GitHub Actions:
          # 1. Đổi port Transaction (6543) sang Session (5432)
          PG_URL="${DATABASE_URL/6543/5432}"
          
          # 2. Nếu dùng pooler Supavisor, username bắt buộc phải là postgres.[project-id]
          # Bỏ qua username trong URL và ép cứng bằng cờ -U để pg_dump luôn đúng.
          PG_USER="postgres"
          if [[ "$PG_URL" == *"pooler.supabase.com"* ]]; then
            PG_USER="postgres.jyhdxhqkftirncbstfpe"
          fi

          # set -o pipefail: pg_dump lỗi → pipeline fail (tránh gzip file rác)
          set -o pipefail
          docker run --rm postgres:15-alpine \
            pg_dump --no-owner --no-privileges -U "$PG_USER" "$PG_URL" \
            > "$SQL_FILE"

          # File SQL phải có nội dung thật
          if [ ! -s "$SQL_FILE" ]; then
            echo "::error::pg_dump tạo file rỗng."
            exit 1
          fi

          # Sanity: dump Postgres thường bắt đầu bằng comment/-- PostgreSQL
          if ! head -c 200 "$SQL_FILE" | grep -Eqi 'PostgreSQL|pg_dump|SET |CREATE |--'; then
            echo "::error::Nội dung dump không giống SQL Postgres."
            head -c 200 "$SQL_FILE" || true
            exit 1
          fi

          gzip -9 "$SQL_FILE"

          if [ ! -s "$GZ_FILE" ]; then
            echo "::error::File gzip rỗng."
            exit 1
          fi

          # Kiểm tra gzip hợp lệ (phát hiện nén hỏng)
          gunzip -t "$GZ_FILE"

          echo "Dung lượng file backup:"
          ls -lh "$GZ_FILE"
          echo "OK backup verified: $GZ_FILE"

      - name: Cất file backup vào Artifacts (giữ 30 ngày)
        uses: actions/upload-artifact@v4
        with:
          name: lingopro-backup-${{ env.STAMP }}
          path: lingopro_backup_*.sql.gz
          retention-days: 30
