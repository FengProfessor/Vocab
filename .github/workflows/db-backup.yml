name: Daily Supabase Backup

on:
  schedule:
    - cron: '0 19 * * *' # 02:00 Vietnam
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install distribution age when encryption configured
        env:
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: |
          if [ -n "$BACKUP_AGE_RECIPIENT" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y age
          fi
      - name: Dump, compress, optionally encrypt and verify
        id: dump
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_REF: jyhdxhqkftirncbstfpe
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          BACKUP_REQUIRE_ENCRYPTION: ${{ vars.BACKUP_REQUIRE_ENCRYPTION }}
        run: bash scripts/backup/create.sh
      - name: Store verified backup and checksum (30 days)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lingopro-backup-${{ steps.dump.outputs.stamp }}
          path: ${{ steps.dump.outputs.directory }}
          if-no-files-found: error
          retention-days: 30
      - name: Install verified rclone
        env:
          RCLONE_VERSION: 1.75.1
          RCLONE_SHA256: 982b5aa772841168f8e380f139e9e787b2a105403e32b94da8676a0e1c0a13ab
        run: |
          set -euo pipefail
          ARCHIVE="rclone-v${RCLONE_VERSION}-linux-amd64.zip"
          curl --fail --silent --show-error --location \
            "https://downloads.rclone.org/v${RCLONE_VERSION}/${ARCHIVE}" \
            --output "$RUNNER_TEMP/$ARCHIVE"
          echo "$RCLONE_SHA256  $RUNNER_TEMP/$ARCHIVE" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/$ARCHIVE" -d "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/rclone-v${RCLONE_VERSION}-linux-amd64/rclone" "$RUNNER_TEMP/rclone"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Upload and verify backup plus manifest on Google Drive
        env:
          GDRIVE_RCLONE_CONFIG: ${{ secrets.GDRIVE_RCLONE_CONFIG }}
          BACKUP_DIRECTORY: ${{ steps.dump.outputs.directory }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "${GDRIVE_RCLONE_CONFIG:-}" ]; then
            echo '::error::Missing GDRIVE_RCLONE_CONFIG'
            exit 1
          fi
          CONFIG_FILE=$(mktemp "$RUNNER_TEMP/lingopro-rclone.XXXXXX")
          trap 'rm -f -- "$CONFIG_FILE"' EXIT
          printf '%s' "$GDRIVE_RCLONE_CONFIG" > "$CONFIG_FILE"
          rclone copy "$BACKUP_DIRECTORY" 'gdrive:LingoPro Automated Backups' \
            --config "$CONFIG_FILE" --checksum --drive-chunk-size 32M \
            --retries 3 --low-level-retries 10 --stats-one-line
          rclone check "$BACKUP_DIRECTORY" 'gdrive:LingoPro Automated Backups' \
            --config "$CONFIG_FILE" --one-way
          echo '[Backup] Google Drive backup and manifest verified'
      - name: Remove runner backup files
        if: ${{ always() }}
        env:
          PRIVATE_DIRECTORY: ${{ steps.dump.outputs.private_directory }}
        run: |
          if [ -n "$PRIVATE_DIRECTORY" ] && [[ "$PRIVATE_DIRECTORY" == "$RUNNER_TEMP"/lingopro-backup.* ]]; then
            rm -rf -- "$PRIVATE_DIRECTORY"
          fi
