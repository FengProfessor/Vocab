name: Dense Due Push Notifications

# Trigger /api/cron/push-due mỗi 15 phút trên Self-Hosted PC Server.
# Cooldown re-nag ~90p trong route; im 22:30–05:30 VN.
#
# BẮT BUỘC: GitHub repo secret CRON_SECRET = đúng env CRON_SECRET production trên PC Server.
# Secret sai → HTTP 401 → học sinh không nhận TB. Check: Actions tab + log HTTP code.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger push-due
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Missing CRON_SECRET repo secret — set it to match server .env.local CRON_SECRET"
            exit 1
          fi
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://lingopro.online/api/cron/push-due")
          echo "HTTP $code"
          cat /tmp/resp.json || true
          echo ""
          if [ "$code" != "200" ]; then
            echo "::error::push-due failed HTTP $code (thường do CRON_SECRET sai so với server .env.local)"
            exit 1
          fi
          # Log tóm tắt notified nếu JSON parse được
          if command -v jq >/dev/null 2>&1; then
            jq '{success, vnHour, vnMinute, notified, total, skipped, cooldownMinutes}' /tmp/resp.json || true
          fi
