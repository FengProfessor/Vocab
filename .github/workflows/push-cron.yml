name: Hourly Push Notifications

# Lịch tự động trigger /api/cron/push-due. GitHub Actions là nguồn cron CHÍNH
# (in-repo, xem được lịch sử chạy ở tab Actions) vì cron-job.org không tự verify được.
# Chạy đúng 3 mốc nhắc 8h/12h/20h VN = 1h/5h/13h UTC (route tự gate REMINDER_HOURS).
# GitHub Actions schedule có thể trễ ~vài phút nhưng vẫn trong cùng giờ → route vẫn khớp.
#
# Yêu cầu: repo secret CRON_SECRET khớp env CRON_SECRET trên Vercel.
# ⚠️ Nếu cron-job.org cũng đang bật cho cùng URL → TẮT 1 trong 2 để tránh push trùng.

on:
  schedule:
    - cron: '0 1,5,13 * * *' # 8h/12h/20h VN (UTC+7). Route gate đúng các mốc này.
  workflow_dispatch: {} # vẫn cho chạy thủ công để test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger push-due
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Missing CRON_SECRET repo secret"
            exit 1
          fi
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://vocab-taupe.vercel.app/api/cron/push-due")
          echo "HTTP $code"
          cat /tmp/resp.json
          test "$code" = "200"
