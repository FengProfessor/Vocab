name: Hourly Push Notifications

# Lịch tự động ĐÃ CHUYỂN sang cron-job.org (đáng tin hơn GitHub Actions schedule,
# vốn hay trễ/skip giờ cao điểm). Giữ workflow này để chạy TAY khi cần test.
# Muốn bật lại lịch GitHub Actions: bỏ comment 2 dòng schedule bên dưới.
#
# Yêu cầu (nếu bật lại): repo secret CRON_SECRET khớp env CRON_SECRET trên Vercel.

on:
  # schedule:
  #   - cron: '0 * * * *'   # đầu mỗi giờ (UTC) — đã tắt, dùng cron-job.org thay
  workflow_dispatch: {} # vẫn cho chạy thủ công để test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger push-due
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Missing CRON_SECRET repo secret"
            exit 1
          fi
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://vocab-taupe.vercel.app/api/cron/push-due")
          echo "HTTP $code"
          cat /tmp/resp.json
          test "$code" = "200"
