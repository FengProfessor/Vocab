name: Dense Due Push Notifications

# Lịch tự động trigger /api/cron/push-due.
# Poll mỗi 15 phút để BẮT due sớm (không cố định 8/12/20).
# Route cooldown ~90 phút giữa 2 lần push nếu user vẫn chưa ôn (không spam 15p/lần).
# Im ban đêm 22:00–06:59 VN.
#
# GitHub Actions schedule có thể trễ vài phút — route dùng giờ VN thực tế lúc chạy.
#
# Yêu cầu: repo secret CRON_SECRET khớp env CRON_SECRET trên Vercel/host.
# ⚠️ Nếu cron-job.org cũng đang bật cho cùng URL → TẮT cron-job.org (tránh double load).

on:
  schedule:
    # Poll 15p: phát hiện due sớm. Tần suất push thực tế do COOLDOWN_MINUTES (route, ~90p).
    - cron: '*/15 * * * *'
  workflow_dispatch: {} # chạy thủ công để test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger push-due
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Missing CRON_SECRET repo secret"
            exit 1
          fi
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://lingopro.online/api/cron/push-due")
          echo "HTTP $code"
          cat /tmp/resp.json
          test "$code" = "200"
