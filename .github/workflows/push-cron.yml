name: Dense Due Push Notifications

# Schedule gọi push-due nghiệp vụ; workflow_dispatch chỉ kiểm tra auth bằng auth-check.
# Cooldown re-nag ~90p trong route; im 22:30–05:30 VN.
#
# BẮT BUỘC: GitHub repo secret CRON_SECRET = đúng env CRON_SECRET production.
# Không in response body, Authorization header hoặc secret vào Actions log.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Run scheduled push-due
        if: ${{ github.event_name == 'schedule' }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          endpoint='/api/cron/push-due'
          if [ -z "$CRON_SECRET" ]; then
            echo '::error::Missing CRON_SECRET repo secret'
            exit 1
          fi
          code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://lingopro.online/api/cron/push-due")
          echo "endpoint=$endpoint"
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::scheduled push-due failed HTTP $code"
            exit 1
          fi
          echo 'PASS'

      - name: Verify cron auth without business side effects
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          endpoint='/api/cron/auth-check'
          if [ -z "$CRON_SECRET" ]; then
            echo '::error::Missing CRON_SECRET repo secret'
            exit 1
          fi
          code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --max-time 30 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://lingopro.online/api/cron/auth-check")
          echo "endpoint=$endpoint"
          echo "HTTP $code"
          if [ "$code" != "204" ]; then
            echo "::error::cron auth probe failed HTTP $code"
            exit 1
          fi
          echo 'PASS'
