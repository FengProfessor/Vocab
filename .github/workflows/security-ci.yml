name: Auth Security CI

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/security-ci.yml'
      - '.github/workflows/deploy-server.yml'
      - 'deploy/**'
      - 'tests/deploy/**'
      - '.github/workflows/push-cron.yml'
      - 'src/lib/api-security.ts'
      - 'src/lib/distributed-rate-limit.ts'
      - 'src/lib/billing-webhook-auth.ts'
      - 'src/lib/anti-scrape.ts'
      - 'src/lib/entitlement-server.ts'
      - 'src/app/api/billing/webhook/**'
      - 'src/app/api/demo/codemix-upgrade/**'
      - 'src/app/api/practice/pack-passage/**'
      - 'src/app/api/translate/**'
      - 'src/lib/internal-redirect.ts'
      - 'src/lib/cron-auth.ts'
      - 'src/lib/supabase.ts'
      - 'src/lib/supabase-server.ts'
      - 'src/lib/server-session-store.ts'
      - 'src/lib/server-auth-session.ts'
      - 'src/lib/session-response.ts'
      - 'src/lib/app-session-types.ts'
      - 'src/lib/app-auth-client.ts'
      - 'src/lib/auth-fetch.ts'
      - 'src/app/api/auth/**'
      - 'supabase/migrations/20261001_app_auth_session_active.sql'
      - 'src/lib/ai-router.ts'
      - 'src/lib/gemini-multi.ts'
      - 'src/lib/notifications.ts'
      - 'src/app/auth/**'
      - 'src/app/api/auth/register/**'
      - 'src/app/api/speaking/upload-audio/**'
      - 'src/app/api/test/notify/**'
      - 'src/app/api/cron/**'
      - 'src/app/api/challenges/check-daily/**'
      - 'src/app/api/billing/claim-upgrade-gift/**'
      - 'src/app/api/campaign/claim-upgrade-gift/**'
      - 'src/app/api/teacher/students/add/**'
      - 'src/components/campaign/UpgradeGiftModal.tsx'
      - 'src/components/teacher/StudentsPanel.tsx'
      - 'scripts/apply-fcm-token-unique.ts'
      - 'scripts/broadcast-fcm.ts'
      - 'scripts/onboard_students_tonight.ts'
      - 'scripts/push-zhipu-vercel.mjs'
      - 'scripts/seed_toeic_demo.ts'
      - 'scripts/test-gemini-image.ts'
      - 'tests/security/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cron-auth:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: p2c-isolated-test
          POSTGRES_DB: p2c_session_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install isolated SQL test client without lifecycle scripts
        run: npm install --prefix scripts --no-save --package-lock=false --ignore-scripts pg@8.16.3
      - name: Security regression tests
        env:
          P2B_REDIS_TEST_PORT: '6379'
          P2C_REDIS_TEST_PORT: '6379'
          P2C_POSTGRES_TEST_URL: 'postgresql://postgres:p2c-isolated-test@127.0.0.1:5432/p2c_session_test'
        run: |
          node tests/security/cron-auth.test.mjs
          node tests/security/cron-auth-probe.test.mjs
          node tests/security/privilege-entitlement.test.mjs
          node tests/security/phase1c-auth-boundaries.test.mjs
          node tests/security/phase2a-medium.test.mjs
          node tests/security/phase2b-enforcement.test.mjs
          node tests/security/phase2c-session-store.test.mjs
          node tests/security/phase2c-provider-session.test.mjs
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Validate workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11 -color=false
      - name: Deployment safety tests
        run: |
          bash tests/deploy/prepare-source.test.sh
          bash tests/deploy/activate-release.test.sh
          bash tests/deploy/run-deploy.test.sh
          node tests/deploy/ssh-render.test.mjs
      - name: Build application
        run: npm run build
      - name: Verify documented typecheck baseline
        shell: bash
        run: |
          set +e
          output=$(npm run typecheck 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          errors=$(printf '%s\n' "$output" | grep -c 'error TS' || true)
          expected=$(printf '%s\n' "$output" | grep -Ec 'error TS(2307|7006):' || true)
          if [ "$status" -eq 0 ] || [ "$errors" -ne 10 ] || [ "$expected" -ne 10 ]; then
            echo '::error::Typecheck differs from the documented 10-error TS2307/TS7006 baseline'
            exit 1
          fi
      - name: Check patch whitespace
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA...HEAD"
