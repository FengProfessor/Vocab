name: LingoPro Monorepo CI

on:
  pull_request:
    branches:
      - main
      - development
    paths:
      - '.github/workflows/**'
      - 'front-end/**'
      - 'back-end/**'
      - 'deploy/**'
  push:
    branches:
      - development
    paths:
      - '.github/workflows/**'
      - 'front-end/**'
      - 'back-end/**'
      - 'deploy/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-ci:
    name: Frontend (React 19 + Vite + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'front-end/package-lock.json'

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run frontend unit tests (Vitest)
        run: npm run test:unit

      - name: Build production SPA bundle (Vite)
        run: npx vite build

  backend-ci:
    name: Backend (.NET 10 Clean Architecture + NUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet dependencies
        run: dotnet restore LingoPro.sln

      - name: Build .NET 10 solution
        run: dotnet build LingoPro.sln --configuration Release --no-restore

      - name: Run Domain & Application unit tests (NUnit)
        run: dotnet test LingoPro.sln --configuration Release --no-build --filter "Category!=KnownDeviation" --verbosity normal

  workflow-and-deploy-check:
    name: Workflow & Deploy Scripts Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Validate deployment & backup shell scripts syntax
        run: |
          bash -n deploy/activate-release.sh deploy/prepare-source.sh deploy/run-deploy.sh
          bash -n front-end/scripts/backup/create.sh
          node --check front-end/scripts/apply-p0-migrations.mjs
          node --check front-end/tests/deploy/ssh-render.test.mjs

      - name: Run deployment safety tests
        run: |
          bash front-end/tests/deploy/prepare-source.test.sh
          bash front-end/tests/deploy/activate-release.test.sh
          bash front-end/tests/deploy/run-deploy.test.sh
          node front-end/tests/deploy/ssh-render.test.mjs

      - name: Check patch whitespace
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA...HEAD"
