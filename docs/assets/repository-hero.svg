<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title description" xml:lang="en">
  <title id="title">LingoPro — Learn it. Recall it. Use it.</title>
  <desc id="description">English learning for Vietnamese speakers. An illustrated vocabulary card pairs curiosity with sự tò mò. Three connected cards show the learning loop: save vocabulary, review with FSRS, and practice in context.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFF"/>
      <stop offset="1" stop-color="#F0F4FB"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="m2 1 3 3-3 3" fill="none" stroke="#9BA9C6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1280" height="560" rx="28" fill="url(#background)"/>
  <rect x="1" y="1" width="1278" height="558" rx="27" fill="none" stroke="#DFE6F2" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <!-- Dấu sách gợi lại việc lưu từ và hai ngôn ngữ gặp nhau. -->
    <rect x="64" y="60" width="68" height="68" rx="20" fill="#4F46E5"/>
    <path d="M80 78h10c5 0 8 2 8 5v25c-3-3-6-4-10-4h-8zm36 0h-10c-5 0-8 2-8 5v25c3-3 6-4 10-4h8z" fill="none" stroke="#FFF" stroke-width="3" stroke-linejoin="round"/>
    <path d="m108 87 3 3 6-7" fill="none" stroke="#99F6E4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="150" y="114" fill="#182442" font-size="62" font-weight="750" letter-spacing="-2">LingoPro</text>
    <text x="64" y="196" fill="#182442" font-size="40" font-weight="650" letter-spacing="-1.1">Learn it. Recall it. Use it.</text>
    <text x="64" y="240" fill="#576682" font-size="24">English learning for Vietnamese speakers</text>

    <!-- Thẻ minh họa từ vựng; không mô phỏng giao diện sản phẩm. -->
    <circle cx="1032" cy="150" r="115" fill="#E7EAFE"/>
    <circle cx="1032" cy="150" r="93" fill="none" stroke="#D5DBF8"/>
    <g transform="rotate(9 1036 148)">
      <rect x="904" y="63" width="263" height="172" rx="22" fill="#CBD5F1"/>
    </g>
    <g transform="rotate(-6 1012 143)">
      <rect x="873" y="54" width="281" height="180" rx="22" fill="#FFF" stroke="#D8E0EF" stroke-width="2"/>
      <path d="M1110 54v36l10-7 10 7V54" fill="#BDEEE4"/>
      <text x="899" y="115" fill="#27335B" font-size="34" font-weight="650" letter-spacing="-.6">curiosity</text>
      <text x="900" y="154" fill="#52627E" font-size="25">sự tò mò</text>
      <path d="M900 184h75" stroke="#E3E8F3" stroke-width="5" stroke-linecap="round"/>
      <path d="M989 184h31" stroke="#E3E8F3" stroke-width="5" stroke-linecap="round"/>
      <circle cx="1117" cy="193" r="24" fill="#4F46E5"/>
      <path d="m1107 193 7 7 13-15" fill="none" stroke="#FFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <path d="M1190 113v18m-9-9h18" stroke="#35A895" stroke-width="3" stroke-linecap="round"/>
    <circle cx="860" cy="193" r="5" fill="#A5B4FC"/>
    <path d="m1184 217 5 9 10 2-8 7 1 10-9-5-9 4 2-10-7-7 10-1z" fill="#C9D0EF"/>

    <!-- Ba bước và đường quay lại thể hiện vòng lặp học tập. -->
    <rect x="64" y="298" width="354" height="168" rx="22" fill="#FFF" stroke="#DDE4F0" stroke-width="2"/>
    <rect x="463" y="298" width="354" height="168" rx="22" fill="#4F46E5"/>
    <rect x="862" y="298" width="354" height="168" rx="22" fill="#FFF" stroke="#DDE4F0" stroke-width="2"/>

    <rect x="90" y="324" width="49" height="49" rx="14" fill="#EEF0FF"/>
    <path d="M106 335h17v27l-8.5-5-8.5 5z" fill="none" stroke="#5B54D8" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="155" y="358" fill="#263252" font-size="31" font-weight="650" letter-spacing="-.5">Save</text>
    <text x="92" y="415" fill="#5A6984" font-size="23">Words worth keeping.</text>

    <rect x="489" y="324" width="49" height="49" rx="14" fill="#6860EB"/>
    <path d="M526 345a12 12 0 1 0-2 13m2-20v8h-8" fill="none" stroke="#FFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="554" y="358" fill="#FFF" font-size="31" font-weight="650" letter-spacing="-.5">Review</text>
    <text x="491" y="415" fill="#E4E5FF" font-size="23">Spaced repetition. FSRS.</text>

    <rect x="888" y="324" width="49" height="49" rx="14" fill="#E5F7F2"/>
    <path d="M902 336h21v18h-10l-7 6v-6h-4z" fill="none" stroke="#208976" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M908 342h9m-9 6h6" stroke="#208976" stroke-width="2" stroke-linecap="round"/>
    <text x="953" y="358" fill="#263252" font-size="31" font-weight="650" letter-spacing="-.5">Practice</text>
    <text x="890" y="415" fill="#5A6984" font-size="23">Put English into context.</text>

    <path d="M430 381h20" stroke="#9BA9C6" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M829 381h20" stroke="#9BA9C6" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M1039 480v9a18 18 0 0 1-18 18H259a18 18 0 0 1-18-18v-7" fill="none" stroke="#BBC6DB" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  </g>
</svg>
