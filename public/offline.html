<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LingoPro — Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #9333ea 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 1rem;
    }

    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25);
    }

    .icon-wrap {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #ede9fe, #f3e8ff);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
    }

    .icon-wrap svg {
      width: 40px;
      height: 40px;
      color: #7c3aed;
    }

    .logo {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #6366f1;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #1e1b4b;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    p {
      font-size: 14px;
      color: #6b7280;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    button {
      background: linear-gradient(135deg, #6366f1, #7c3aed);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 14px 32px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.5);
    }

    button:active {
      transform: translateY(0);
    }

    .divider {
      height: 1px;
      background: #f3f4f6;
      margin: 24px 0;
    }

    .hint {
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">LingoPro</div>

    <div class="icon-wrap">
      <!-- WiFi-off SVG icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"/>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <circle cx="12" cy="20" r="1" fill="currentColor"/>
      </svg>
    </div>

    <h1>Không có kết nối internet</h1>
    <p>Kiểm tra kết nối mạng của bạn và thử lại. Một số tính năng có thể không hoạt động khi offline.</p>

    <button onclick="location.reload()">Thử lại ngay</button>

    <div class="divider"></div>
    <p class="hint">Các từ đã học vẫn được lưu cục bộ và sẽ đồng bộ khi có mạng.</p>
  </div>
</body>
</html>
