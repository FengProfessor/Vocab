s recommend diversifying your investment portfolio to minimize potential risks.", "vn_ex": "Các cố vấn tài chính khuyên bạn nên đa dạng hóa danh mục đầu tư để giảm thiểu các rủi ro tiềm ẩn."}, {"word": "sponsorship", "pos": "noun", "ipa": "/ˈspɑːnsərʃɪp/", "meaning": "sự tài trợ", "example": "The corporate sponsorship helped fund the annual technology and marketing exhibition.", "vn_ex": "Sự tài trợ của doanh nghiệp đã giúp tài trợ cho buổi triển lãm công nghệ và tiếp thị thường niên."}, {"word": "inventory", "pos": "noun", "ipa": "/ˈɪnvəntɔːri/", "meaning": "hàng tồn kho, sự kiểm kê", "example": "The retail store conducted a weekly inventory check to ensure all items were in stock.", "vn_ex": "Cửa hàng bán lẻ đã tiến hành kiểm kê hàng tồn kho hàng tuần để đảm bảo tất cả các mặt hàng đều có sẵn."}, {"word": "transaction", "pos": "noun", "ipa": "/trænˈzækʃn/", "meaning": "giao dịch", "example": "Online payment systems encrypt data to make every commercial transaction secure.", "vn_ex": "Các hệ thống thanh toán trực tuyến mã hóa dữ liệu để đảm bảo an toàn cho mọi giao dịch thương mại."}, {"word": "lease", "pos": "verb", "ipa": "/liːs/", "meaning": "thuê, hợp đồng cho thuê", "example": "The technology firm decided to lease new office space in the city center for its expansion.", "vn_ex": "Công ty công nghệ quyết định thuê một mặt bằng văn phòng mới ở trung tâm thành phố để mở rộng quy mô."}, {"word": "hedge", "pos": "verb", "ipa": "/hedʒ/", "meaning": "phòng ngừa rủi ro, bảo vệ (tài chính)", "example": "Many multinational corporations hedge against currency fluctuations to protect their export profits.", "vn_ex": "Nhiều tập đoàn đa quốc gia thực hiện phòng ngừa rủi ro biến động tiền tệ để bảo vệ lợi nhuận xuất khẩu của họ."}, {"word": "distribution", "pos": "noun", "ipa": "/ˌdɪstrɪˈbjuːʃn/", "meaning": "sự phân phối", "example": "Improving the logistics network will streamline the distribution of our products to global markets.", "vn_ex": "Việc cải thiện mạng lưới hậu cần sẽ hợp lý hóa quá trình phân phối sản phẩm của chúng tôi ra thị trường toàn cầu."}, {"word": "premium", "pos": "noun", "ipa": "/ˈpriːmiəm/", "meaning": "phí bảo hiểm, giá trị cộng thêm; cao cấp", "example": "The company charges a premium price for its eco-friendly and sustainably sourced products.", "vn_ex": "Công ty tính một mức giá cao hơn cho các sản phẩm thân thiện với môi trường và có nguồn gốc bền vững của mình."}, {"word": "client", "pos": "noun", "ipa": "/ˈklaɪənt/", "meaning": "khách hàng", "example": "The consulting agency always prioritizes the specific business goals of each client.", "vn_ex": "Đại lý tư vấn luôn ưu tiên các mục tiêu kinh doanh cụ thể của từng khách hàng."}, {"word": "impact", "pos": "noun", "ipa": "/ˈɪmpækt/", "meaning": "tác động, ảnh hưởng", "example": "The new regulatory policy is expected to have a major impact on retail sales figures.", "vn_ex": "Chính sách quản lý mới dự kiến sẽ có tác động lớn đến các con số doanh số bán lẻ."}, {"word": "authority", "pos": "noun", "ipa": "/əˈθɔːrəti/", "meaning": "cơ quan quản lý, thẩm quyền", "example": "The tax authority conducted a thorough audit of the international corporation's financial records.", "vn_ex": "Cơ quan thuế đã tiến hành kiểm toán kỹ lưỡng các hồ sơ tài chính của tập đoàn quốc tế."}, {"word": "obtain", "pos": "verb", "ipa": "/əbˈteɪn/", "meaning": "đạt được, thu được, xin được", "example": "The legal department worked diligently to obtain the necessary business licenses for the merger.", "vn_ex": "Bộ phận pháp lý đã làm việc chăm chỉ để xin được các giấy phép kinh doanh cần thiết cho việc sáp nhập."}, {"word": "maturity", "pos": "noun", "ipa": "/məˈtʃʊrəti/", "meaning": "kỳ hạn thanh toán, sự trưởng thành", "example": "These corporate bonds will reach maturity in five years, offering a stable interest rate.", "vn_ex": "Các trái phiếu doanh nghiệp này sẽ đến kỳ hạn thanh toán sau năm năm nữa, mang lại lãi suất ổn định."}, {"word": "publish", "pos": "verb", "ipa": "/ˈpʌblɪʃ/", "meaning": "xuất bản, công bố", "example": "Publicly traded corporations are legally required to publish their quarterly financial statements.", "vn_ex": "Các tập đoàn đại chúng được yêu cầu về mặt pháp lý phải công bố các báo cáo tài chính hàng quý của họ."}, {"word": "economist", "pos": "noun", "ipa": "/ɪˈkɑːnəmɪst/", "meaning": "nhà kinh tế học", "example": "The senior economist predicted that market growth would recover after the recession.", "vn_ex": "Nhà kinh tế học cấp cao dự báo rằng tăng trưởng thị trường sẽ phục hồi sau cuộc suy thoái."}, {"word": "media", "pos": "noun", "ipa": "/ˈmiːdiə/", "meaning": "phương tiện truyền thông", "example": "The marketing team launched a national advertising campaign across multiple social media platforms.", "vn_ex": "Đội ngũ tiếp thị đã khởi động một chiến dịch quảng cáo quốc gia trên nhiều nền tảng truyền thông xã hội."}, {"word": "marginal", "pos": "adjective", "ipa": "/ˈmɑːrdʒɪnl/", "meaning": "cận biên, không đáng kể, sát giới hạn", "example": "The slight decrease in operational costs resulted in only a marginal increase in our profit margin.", "vn_ex": "Sự giảm nhẹ trong chi phí vận hành chỉ mang lại một mức tăng không đáng kể trong biên lợi nhuận của chúng tôi."}, {"word": "seller", "pos": "noun", "ipa": "/ˈselər/", "meaning": "người bán", "example": "E-commerce platforms act as intermediaries between the buyer and the third-party seller.", "vn_ex": "Các nền tảng thương mại điện tử đóng vai trò là trung gian giữa người mua và người bán bên thứ ba."}, {"word": "candidate", "pos": "noun", "ipa": "/ˈkændɪdət/", "meaning": "ứng viên", "example": "The human resources manager interviewed each candidate for the sales director position.", "vn_ex": "Trưởng phòng nhân sự đã phỏng vấn từng ứng viên cho vị trí giám đốc kinh doanh."}, {"word": "merger", "pos": "noun", "ipa": "/ˈmɜːrdʒər/", "meaning": "sự sáp nhập", "example": "The merger of the two retail giants will create the largest commercial entity in the region.", "vn_ex": "Sự sáp nhập của hai gã khổng lồ bán lẻ sẽ tạo ra tổ chức thương mại lớn nhất trong khu vực."}, {"word": "audit", "pos": "noun", "ipa": "/ˈɔːdɪt/", "meaning": "sự kiểm toán, kiểm toán", "example": "An independent accounting firm was hired to conduct an annual financial audit for the corporation.", "vn_ex": "Một công ty kế toán độc lập đã được thuê để tiến hành kiểm toán tài chính hàng năm cho tập đoàn."}, {"word": "recession", "pos": "noun", "ipa": "/rɪˈseʃn/", "meaning": "sự suy thoái kinh tế", "example": "During the global recession, many businesses were forced to downsize and reduce operating expenses.", "vn_ex": "Trong thời kỳ suy thoái kinh tế toàn cầu, nhiều doanh nghiệp đã buộc phải thu hẹp quy mô và giảm chi phí hoạt động."}], "grammar_theory": "# Điều kiện trong đàm phán kinh doanh và xây dựng hợp đồng\n## Giới thiệu\nĐiều kiện trong tiếng Anh được sử dụng để diễn tả các tình huống có thể xảy ra trong tương lai hoặc các tình huống không chắc chắn. Trong kinh doanh, điều kiện được sử dụng để đàm phán và xây dựng hợp đồng.\n### Cấu trúc\n- **Zero Conditional**: `If + hiện tại, hiện tại` - dùng để diễn tả quy luật tự nhiên hoặc sự thật\n  Ví dụ: `If you heat water, it boils.` - Nếu bạn đun nước, nó sẽ sôi.\n- **First Conditional**: `If + hiện tại, tương lai` - dùng để diễn tả các tình huống có thể xảy ra trong tương lai\n  Ví dụ: `If it rains, we will take an umbrella.` - Nếu trời mưa, chúng tôi sẽ mang ô.\n- **Second Conditional**: `If + quá khứ, điều kiện hiện tại` - dùng để diễn tả các tình huống không chắc chắn hoặc không xảy ra trong thực tế\n  Ví dụ: `If I won the lottery, I would buy a house.` - Nếu tôi trúng số, tôi sẽ mua một ngôi nhà.\n- **Third Conditional**: `If + quá khứ, điều kiện quá khứ` - dùng để diễn tả các tình huống đã xảy ra trong quá khứ nhưng không có kết quả như mong đợi\n  Ví dụ: `If I had studied harder, I would have passed the exam.` - Nếu tôi học chăm chỉ hơn, tôi sẽ đỗ kỳ thi.", "quiz": [{"question": "Nếu công ty ___ tăng trưởng, chúng tôi sẽ đầu tư thêm.", "options": ["sẽ có", "có", "đã có", "sẽ không có"], "answer": 0, "explanation": "Câu hỏi sử dụng điều kiện đầu tiên để diễn tả một tình huống có thể xảy ra trong tương lai, vì vậy sử dụng `sẽ có` để chỉ ra sự tăng trưởng trong tương lai."}, {"question": "Nếu tôi ___ kinh nghiệm làm việc, tôi sẽ được tuyển dụng.", "options": ["có", "đã có", "sẽ có", "có thể có"], "answer": 1, "explanation": "Câu hỏi sử dụng điều kiện thứ hai để diễn tả một tình huống không chắc chắn hoặc không xảy ra trong thực tế, vì vậy sử dụng `đã có` để chỉ ra một điều kiện trong quá khứ."}, {"question": "Nếu trời ___ mưa, chúng tôi sẽ đi dạo.", "options": ["sẽ", "không", "đã", "không sẽ"], "answer": 0, "explanation": "Câu hỏi sử dụng điều kiện đầu tiên để diễn tả một tình huống có thể xảy ra trong tương lai, vì vậy sử dụng `sẽ` để chỉ ra một điều kiện trong tương lai."}, {"question": "Nếu công ty ___ đầu tư vào dự án, chúng tôi sẽ có lợi nhuận.", "options": ["đã", "sẽ", "có thể", "không"], "answer": 0, "explanation": "Câu hỏi sử dụng điều kiện thứ hai để diễn tả một tình huống không chắc chắn hoặc không xảy ra trong thực tế, nhưng trong trường hợp này, câu hỏi đang hỏi về một hành động trong quá khứ nên sử dụng `đã`."}, {"question": "Nếu bạn ___ chăm chỉ, bạn sẽ thành công.", "options": ["là", "đã là", "sẽ là", "có thể là"], "answer": 1, "explanation": "Câu hỏi sử dụng điều kiện thứ hai để diễn tả một tình huống không chắc chắn hoặc không xảy ra trong thực tế, vì vậy sử dụng `đã là` để chỉ ra một trạng thái trong quá khứ."}]}};
    let currentUnit = Object.keys(slideData)[0];
    let currentTab = 'vocab';

    function init() {
      const listContainer = document.getElementById('unitList');
      listContainer.innerHTML = '';
      
      Object.keys(slideData).forEach((unitName, idx) => {
        const li = document.createElement('li');
        li.className = 'unit-item' + (unitName === currentUnit ? ' active' : '');
        li.textContent = unitName;
        li.onclick = () => selectUnit(unitName);
        listContainer.appendChild(li);
      });

      renderContent();
    }

    function selectUnit(unitName) {
      currentUnit = unitName;
      document.querySelectorAll('.unit-item').forEach(item => {
        item.classList.toggle('active', item.textContent === unitName);
      });
      renderContent();
    }

    function switchTab(tabName) {
      currentTab = tabName;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('onclick').includes(tabName));
      });
      
      document.getElementById('vocabTab').classList.toggle('hidden', tabName !== 'vocab');
      document.getElementById('grammarTab').classList.toggle('hidden', tabName !== 'grammar');
      document.getElementById('quizTab').classList.toggle('hidden', tabName !== 'quiz');
    }

    function renderContent() {
      const unit = slideData[currentUnit];
      
      // Render Vocab
      const vocabTab = document.getElementById('vocabTab');
      vocabTab.innerHTML = unit.vocab.map(w => `
        <div class="vocab-card">
          <div class="vocab-word">${w.word}</div>
          <div class="vocab-meta">
            <span>(${w.pos})</span>
            <span class="vocab-ipa">${w.ipa || ''}</span>
          </div>
          <div class="vocab-meaning">${w.meaning}</div>
          <div class="vocab-ex">
            <div>${w.example}</div>
            <div class="vocab-ex-vn">${w.vn_ex}</div>
          </div>
        </div>
      `).join('');

      // Render Grammar
      const grammarTab = document.getElementById('grammarTab');
      // Simple markdown parser wrapper
      let mdHtml = unit.grammar_theory || '<p>Đang cập nhật...</p>';
      mdHtml = mdHtml
        .replace(/### (.*)/g, '<h3>$1</h3>')
        .replace(/## (.*)/g, '<h2>$1</h2>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/`(.*?)`/g, '<code>$1</code>')
        .replace(/\n/g, '<br>');
      grammarTab.innerHTML = mdHtml;

      // Render Quiz
      document.getElementById('quizUnitName').textContent = currentUnit;
      const quizContent = document.getElementById('quizContent');
      quizContent.innerHTML = (unit.quiz || []).map((q, qIdx) => `
        <div class="quiz-card" id="q_${qIdx}">
          <div class="quiz-question">${qIdx + 1}. ${q.question}</div>
          <div class="quiz-options">
            ${q.options.map((opt, oIdx) => `
              <div class="quiz-option" onclick="answerQuiz(${qIdx}, ${oIdx}, ${q.answer})">
                <span>${['A', 'B', 'C', 'D'][oIdx]}.</span>
                <span>${opt}</span>
              </div>
            `).join('')}
          </div>
          <div class="quiz-explanation hidden" id="exp_${qIdx}">
            <strong>Giải thích:</strong> ${q.explanation}
          </div>
        </div>
      `).join('');
    }

    function answerQuiz(qIdx, selectedIdx, correctIdx) {
      const card = document.getElementById(`q_${qIdx}`);
      const options = card.querySelectorAll('.quiz-option');
      const exp = document.getElementById(`exp_${qIdx}`);
      
      // Lock click
      options.forEach(opt => opt.style.pointerEvents = 'none');
      
      options[selectedIdx].classList.add(selectedIdx === correctIdx ? 'correct' : 'incorrect');
      if (selectedIdx !== correctIdx) {
        options[correctIdx].classList.add('correct');
      }
      
      exp.classList.remove('hidden');
    }

    let fontSize = 16;
    function changeFontSize(dir) {
      fontSize += dir * 2;
      document.body.style.fontSize = fontSize + 'px';
    }

    window.onload = init;
  </script>
</body>
</html>
