<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LingoPro - Lộ Trình NGSL & NAWL Chuẩn Quốc Tế</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: radial-gradient(circle at top, #1a2e26 0%, #0d1713 100%);
      --card-bg: rgba(30, 52, 43, 0.45);
      --text-main: #ffffff;
      --text-muted: #a0aec0;
      --primary: #34d399;
      --primary-glow: rgba(52, 211, 153, 0.4);
      --success: #48bb78;
      --error: #f56565;
      --border-color: rgba(255, 255, 255, 0.08);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    header {
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 30%, var(--primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .nav-buttons {
      display: flex;
      gap: 15px;
    }
    button {
      background: rgba(255, 255, 255, 0.05);
      color: white;
      border: 1px solid var(--border-color);
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s ease;
    }
    button:hover {
      background: var(--primary);
      box-shadow: 0 0 15px var(--primary-glow);
      border-color: transparent;
    }
    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
      width: 100%;
      flex: 1;
      display: flex;
      gap: 30px;
    }
    .sidebar {
      width: 300px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      height: fit-content;
      backdrop-filter: blur(10px);
    }
    .sidebar h3 {
      font-family: 'Outfit', sans-serif;
      margin-bottom: 15px;
      font-size: 18px;
      color: var(--primary);
    }
    .unit-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .unit-item {
      padding: 12px 15px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s ease;
    }
    .unit-item:hover, .unit-item.active {
      background: rgba(52, 211, 153, 0.15);
      border-color: var(--primary);
      color: var(--primary);
    }
    .main-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }
    .tab-bar {
      display: flex;
      gap: 15px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }
    .tab-btn {
      background: none;
      border: none;
      padding: 10px 20px;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 16px;
      border-bottom: 3px solid transparent;
      border-radius: 0;
    }
    .tab-btn:hover {
      color: white;
      background: none;
      box-shadow: none;
    }
    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    .content-area {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 40px;
      min-height: 500px;
      backdrop-filter: blur(10px);
      position: relative;
    }
    .vocab-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .vocab-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      transition: all 0.3s ease;
    }
    .vocab-card:hover {
      transform: translateY(-5px);
      border-color: var(--primary);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }
    .vocab-word {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 5px;
    }
    .vocab-meta {
      display: flex;
      gap: 10px;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 15px;
    }
    .vocab-ipa {
      font-family: monospace;
      background: rgba(255, 255, 255, 0.05);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .vocab-meaning {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 15px;
    }
    .vocab-ex {
      font-size: 13px;
      line-height: 1.6;
      border-left: 2px solid var(--primary);
      padding-left: 10px;
    }
    .vocab-ex-vn {
      color: var(--text-muted);
      margin-top: 5px;
    }
    .grammar-area {
      line-height: 1.8;
    }
    .grammar-area h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      color: var(--primary);
      margin-bottom: 20px;
    }
    .grammar-area h3 {
      font-size: 18px;
      margin: 20px 0 10px;
    }
    .grammar-area pre, .grammar-area code {
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      color: #e2e8f0;
    }
    .grammar-area pre {
      padding: 15px;
      display: block;
      margin: 15px 0;
      overflow-x: auto;
    }
    .quiz-container {
      max-width: 800px;
      margin: 0 auto;
    }
    .quiz-title {
      font-family: 'Outfit', sans-serif;
      font-size: 22px;
      margin-bottom: 30px;
      text-align: center;
    }
    .quiz-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 20px;
    }
    .quiz-question {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .quiz-option {
      padding: 15px 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 15px;
      font-weight: 500;
    }
    .quiz-option:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--primary);
    }
    .quiz-option.correct {
      background: rgba(72, 187, 120, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .quiz-option.incorrect {
      background: rgba(245, 101, 116, 0.15);
      border-color: var(--error);
      color: var(--error);
    }
    .quiz-explanation {
      margin-top: 20px;
      padding: 15px;
      background: rgba(255, 255, 255, 0.03);
      border-left: 4px solid var(--primary);
      border-radius: 0 8px 8px 0;
      font-size: 14px;
      line-height: 1.6;
    }
    .hidden {
      display: none !important;
    }
    footer {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
      font-size: 14px;
      border-top: 1px solid var(--border-color);
      background: rgba(0, 0, 0, 0.2);
    }
  </style>
</head>

    const slideData = {"NGSL Unit 1: High-Frequency Core Words 1-250": {"vocab": [{"word": "be", "pos": "verb", "ipa": "/biː/", "meaning": "thì, là, ở", "example": "I want to be a teacher in the future.", "vn_ex": "Tôi muốn trở thành một giáo viên trong tương lai."}, {"word": "have", "pos": "verb", "ipa": "/hæv/", "meaning": "có", "example": "Do you have any plans for this weekend?", "vn_ex": "Bạn có kế hoạch gì cho cuối tuần này chưa?"}, {"word": "do", "pos": "verb", "ipa": "/duː/", "meaning": "làm", "example": "What do you usually do in your free time?", "vn_ex": "Bạn thường làm gì vào thời gian rảnh rỗi?"}, {"word": "say", "pos": "verb", "ipa": "/seɪ/", "meaning": "nói", "example": "What did you say to her yesterday?", "vn_ex": "Hôm qua bạn đã nói gì với cô ấy thế?"}, {"word": "go", "pos": "verb", "ipa": "/ɡoʊ/", "meaning": "đi", "example": "We should go to the cinema tonight.", "vn_ex": "Chúng ta nên đi xem phim tối nay."}, {"word": "get", "pos": "verb", "ipa": "/ɡet/", "meaning": "nhận được, có được, đi lấy", "example": "Can you get me a glass of water, please?", "vn_ex": "Bạn có thể lấy giúp tôi một ly nước được không?"}, {"word": "make", "pos": "verb", "ipa": "/meɪk/", "meaning": "chế tạo, làm ra, dọn (giường)", "example": "My mom always makes delicious cakes.", "vn_ex": "Mẹ tôi luôn làm ra những chiếc bánh ngọt thơm ngon."}, {"word": "know", "pos": "verb", "ipa": "/noʊ/", "meaning": "biết", "example": "I don't know where she lives.", "vn_ex": "Tôi không biết cô ấy sống ở đâu."}, {"word": "take", "pos": "verb", "ipa": "/teɪk/", "meaning": "cầm, lấy, uống (thuốc), mất (thời gian)", "example": "It takes about ten minutes to walk there.", "vn_ex": "Mất khoảng mười phút đi bộ để đến đó."}, {"word": "see", "pos": "verb", "ipa": "/siː/", "meaning": "nhìn thấy, hiểu", "example": "I see what you mean, but I disagree.", "vn_ex": "Tôi hiểu ý bạn, nhưng tôi không đồng ý."}, {"word": "come", "pos": "verb", "ipa": "/kʌm/", "meaning": "đến, tới", "example": "Would you like à dọn dẹp nhà bếp."}, {"word": "man", "pos": "noun", "ipa": "/mæn/", "meaning": "đàn ông, người đàn ông", "example": "Who is that man standing near the door?", "vn_ex": "Người đàn ông đứng gần cửa kia là ai vậy?"}, {"word": "good", "pos": "adjective", "ipa": "/ɡʊd/", "meaning": "tốt, ngon, giỏi", "example": "This restaurant has really good food.", "vn_ex": "Nhà hàng này có đồ ăn thực sự rất ngon."}, {"word": "new", "pos": "adjective", "ipa": "/nuː/", "meaning": "mới", "example": "She is wearing a new dress.", "vn_ex": "Cô ấy đang mặc một chiếc váy mới."}, {"word": "first", "pos": "adjective", "ipa": "/fɜːrst/", "meaning": "thứ nhất, đầu tiên", "example": "This is my first time visiting Hanoi.", "vn_ex": "Đây là lần đầu tiên tôi đến thăm Hà Nội."}], "grammar_theory": "# Word Classes (Parts of Speech) in Basic Sentences\n## Giới thiệu\nWord Classes hay Parts of Speech là các loại từ trong tiếng Anh, bao gồm Noun (danh từ), Verb (động từ), Adjective (tính từ), Adverb (trạng từ), Pronoun (đại từ), Preposition (giới từ), Conjunction (liên từ) và Interjection (từ cảm thán).\n### Công thức cấu trúc\nMột câu cơ bản thường bao gồm Subject (chủ ngữ) + Verb (động từ) + Object (tân ngữ).\n### Cách dùng thực tế\n- **Noun**: Người, địa điểm, vật, ý tưởng.\n- **Verb**: Hành động hoặc trạng thái.\n- **Adjective**: Mô tả danh từ.\n- **Adverb**: Mô tả động từ, tính từ hoặc trạng từ.\n- **Pronoun**: Thay thế danh từ.\n- **Preposition**: Chỉ mối quan hệ giữa các từ.\n- **Conjunction**: Kết nối từ hoặc câu.\n- **Interjection**: Biểu thị cảm xúc.\n### Ví dụ\n- `The dog` (chủ ngữ) `runs` (động từ) `quickly` (trạng từ) `around the corner` (tân ngữ).\n- `She` (đại từ) `is` (động từ) `beautiful` (tính từ).", "quiz": [{"question": "Chủ ngữ và động từ trong câu 'The dog runs quickly around the corner' là ___ và ___.", "options": ["The dog và quickly", "runs và around the corner", "The dog và runs", "quickly và around the corner"], "answer": 2, "explanation": "Chủ ngữ là 'The dog' và động từ là 'runs' vì 'The dog' là người hoặc vật thực hiện hành động và 'runs' là hành động được thực hiện."}, {"question": "Từ 'she' trong câu 'She is beautiful' là ___.", "options": ["Danh từ", "Đại từ", "Tính từ", "Trạng từ"], "answer": 1, "explanation": "Từ 'she' là đại từ vì nó thay thế cho một danh từ, thường là tên của một người."}, {"question": "Từ 'quickly' trong câu 'The dog runs quickly around the corner' là ___.", "options": ["Danh từ", "Động từ", "Tính từ", "Trạng từ"], "answer": 3, "explanation": "Từ 'quickly' là trạng từ vì nó mô tả cách thức thực hiện hành động 'runs'."}, {"question": "Câu 'The dog runs around the corner' có cấu trúc ___.", "options": ["Chủ ngữ - Động từ - Tân ngữ", "Chủ ngữ - Tân ngữ - Động từ", "Động từ - Chủ ngữ - Tân ngữ", "Tân ngữ - Động từ - Chủ ngữ"], "answer": 0, "explanation": "Câu có cấu trúc 'Chủ ngữ - Động từ - Tân ngữ' vì theo thứ tự, 'The dog' là chủ ngữ, 'runs' là động từ và 'around the corner' là tân ngữ."}, {"question": "Từ 'around the corner' trong câu 'The dog runs quickly around the corner' là ___.", "options": ["Danh từ", "Động từ", "Tính từ", "Tân ngữ"], "answer": 3, "explanation": "Từ 'around the corner' là tân ngữ vì nó chỉ nơi diễn ra hành động 'runs'."}]}, "NGSL Unit 2: High-Frequency Core Words 251-500": {"vocab": [{"word": "provide", "pos": "verb", "ipa": "/prəˈvaɪd/", "meaning": "cung cấp", "example": "Could you provide me with some information about the upcoming event?", "vn_ex": "Bạn có thể cung cấp cho tôi một số thông tin về sự kiện sắp tới không?"}, {"word": "believe", "pos": "verb", "ipa": "/bɪˈliːv/", "meaning": "tin tưởng, tin rằng", "example": "I believe that we can solve this problem if we work together.", "vn_ex": "Tôi tin rằng chúng ta có thể giải quyết vấn đề này nếu làm việc cùng nhau."}, {"word": "begin", "pos": "verb", "ipa": "/bɪˈɡɪn/", "meaning": "bắt đầu", "example": "What time does the movie begin tonight?", "vn_ex": "Mấy giờ bộ phim bắt đầu chiếu tối nay thế?"}, {"word": "play", "pos": "verb", "ipa": "/pleɪ/", "meaning": "chơi", "example": "Do you want to play badminton with us this afternoon?", "vn_ex": "Chiều nay bạn có muốn chơi cầu lông với chúng tôi không?"}, {"word": "run", "pos": "verb", "ipa": "/rʌn/", "meaning": "chạy, vận hành", "example": "I usually run in the park every morning to stay in shape.", "vn_ex": "Tôi thường chạy bộ trong công viên mỗi sáng để giữ dáng."}, {"word": "show", "pos": "verb", "ipa": "/ʃoʊ/", "meaning": "cho xem, chỉ ra", "example": "Can you show me the way to the nearest bus stop?", "vn_ex": "Bạn có thể chỉ cho tôi đường đến trạm xe buýt gần nhất không?"}, {"word": "bring", "pos": "verb", "ipa": "/brɪŋ/", "meaning": "mang lại, mang theo", "example": "Don't forget to bring an umbrella because it might rain.", "vn_ex": "Đừng quên mang theo ô vì trời có thể mưa đấy."}, {"word": "book", "pos": "noun", "ipa": "/bʊk/", "meaning": "cuốn sách", "example": "I am reading a very interesting book about history.", "vn_ex": "Tôi đang đọc một cuốn sách rất thú vị về lịch sử."}, {"word": "water", "pos": "noun", "ipa": "/ˈwɔː.tər/", "meaning": "nước", "example": "Please give me a glass of warm water.", "vn_ex": "Vui lòng cho tôi xin một ly nước ấm."}, {"word": "room", "pos": "noun", "ipa": "/ruːm/", "meaning": "phòng", "example": "My bedroom is small but very cozy.", "vn_ex": "Phòng ngủ của tôi tuy nhỏ nhưng rất ấm cúng."}, {"word": "large", "pos": "adjective", "ipa": "/lɑːrdʒ/", "meaning": "lớn, rộng lớn", "example": "They live in a large house with a beautiful garden.", "vn_ex": "Họ sống trong một ngôi nhà lớn có một khu vườn đẹp."}, {"word": "school", "pos": "noun", "ipa": "/skuːl/", "meaning": "trường học", "example": "The children walk to school together every day.", "vn_ex": "Lũ trẻ đi bộ đến trường cùng nhau mỗi ngày."}, {"word": "business", "pos": "noun", "ipa": "/ˈbɪznəs/", "meaning": "việc kinh doanh, doanh nghiệp", "example": "He runs a small family business in the city center.", "vn_ex": "Anh ấy điều hành một doanh nghiệp gia đình nhỏ ở trung tâm thành phố."}, {"word": "state", "pos": "noun", "ipa": "/steɪt/", "meaning": "bang, trạng thái", "example": "California is a famous state in the United States.", "vn_ex": "California là một bang nổi tiếng ở nước Mỹ."}, {"word": "life", "pos": "noun", "ipa": "/laɪf/", "meaning": "cuộc sống", "example": "She always tries to enjoy her life to the fullest.", "vn_ex": "Cô ấy luôn cố gắng tận hưởng cuộc sống của mình một cách trọn vẹn nhất."}, {"word": "group", "pos": "noun", "ipa": "/ɡruːp/", "meaning": "nhóm", "example": "We were divided into small groups to discuss the topic.", "vn_ex": "Chúng tôi được chia thành các nhóm nhỏ để thảo luận về chủ đề."}, {"word": "country", "pos": "noun", "ipa": "/ˈkʌn.tri/", "meaning": "quốc gia, đất nước", "example": "I want to travel to many countries in the future.", "vn_ex": "Tôi muốn đi du lịch đến nhiều quốc gia trong tương lai."}, {"word": "move", "pos": "verb", "ipa": "/muːv/", "meaning": "di chuyển, chuyển động", "example": "Please move the chair closer to the window.", "vn_ex": "Vui lòng chuyển chiếc ghế lại gần cửa sổ hơn."}, {"word": "live", "pos": "verb", "ipa": "/lɪv/", "meaning": "sống", "example": "Where do you live in Vietnam?", "vn_ex": "Bạn sống ở đâu tại Việt Nam?"}, {"word": "hold", "pos": "verb", "ipa": "/hoʊld/", "meaning": "cầm, nắm, tổ chức", "example": "Can you hold this bag for me for a minute?", "vn_ex": "Bạn có thể giữ chiếc túi này giúp tôi một lát được không?"}, {"word": "write", "pos": "verb", "ipa": "/raɪt/", "meaning": "viết", "example": "I need to write an email to my friend tonight.", "vn_ex": "Tôi cần viết một email cho bạn của tôi vào tối nay."}, {"word": "point", "pos": "noun", "ipa": "/pɔɪnt/", "meaning": "quan điểm, điểm", "example": "That is a very good point to consider.", "vn_ex": "Đỏ là một quan điểm rất hay đáng để cân nhắc."}, {"word": "home", "pos": "noun", "ipa": "/hoʊm/", "meaning": "nhà, gia đình", "example": "I feel so relaxed whenever I come back home.", "vn_ex": "Tôi cảm thấy thật thư thái mỗi khi trở về nhà."}, {"word": "area", "pos": "noun", "ipa": "/ˈeəriə/", "meaning": "khu vực", "example": "There are many nice cafes in this area.", "vn_ex": "Có rất nhiều quán cà phê đẹp trong khu vực này."}, {"word": "family", "pos": "noun", "ipa": "/ˈfæm.əl.i/", "meaning": "gia đình", "example": "My family always gathers together for dinner.", "vn_ex": "Gia đình tôi luôn quây quần bên nhau vào bữa tối."}], "grammar_theory": "# Cấu trúc câu cơ bản (Subject-Verb-Object) & Sự đồng nhất chủ ngữ - động từ\n## Công thức cấu trúc\n- Chủ ngữ (Subject): thường là danh từ hoặc đại từ, là người hoặc vật thực hiện hành động.\n- Động từ (Verb): là hành động được thực hiện bởi chủ ngữ.\n- Tân ngữ (Object): thường là danh từ hoặc đại từ, là người hoặc vật nhận hành động.\n## Cách dùng thực tế\n- Trong giao tiếp hàng ngày, cấu trúc này được sử dụng để diễn đạt các ý tưởng đơn giản và trực tiếp.\n- Trong học thuật, cấu trúc này được sử dụng để trình bày thông tin một cách rõ ràng và logic.\n## Ví dụ\n- `She` (Chủ ngữ) `eats` (Động từ) `an apple` (Tân ngữ): Cô ấy ăn một quả táo.\n- `The dog` (Chủ ngữ) `chases` (Động từ) `the cat` (Tân ngữ): Con chó đuổi theo con mèo.", "quiz": [{"question": "The students ___ their homework before they went to bed.", "options": ["do", "does", "are doing", "did"], "answer": 3, "explanation": "Chọn đáp án 'did' vì chủ ngữ là 'The students' (đại từ số nhiều), động từ 'do' cần được chia theo thì quá khứ để phù hợp với 'before they went to bed'. Câu dịch: 'Học sinh đã làm bài tập về nhà trước khi đi ngủ.'"}, {"question": "If I ___ a million dollars, I would buy a house.", "options": ["have", "has", "had", "will have"], "answer": 2, "explanation": "Chọn đáp án 'had' vì câu điều kiện loại 2, sử dụng thì quá khứ để diễn tả điều không xảy ra trong hiện tại. Câu dịch: 'Nếu tôi có một triệu đô la, tôi sẽ mua một ngôi nhà.'"}, {"question": "By the time I ___ my project, it was already midnight.", "options": ["finish", "finishes", "finished", "was finishing"], "answer": 2, "explanation": "Chọn đáp án 'finished' vì sử dụng thì quá khứ hoàn thành để chỉ hành động hoàn thành trước một thời điểm trong quá khứ. Câu dịch: 'Khi tôi hoàn thành dự án, đã là nửa đêm.'"}, {"question": "The new employee ___ the report by the end of the week.", "options": ["will finish", "finishes", "is finishing", "finish"], "answer": 0, "explanation": "Chọn đáp án 'will finish' vì sử dụng thì tương lai gần để chỉ hành động sẽ hoàn thành vào một thời điểm cụ thể trong tương lai. Câu dịch: 'Nhân viên mới sẽ hoàn thành báo cáo vào cuối tuần.'"}, {"question": "The company ___ its profits last year due to the economic downturn.", "options": ["increases", "increase", "was increased", "was decreasing"], "answer": 3, "explanation": "Chọn đáp án 'was decreasing' vì sử dụng thì quá khứ tiếp diễn để chỉ sự giảm dần của lợi nhuận. Câu dịch: 'Công ty giảm lợi nhuận năm ngoái do suy thoái kinh tế.'"}]}, "NGSL Unit 3: High-Frequency Core Words 501-750": {"vocab": [{"word": "achievement", "pos": "Danh từ", "ipa": "/əˈtʃiːvmənt/", "meaning": "thành tựu, thành tích", "example": "Winning the championship was a great achievement for the young team.", "vn_ex": "Giành chức vô địch là một thành tích tuyệt vời đối với đội bóng trẻ."}, {"word": "admit", "pos": "Động từ", "ipa": "/ədˈmɪt/", "meaning": "thừa nhận, thú nhận", "example": "He finally decided to admit his mistake to his parents.", "vn_ex": "Cuối cùng anh ấy đã quyết định thừa nhận lỗi lầm của mình với bố mẹ."}, {"word": "alternative", "pos": "Danh từ", "ipa": "/ɔːlˈtɜːnətɪv/", "meaning": "sự thay thế, lựa chọn khác", "example": "If you do not want to go by bus, we have the alternative of taking a taxi.", "vn_ex": "Nếu bạn không muốn đi bằng xe buýt, chúng ta có lựa chọn khác là đi taxi."}, {"word": "analyse", "pos": "Động từ", "ipa": "/ˈænəlaɪz/", "meaning": "phân tích", "example": "The researcher had to analyse the collected data carefully.", "vn_ex": "Nhà nghiên cứu đã phải phân tích dữ liệu thu thập được một cách cẩn thận."}, {"word": "anxiety", "pos": "Danh từ", "ipa": "/æŋˈzaɪəti/", "meaning": "sự lo lắng, mối lo âu", "example": "Waiting for the exam results caused her a lot of anxiety.", "vn_ex": "Việc chờ đợi kết quả kỳ thi đã khiến cô ấy lo lắng rất nhiều."}, {"word": "appreciate", "pos": "Động từ", "ipa": "/əˈpriːʃieɪt/", "meaning": "trân trọng, đánh giá cao", "example": "I really appreciate your help during this difficult time.", "vn_ex": "Tôi thực sự trân trọng sự giúp đỡ của bạn trong khoảng thời gian khó khăn này."}, {"word": "attitude", "pos": "Danh từ", "ipa": "/ˈætɪtjuːd/", "meaning": "thái độ", "example": "A positive attitude can help you overcome many challenges in life.", "vn_ex": "Một thái độ tích cực có thể giúp bạn vượt qua nhiều thử thách trong cuộc sống."}, {"word": "avoid", "pos": "Động từ", "ipa": "/əˈvɔɪd/", "meaning": "tránh, tránh né", "example": "You should try to avoid drinking too much coffee before bedtime.", "vn_ex": "Bạn nên cố gắng tránh uống quá nhiều cà phê trước giờ đi ngủ."}, {"word": "aware", "pos": "Tính từ", "ipa": "/əˈweə(r)/", "meaning": "nhận thức, ý thức được", "example": "She is fully aware of the importance of this meeting.", "vn_ex": "Cô ấy nhận thức đầy đủ về tầm quan trọng của cuộc họp này."}, {"word": "benefit", "pos": "Danh từ", "ipa": "/ˈbenɪfɪt/", "meaning": "lợi ích", "example": "Regular exercise has many health benefits.", "vn_ex": "Tập thể dục đều đặn mang lại rất nhiều lợi ích cho sức khỏe."}, {"word": "blame", "pos": "Động từ", "ipa": "/bleɪm/", "meaning": "đổ lỗi, khiển trách", "example": "Please do not blame yourself for the accident; it was just bad luck.", "vn_ex": "Làm ơn đừng đổ lỗi cho bản thân về vụ tai nạn; đó chỉ là do không may thôi."}, {"word": "budget", "pos": "Danh từ", "ipa": "/ˈbʌdʒɪt/", "meaning": "ngân sách", "example": "We need to plan our family budget carefully for next month.", "vn_ex": "Chúng ta cần lên kế hoạch cho ngân sách gia đình một cách cẩn thận cho tháng tới."}, {"word": "challenge", "pos": "Danh từ", "ipa": "/ˈtʃælɪndʒ/", "meaning": "thử thách, thách thức", "example": "Learning a new language is a big challenge, but it is very rewarding.", "vn_ex": "Học một ngôn ngữ mới là một thử thách lớn, nhưng nó rất xứng đáng."}, {"word": "choice", "pos": "Danh từ", "ipa": "/tʃɔɪs/", "meaning": "sự lựa chọn", "example": "You made a very good choice when you bought this laptop.", "vn_ex": "Bạn đã đưa ra một lựa chọn rất tốt khi mua chiếc máy tính xách tay này."}, {"word": "colleague", "pos": "Danh từ", "ipa": "/ˈkɒliːɡ/", "meaning": "đồng nghiệp", "example": "I am going to have lunch with a colleague from my office.", "vn_ex": "Tôi chuẩn bị đi ăn trưa với một người đồng nghiệp cùng văn phòng."}, {"word": "combine", "pos": "Động từ", "ipa": "/kəmˈbaɪn/", "meaning": "kết hợp", "example": "You can combine these ingredients to make a delicious sauce.", "vn_ex": "Bạn có thể kết hợp các nguyên liệu này để tạo ra một loại nước sốt thơm ngon."}, {"word": "comfortable", "pos": "Tính từ", "ipa": "/ˈkʌmftəbl/", "meaning": "thoải mái, dễ chịu", "example": "The bed in this hotel is very soft and comfortable.", "vn_ex": "Chiếc giường ở khách sạn này rất mềm và thoải mái."}, {"word": "community", "pos": "Danh từ", "ipa": "/kəˈmjuːnəti/", "meaning": "cộng đồng", "example": "The local community worked together to clean up the park.", "vn_ex": "Cộng đồng địa phương đã cùng nhau dọn dẹp công viên."}, {"word": "compete", "pos": "Động từ", "ipa": "/kəmˈpiːt/", "meaning": "cạnh tranh, thi đấu", "example": "Hundreds of athletes will compete in the tournament next week.", "vn_ex": "Hàng trăm vận động viên sẽ thi đấu tại giải đấu vào tuần tới."}, {"word": "complex", "pos": "Tính từ", "ipa": "/ˈkɒmpleks/", "meaning": "phức tạp", "example": "The grammar of this language is quite complex and hard to understand.", "vn_ex": "Ngữ pháp của ngôn ngữ này khá phức tạp và khó hiểu."}, {"word": "consequence", "pos": "Danh từ", "ipa": "/ˈkɒnsɪkwəns/", "meaning": "hậu quả, kết quả", "example": "We must be prepared to face the consequences of our decisions.", "vn_ex": "Chúng ta phải sẵn sàng đối mặt với hậu quả từ những quyết định của mình."}, {"word": "critic", "pos": "Danh từ", "ipa": "/ˈkrɪtɪk/", "meaning": "nhà phê bình, người chỉ trích", "example": "The film critic gave the new movie a very positive review.", "vn_ex": "Nhà phê bình điện ảnh đã đưa ra một đánh giá rất tích cực cho bộ phim mới."}, {"word": "culture", "pos": "Danh từ", "ipa": "/ˈkʌltʃə(r)/", "meaning": "văn hóa", "example": "Learning about Japanese culture is a fascinating experience.", "vn_ex": "Tìm hiểu về văn hóa Nhật Bản là một trải nghiệm cực kỳ thú vị."}, {"word": "decrease", "pos": "Động từ", "ipa": "/dɪˈkriːs/", "meaning": "giảm, làm giảm bớt", "example": "The company hopes to decrease its expenses next year.", "vn_ex": "Công ty hy vọng sẽ cắt giảm các khoản chi phí vào năm tới."}, {"word": "define", "pos": "Động từ", "ipa": "/dɪˈfaɪn/", "meaning": "định nghĩa, xác định rõ", "example": "It is difficult to define exactly what happiness is.", "vn_ex": "Thật khó để định nghĩa chính xác hạnh phúc là gì."}], "grammar_theory": "# Compound Sentences with Coordinating Conjunctions (FANBOYS) \n## Công thức cấu trúc \n- `S1 + FANBOYS + S2` \n## Cách dùng thực tế \n- Dùng để nối hai câu đơn độc lập \n## Ví dụ \n- I like reading books, `and` my sister likes watching movies. (Tôi thích đọc sách, và em gái tôi thích xem phim.) \n- He studied hard, `but` he didn't pass the exam. (Anh ấy học chăm chỉ, nhưng anh ấy không đỗ kỳ thi.)", "quiz": [{"question": "I like playing football ___ my brother likes playing basketball.", "options": ["and", "but", "or", "so"], "answer": 0, "explanation": "Chọn 'and' vì nó dùng để nối hai câu đơn độc lập có ý nghĩa tương đồng."}, {"question": "She wanted to go to the beach ___ it was raining.", "options": ["and", "but", "or", "so"], "answer": 1, "explanation": "Chọn 'but' vì nó dùng để nối hai câu đơn độc lập có ý nghĩa tương phản."}, {"question": "I'm tired ___ I need to sleep.", "options": ["and", "but", "or", "so"], "answer": 3, "explanation": "Chọn 'so' vì nó dùng để chỉ ra kết quả của câu trước."}, {"question": "Do you want to go to the movies ___ stay home?", "options": ["and", "but", "or", "so"], "answer": 2, "explanation": "Chọn 'or' vì nó dùng để chỉ ra sự lựa chọn giữa hai điều."}, {"question": "I like reading books ___ my friend likes reading magazines.", "options": ["and", "but", "or", "so"], "answer": 0, "explanation": "Chọn 'and' vì nó dùng để nối hai câu đơn độc lập có ý nghĩa tương đồng."}]}, "NGSL Unit 4: High-Frequency Core Words 751-1000": {"vocab": [{"word": "achieve", "pos": "verb", "ipa": "/əˈtʃiːv/", "meaning": "đạt được, giành được", "example": "If you work hard every day, you can achieve your goals.", "vn_ex": "Nếu bạn làm việc chăm chỉ mỗi ngày, bạn có thể đạt được mục tiêu của mình."}, {"word": "admit", "pos": "verb", "ipa": "/ədˈmɪt/", "meaning": "thừa nhận, thú nhận", "example": "I must admit that I was wrong about him.", "vn_ex": "Tôi phải thừa nhận rằng tôi đã sai về anh ấy."}, {"word": "agree", "pos": "verb", "ipa": "/əˈɡriː/", "meaning": "đồng ý, tán thành", "example": "I agree with your plan to go to the beach this weekend.", "vn_ex": "Tôi đồng ý với kế hoạch đi biển của bạn vào cuối tuần này."}, {"word": "angry", "pos": "adjective", "ipa": "/ˈæŋ.ɡri/", "meaning": "tức giận, giận dữ", "example": "Please don't be angry with me for being late.", "vn_ex": "Xin đừng giận tôi vì đã đến muộn."}, {"word": "argue", "pos": "verb", "ipa": "/ˈɑːɡ.juː/", "meaning": "tranh luận, cãi cọ", "example": "They always argue about where to eat dinner.", "vn_ex": "Họ luôn tranh cãi về việc nên ăn tối ở đâu."}, {"word": "arrive", "pos": "verb", "ipa": "/əˈraɪv/", "meaning": "đến nơi, tới nơi", "example": "What time will your train arrive at the station?", "vn_ex": "Mấy giờ thì tàu của bạn sẽ đến ga?"}, {"word": "attack", "pos": "verb", "ipa": "/əˈtæk/", "meaning": "tấn công, công kích", "example": "Our dog will attack any stranger who tries to enter the yard.", "vn_ex": "Con chó của chúng tôi sẽ tấn công bất kỳ người lạ nào cố tình vào sân."}, {"word": "attempt", "pos": "verb", "ipa": "/əˈtempt/", "meaning": "cố gắng, nỗ lực", "example": "She will attempt to climb the mountain tomorrow morning.", "vn_ex": "Cô ấy sẽ cố gắng leo lên ngọn núi vào sáng mai."}, {"word": "avoid", "pos": "verb", "ipa": "/əˈvɔɪd/", "meaning": "tránh, né tránh", "example": "You should drive carefully to avoid accidents on rainy days.", "vn_ex": "Bạn nên lái xe cẩn thận để tránh tai nạn vào những ngày mưa."}, {"word": "benefit", "pos": "noun", "ipa": "/ˈben.ɪ.fɪt/", "meaning": "lợi ích, phúc lợi", "example": "Regular exercise is of great benefit to your health.", "vn_ex": "Tập thể dục đều đặn mang lại lợi ích rất lớn cho sức khỏe của bạn."}, {"word": "borrow", "pos": "verb", "ipa": "/ˈbɒr.əʊ/", "meaning": "vay, mượn", "example": "Can I borrow your pen for a second?", "vn_ex": "Tôi có thể mượn bút của bạn một lát được không?"}, {"word": "bottle", "pos": "noun", "ipa": "/ˈbɒt.əl/", "meaning": "chai, lọ", "example": "He drank a whole bottle of water after the soccer match.", "vn_ex": "Anh ấy đã uống hết một chai nước sau trận đấu bóng đá."}, {"word": "brave", "pos": "adjective", "ipa": "/breɪv/", "meaning": "dũng cảm, gan dạ", "example": "It was very brave of her to speak up against the bully.", "vn_ex": "Cô ấy đã rất dũng cảm khi lên tiếng chống lại kẻ bắt nạt."}, {"word": "bread", "pos": "noun", "ipa": "/bred/", "meaning": "bánh mì", "example": "I usually have bread and butter for breakfast.", "vn_ex": "Tôi thường ăn bánh mì và bơ vào bữa sáng."}, {"word": "breathe", "pos": "verb", "ipa": "/briːð/", "meaning": "thở, hít thở", "example": "It is hard to breathe in this crowded room.", "vn_ex": "Thật khó thở trong căn phòng đông đúc này."}, {"word": "bridge", "pos": "noun", "ipa": "/brɪdʒ/", "meaning": "cây cầu", "example": "We walked across the old wooden bridge over the river.", "vn_ex": "Chúng tôi đã đi bộ qua cây cầu gỗ cũ bắc qua sông."}, {"word": "busy", "pos": "adjective", "ipa": "/ˈbɪz.i/", "meaning": "bận rộn", "example": "My mother is always busy with her housework on weekends.", "vn_ex": "Mẹ tôi luôn bận rộn với công việc nhà vào cuối tuần."}, {"word": "buy", "pos": "verb", "ipa": "/baɪ/", "meaning": "mua", "example": "I want to buy a new smartphone to replace my old one.", "vn_ex": "Tôi muốn mua một chiếc điện thoại thông minh mới để thay thế chiếc cũ."}, {"word": "camera", "pos": "noun", "ipa": "/ˈkæm.rə/", "meaning": "máy ảnh, máy quay", "example": "Don't forget to bring your camera to take some nice photos.", "vn_ex": "Đừng quên mang theo máy ảnh của bạn để chụp vài bức hình đẹp."}, {"word": "camp", "pos": "verb", "ipa": "/kæmp/", "meaning": "cắm trại", "example": "We plan to camp near the lake during our summer holiday.", "vn_ex": "Chúng tôi dự định cắm trại gần hồ trong kỳ nghỉ hè của mình."}, {"word": "capital", "pos": "noun", "ipa": "/ˈkæp.ɪ.təl/", "meaning": "thủ đô, nguồn vốn", "example": "Hanoi is the capital city of Vietnam.", "vn_ex": "Hà Nội là thành phố thủ đô của Việt Nam."}, {"word": "captain", "pos": "noun", "ipa": "/ˈkæp.tɪn/", "meaning": "đội trưởng, thuyền trưởng", "example": "He was chosen as the captain of our high school football team.", "vn_ex": "Anh ấy đã được chọn làm đội trưởng đội bóng đá trường trung học của chúng tôi."}, {"word": "career", "pos": "noun", "ipa": "/kəˈrɪər/", "meaning": "sự nghiệp, nghề nghiệp", "example": "She is trying to build a successful career as a graphic designer.", "vn_ex": "Cô ấy đang cố gắng xây dựng một sự nghiệp thành công với tư cách là một nhà thiết kế đồ họa."}, {"word": "careful", "pos": "adjective", "ipa": "/ˈkeə.fəl/", "meaning": "cẩn thận, chu đáo", "example": "Be careful when you cross the busy street.", "vn_ex": "Hãy cẩn thận khi bạn băng qua đường phố đông đúc."}, {"word": "celebrate", "pos": "verb", "ipa": "/ˈsel.ə.breɪt/", "meaning": "kỷ niệm, ăn mừng", "example": "We gathered at a local restaurant to celebrate her birthday.", "vn_ex": "Chúng tôi đã tụ tập tại một nhà hàng địa phương để ăn mừng sinh nhật của cô ấy."}], "grammar_theory": "# Cấu trúc câu phức với từ liên kết phụ thuộc (because, although, if) \n## Công thức cấu trúc \n- Câu chính + because + câu phụ \n- Câu chính + although + câu phụ \n- if + câu phụ + câu chính \n## Cách dùng \n- Dùng để thể hiện mối quan hệ nguyên nhân - kết quả, điều kiện, tương phản \n## Ví dụ \n- I went to the store **because** I needed milk. (Tôi đi đến cửa hàng vì tôi cần sữa) \n- **Although** it was raining, we still went to the park. (Mặc dù trời mưa, chúng tôi vẫn đi đến công viên) \n- **If** it snows tomorrow, we will go skiing. (Nếu trời tuyết vào ngày mai, chúng tôi sẽ đi trượt tuyết)", "quiz": [{"question": "I didn't attend the party ___ I was tired.", "options": ["because", "although", "if", "so"], "answer": 0, "explanation": "Chọn because vì nó thể hiện mối quan hệ nguyên nhân - kết quả. Câu dịch nghĩa: Tôi không tham dự bữa tiệc vì tôi mệt mỏi."}, {"question": "___ it was a difficult question, I still tried to answer it.", "options": ["Although", "If", "Because", "So"], "answer": 0, "explanation": "Chọn although vì nó thể hiện sự tương phản. Câu dịch nghĩa: Mặc dù đó là một câu hỏi khó, tôi vẫn cố gắng trả lời nó."}, {"question": "We will go to the beach ___ the weather is nice.", "options": ["if", "because", "although", "so"], "answer": 0, "explanation": "Chọn if vì nó thể hiện điều kiện. Câu dịch nghĩa: Chúng tôi sẽ đi đến bãi biển nếu thời tiết đẹp."}, {"question": "I love reading books ___ they help me relax.", "options": ["because", "although", "if", "so"], "answer": 0, "explanation": "Chọn because vì nó thể hiện mối quan hệ nguyên nhân - kết quả. Câu dịch nghĩa: Tôi yêu thích đọc sách vì chúng giúp tôi thư giãn."}, {"question": "___ I had studied harder, I would have passed the exam.", "options": ["If", "Because", "Although", "So"], "answer": 0, "explanation": "Chọn if vì nó thể hiện điều kiện. Câu dịch nghĩa: Nếu tôi đã học chăm chỉ hơn, tôi sẽ đã vượt qua kỳ thi."}]}, "NAWL Unit 1: Academic Word List 1-150": {"vocab": [{"word": "academic", "pos": "Adjective", "ipa": "/ˌæk.əˈdem.ɪk/", "meaning": "thuộc học thuật, thuộc viện nghiên cứu", "example": "The university maintains rigorous academic standards for all its research programs.", "vn_ex": "Trường đại học duy trì các tiêu chuẩn học thuật nghiêm ngặt cho tất cả các chương trình nghiên cứu của mình."}, {"word": "adjust", "pos": "Verb", "ipa": "/əˈdʒʌst/", "meaning": "điều chỉnh, thích nghi", "example": "Scientists had to adjust the parameters of the simulation to match the empirical data.", "vn_ex": "Các nhà khoa học đã phải điều chỉnh các tham số của mô phỏng để phù hợp với dữ liệu thực nghiệm."}, {"word": "alter", "pos": "Verb", "ipa": "/ˈɔːl.tər/", "meaning": "thay đổi, biến đổi", "example": "The introduction of a new predator can fundamentally alter the local ecosystem.", "vn_ex": "Sự xuất hiện của một loài săn mồi mới có thể thay đổi một cách cơ bản hệ sinh thái địa phương."}, {"word": "analyse", "pos": "Verb", "ipa": "/ˈæn.əl.aɪz/", "meaning": "phân tích", "example": "Researchers must carefully analyse the chemical composition of the soil samples.", "vn_ex": "Các nhà nghiên cứu phải phân tích cẩn thận thành phần hóa học của các mẫu đất."}, {"word": "aspect", "pos": "Noun", "ipa": "/ˈæs.pekt/", "meaning": "khía cạnh, diện mạo", "example": "The sociological study examines every aspect of urban community development.", "vn_ex": "Nghiên cứu xã hội học xem xét mọi khía cạnh của sự phát triển cộng đồng đô thị."}, {"word": "assess", "pos": "Verb", "ipa": "/əˈses/", "meaning": "đánh giá, định giá", "example": "It is difficult to assess the long-term environmental consequences of deforesting this area.", "vn_ex": "Rất khó để đánh giá những hậu quả môi trường lâu dài của việc phá rừng ở khu vực này."}, {"word": "assume", "pos": "Verb", "ipa": "/əˈsjuːm/", "meaning": "giả định, thừa nhận", "example": "In theoretical physics, we often assume that friction is negligible to simplify the equations.", "vn_ex": "Trong vật lý lý thuyết, chúng tôi thường giả định rằng lực ma sát là không đáng kể để đơn giản hóa các phương trình."}, {"word": "challenge", "pos": "Noun", "ipa": "/ˈtʃæl.ɪndʒ/", "meaning": "thách thức, khó khăn", "example": "Developing a stable quantum computer presents a major challenge for contemporary engineers.", "vn_ex": "Việc phát triển một máy tính lượng tử ổn định đặt ra một thách thức lớn cho các kỹ sư đương đại."}, {"word": "concept", "pos": "Noun", "ipa": "/ˈkɒn.sept/", "meaning": "khái niệm, quan niệm", "example": "The basic concept of evolution is fundamental to modern biological sciences.", "vn_ex": "Khái niệm cơ bản về sự tiến hóa là nền tảng đối với các ngành khoa học sinh học hiện đại."}, {"word": "confirm", "pos": "Verb", "ipa": "/kənˈfɜːm/", "meaning": "xác nhận, chứng thực", "example": "These experimental results confirm the theoretical predictions made in the previous study.", "vn_ex": "Những kết quả thực nghiệm này xác nhận các dự đoán lý thuyết được đưa ra trong nghiên cứu trước đó."}, {"word": "consistent", "pos": "Adjective", "ipa": "/kənˈsɪs.tənt/", "meaning": "nhất quán, nhất trí", "example": "The newly collected data are consistent with the hypothesis proposed by the research group.", "vn_ex": "Các dữ liệu mới thu thập được nhất quán với giả thuyết được đề xuất bởi nhóm nghiên cứu."}, {"word": "constant", "pos": "Adjective", "ipa": "/ˈkɒn.stənt/", "meaning": "không đổi, liên tục", "example": "Maintaining a constant temperature is vital for the growth of the bacterial culture.", "vn_ex": "Duy trì một nhiệt độ không đổi là cực kỳ quan trọng cho sự phát triển của môi trường nuôi cấy vi khuẩn."}, {"word": "construct", "pos": "Verb", "ipa": "/kənˈstrʌkt/", "meaning": "xây dựng, kiến tạo", "example": "Historians construct narratives of the past based on surviving primary source materials.", "vn_ex": "Các nhà sử học xây dựng các câu chuyện về quá khứ dựa trên những tài liệu nguồn sơ cấp còn lưu lại."}, {"word": "context", "pos": "Noun", "ipa": "/ˈkɒn.tekst/", "meaning": "bối cảnh, ngữ cảnh", "example": "To understand the author's intent, one must analyze the text within its political context.", "vn_ex": "Để hiểu được ý định của tác giả, người ta phải phân tích văn bản trong bối cảnh chính trị của nó."}, {"word": "core", "pos": "Noun", "ipa": "/kɔːr/", "meaning": "cốt lõi, trung tâm", "example": "Critical analysis of historical evidence lies at the core of historical methodology.", "vn_ex": "Phân tích phê phán các bằng chứng lịch sử nằm ở cốt lõi của phương pháp luận lịch sử."}, {"word": "decline", "pos": "Verb", "ipa": "/dɪˈklaɪn/", "meaning": "suy giảm, giảm sút", "example": "Studies show that biodiversity will continue to decline if greenhouse gas emissions do not decrease.", "vn_ex": "Các nghiên cứu chỉ ra rằng đa dạng sinh học sẽ tiếp tục suy giảm nếu lượng phát thải khí nhà kính không giảm."}, {"word": "document", "pos": "Verb", "ipa": "/ˈdɒk.jə.ment/", "meaning": "ghi chép, tài liệu hóa", "example": "It is essential to document all chemical reactions observed during the experiment.", "vn_ex": "Việc ghi chép lại tất cả các phản ứng hóa học quan sát được trong quá trình thí nghiệm là rất cần thiết."}, {"word": "draft", "pos": "Noun", "ipa": "/drɑːft/", "meaning": "bản thảo, phác thảo", "example": "The researcher completed the preliminary draft of the manuscript before sending it to co-authors.", "vn_ex": "Nhà nghiên cứu đã hoàn thành bản thảo sơ bộ của bản thảo trước khi gửi cho các đồng tác giả."}, {"word": "evaluate", "pos": "Verb", "ipa": "/ɪˈvæl.ju.eɪt/", "meaning": "đánh giá, nhận định", "example": "Linguists evaluate language learning methodologies based on empirical pedagogical outcomes.", "vn_ex": "Các nhà ngôn ngữ học đánh giá các phương pháp học ngôn ngữ dựa trên các kết quả sư phạm thực nghiệm."}, {"word": "focus", "pos": "Verb", "ipa": "/ˈfəʊ.kəs/", "meaning": "tập trung, chú trọng", "example": "The upcoming research project will focus specifically on genetic markers associated with diabetes.", "vn_ex": "Dự án nghiên cứu sắp tới sẽ tập trung cụ thể vào các dấu hiệu di truyền liên quan đến bệnh tiểu đường."}, {"word": "generation", "pos": "Noun", "ipa": "/ˌdʒen.əˈreɪ.ʃən/", "meaning": "sự tạo ra, thế hệ", "example": "The generation of electricity from solar power has reached unprecedented levels this year.", "vn_ex": "Sự tạo ra điện từ năng lượng mặt trời đã đạt mức chưa từng có trong năm nay."}, {"word": "initial", "pos": "Adjective", "ipa": "/ɪˈnɪʃ.əl/", "meaning": "ban đầu, đầu tiên", "example": "The initial reaction of the participants to the new treatment was highly positive.", "vn_ex": "Phản ứng ban đầu của những người tham gia đối với phương pháp điều trị mới là rất tích cực."}, {"word": "predict", "pos": "Verb", "ipa": "/prɪˈdɪkt/", "meaning": "dự đoán, tiên đoán", "example": "Meteorologists use advanced computer models to predict weather patterns.", "vn_ex": "Các nhà khí tượng học sử dụng các mô hình máy tính tiên tiến để dự đoán các mô hình thời tiết."}, {"word": "resolve", "pos": "Verb", "ipa": "/rɪˈzɒlv/", "meaning": "giải quyết, phân giải", "example": "Peer review plays an important role in helping scientists resolve discrepancies in empirical findings.", "vn_ex": "Bình duyệt đóng một vai trò quan trọng trong việc giúp các nhà khoa học giải quyết những khác biệt trong các phát hiện thực nghiệm."}, {"word": "retain", "pos": "Verb", "ipa": "/rɪˈteɪn/", "meaning": "giữ lại, duy trì", "example": "Certain minerals are added to help the soil retain critical nutrients for agriculture.", "vn_ex": "Một số khoáng chất được thêm vào để giúp đất giữ lại các chất dinh dưỡng thiết yếu cho nông nghiệp."}], "grammar_theory": "# Giới thiệu về Giọng bị động\n## Công thức cấu trúc\nGiọng bị động được tạo thành bằng cách sử dụng `động từ to be` ở dạng thích hợp + `động từ chính` ở dạng quá khứ phân từ.\n### Ví dụ\n- The play `was written` by Shakespeare. (Vở kịch được viết bởi Shakespeare)\n- The new policy `will be announced` next week. (Chính sách mới sẽ được công bố vào tuần tới)\n## Cách dùng thực tế\nGiọng bị động thường được sử dụng trong học thuật và giao tiếp chính thức để nhấn mạnh vào đối tượng nhận hành động thay vì chủ thể thực hiện hành động.", "quiz": [{"question": "The new employee ___ by the HR department next Monday.", "options": ["will be interviewed", "will interview", "is interviewing", "was interviewed"], "answer": 0, "explanation": "Câu hỏi sử dụng giọng bị động để nói về một sự kiện trong tương lai, vì vậy đáp án đúng là 'will be interviewed', nghĩa là nhân viên mới sẽ được phỏng vấn bởi bộ phận nhân sự vào thứ hai tới."}, {"question": "The research paper ___ by a team of experts from Harvard University.", "options": ["was written", "were written", "write", "are writing"], "answer": 0, "explanation": "Câu hỏi sử dụng giọng bị động để nói về một hành động đã xảy ra trong quá khứ, vì vậy đáp án đúng là 'was written', nghĩa là bài nghiên cứu được viết bởi một đội chuyên gia từ Đại học Harvard."}, {"question": "The company's financial reports ___ by an independent auditor every year.", "options": ["are audited", "was audited", "will audit", "have audited"], "answer": 0, "explanation": "Câu hỏi sử dụng giọng bị động để nói về một hành động thường xuyên xảy ra, vì vậy đáp án đúng là 'are audited', nghĩa là báo cáo tài chính của công ty được kiểm toán bởi một kiểm toán viên độc lập mỗi năm."}, {"question": "The new product ___ by our team of engineers over the past year.", "options": ["has been developed", "was developed", "is developing", "will develop"], "answer": 0, "explanation": "Câu hỏi sử dụng giọng bị động để nói về một hành động đã bắt đầu trong quá khứ và tiếp tục đến hiện tại, vì vậy đáp án đúng là 'has been developed', nghĩa là sản phẩm mới được phát triển bởi đội kỹ sư của chúng tôi trong suốt năm qua."}, {"question": "The data ___ carefully before it was used for the study.", "options": ["was analyzed", "were analyzed", "analyze", "are analyzing"], "answer": 0, "explanation": "Câu hỏi sử dụng giọng bị động để nói về một hành động đã xảy ra trước một hành động khác, vì vậy đáp án đúng là 'was analyzed', nghĩa là dữ liệu được phân tích cẩn thận trước khi nó được sử dụng cho nghiên cứu."}]}, "NAWL Unit 2: Academic Word List 151-300": {"vocab": [{"word": "colony", "pos": "noun", "ipa": "/ˈkɒl.ə.ni/", "meaning": "thuộc địa; quần thể (sinh học)", "example": "The researchers observed a dense colony of bacteria growing on the petri dish under controlled temperature conditions.", "vn_ex": "Các nhà nghiên cứu đã quan sát thấy một quần thể vi khuẩn dày đặc phát triển trên đĩa petri trong các điều kiện nhiệt độ được kiểm soát."}, {"word": "comma", "pos": "noun", "ipa": "/ˈkɒm.ə/", "meaning": "dấu phẩy", "example": "In academic writing, the correct placement of a comma is essential to avoid syntactic ambiguity in complex sentences.", "vn_ex": "Trong văn viết học thuật, việc đặt dấu phẩy đúng vị trí là rất cần thiết để tránh sự mơ hồ về cú pháp trong các câu phức."}, {"word": "commentary", "pos": "noun", "ipa": "/ˈkɒm.ən.tri/", "meaning": "bài bình luận, bài phê bình", "example": "The scholar provided a detailed commentary on the philosophical texts of the early modern era.", "vn_ex": "Học giả đã cung cấp một bài bình luận chi tiết về các văn bản triết học của thời kỳ đầu hiện đại."}, {"word": "commodity", "pos": "noun", "ipa": "/kəˈmɒd.ə.ti/", "meaning": "hàng hóa", "example": "Wheat is a vital agricultural commodity whose price fluctuations significantly affect global food security models.", "vn_ex": "Lúa mì là một mặt hàng nông nghiệp thiết yếu mà sự biến động giá cả của nó ảnh hưởng đáng kể đến các mô hình an ninh lương thực toàn cầu."}, {"word": "commonly", "pos": "adverb", "ipa": "/ˈkɒm.ən.li/", "meaning": "thông thường, thường", "example": "This statistical method is commonly utilized to analyze variance among independent variables in quantitative research.", "vn_ex": "Phương pháp thống kê này thường được sử dụng để phân tích phương sai giữa các biến độc lập trong nghiên cứu định lượng."}, {"word": "communicative", "pos": "adjective", "ipa": "/kəˈmjuː.nɪ.kə.tɪv/", "meaning": "có tính giao tiếp, thuộc về truyền thông", "example": "The study explores the communicative competence of bilingual children in multicultural educational settings.", "vn_ex": "Nghiên cứu khám phá năng lực giao tiếp của trẻ em song ngữ trong các môi trường giáo dục đa văn hóa."}, {"word": "communist", "pos": "adjective", "ipa": "/ˈkɒm.jʊ.nɪst/", "meaning": "cộng sản, thuộc về cộng sản", "example": "Historians analyzed the socio-economic reforms implemented by various communist regimes during the twentieth century.", "vn_ex": "Các nhà sử học đã phân tích những cải cách kinh tế - xã hội được thực hiện bởi các chế độ cộng sản khác nhau trong thế kỷ hai mươi."}, {"word": "compact", "pos": "adjective", "ipa": "/kəmˈpækt/", "meaning": "nhỏ gọn, cô đọng, chặt chẽ", "example": "The novel's structure is compact, conveying a complex narrative within a limited number of pages.", "vn_ex": "Cấu trúc của cuốn tiểu thuyết rất cô đọng, truyền tải một câu chuyện phức tạp trong một số lượng trang giới hạn."}, {"word": "comparable", "pos": "adjective", "ipa": "/ˈkɒm.pər.ə.bəl/", "meaning": "có thể so sánh được, tương đương", "example": "The experimental group showed comparable performance levels to the control group in the post-test evaluation.", "vn_ex": "Nhóm thử nghiệm cho thấy mức độ hiệu suất tương đương với nhóm đối chứng trong đánh giá sau kiểm tra."}, {"word": "comparative", "pos": "adjective", "ipa": "/kəmˈpær.ə.tɪv/", "meaning": "so sánh, tương đối", "example": "A comparative study of the two political systems reveals significant differences in their decision-making processes.", "vn_ex": "Một nghiên cứu so sánh về hai hệ thống chính trị cho thấy những khác biệt đáng kể trong quy trình ra quyết định của họ."}, {"word": "compensate", "pos": "verb", "ipa": "/ˈkɒm.pən.seɪt/", "meaning": "đền bù, bồi thường, bù đắp", "example": "The organism developed physiological adaptations to compensate for the lack of oxygen at high altitudes.", "vn_ex": "Sinh vật đã phát triển các cơ chế thích nghi sinh lý để bù đắp cho sự thiếu hụt oxy ở độ cao lớn."}, {"word": "competence", "pos": "noun", "ipa": "/ˈkɒm.pɪ.təns/", "meaning": "năng lực, khả năng", "example": "The evaluation framework assesses linguistic competence across four primary language skills.", "vn_ex": "Khung đánh giá kiểm tra năng lực ngôn ngữ trên bốn kỹ năng ngôn ngữ chính."}, {"word": "competent", "pos": "adjective", "ipa": "/ˈkɒm.pɪ.tənt/", "meaning": "có năng lực, thành thạo", "example": "The laboratory requires competent technicians to operate the sensitive nuclear magnetic resonance equipment.", "vn_ex": "Phòng thí nghiệm yêu cầu các kỹ thuật viên có năng lực để vận hành thiết bị cộng hưởng từ hạt nhân nhạy cảm."}, {"word": "complement", "pos": "verb", "ipa": "/ˈkɒm.plɪ.mənt/", "meaning": "bổ sung, bổ khuyết", "example": "The qualitative interview data serves to complement the quantitative findings obtained from the survey.", "vn_ex": "Dữ liệu phỏng vấn định tính có vai trò bổ sung cho các phát hiện định lượng thu được từ cuộc khảo sát."}, {"word": "complication", "pos": "noun", "ipa": "/ˌkɒm.plɪˈkeɪ.ʃən/", "meaning": "sự phức tạp, biến chứng (y học)", "example": "The patient experienced a minor cardiovascular complication following the surgical procedure.", "vn_ex": "Bệnh nhân đã gặp phải một biến chứng tim mạch nhỏ sau thủ thuật phẫu thuật."}, {"word": "comply", "pos": "verb", "ipa": "/kəmˈplaɪ/", "meaning": "tuân thủ", "example": "All academic institutions must comply with the ethical guidelines set by the national research council.", "vn_ex": "Tất cả các tổ chức học thuật phải tuân thủ các hướng dẫn đạo đức do hội đồng nghiên cứu quốc gia thiết lập."}, {"word": "composer", "pos": "noun", "ipa": "/kəmˈpoʊ.zər/", "meaning": "nhà soạn nhạc", "example": "The musicologist explored how the late nineteenth-century composer integrated traditional folk melodies into classical symphonies.", "vn_ex": "Nhà nhạc học đã nghiên cứu cách nhà soạn nhạc cuối thế kỷ 19 tích hợp các giai điệu dân gian truyền thống vào các bản giao hương cổ điển."}, {"word": "composite", "pos": "adjective", "ipa": "/ˈkɒm.pə.zɪt/", "meaning": "hợp phần, tổng hợp, phức hợp", "example": "Engineers developed a new composite material that offers high tensile strength and extremely low density.", "vn_ex": "Các kỹ sư đã phát triển một vật liệu composite mới có độ bền kéo cao và mật độ cực kỳ thấp."}, {"word": "comprehension", "pos": "noun", "ipa": "/ˌkɒm.prɪˈhen.ʃən/", "meaning": "sự thấu hiểu, sự hiểu biết", "example": "The instructional strategies were designed to enhance reading comprehension among native English learners.", "vn_ex": "Các chiến lược giảng dạy được thiết kế để nâng cao sự hiểu đọc đối với người học bản ngữ tiếng Anh."}, {"word": "computation", "pos": "noun", "ipa": "/ˌkɒm.pjʊˈteɪ.ʃən/", "meaning": "sự tính toán, sự điện toán", "example": "Modern astrophysics relies on complex numerical computation to simulate the formation of galaxies.", "vn_ex": "Vật lý thiên văn hiện đại dựa vào các tính toán số phức tạp để mô phỏng sự hình thành của các thiên hà."}, {"word": "conceive", "pos": "verb", "ipa": "/kənˈsiːv/", "meaning": "nhận thức, hình dung, thụ thai", "example": "It is difficult to conceive of a universe without the fundamental laws of thermodynamics.", "vn_ex": "Thật khó để hình dung về một vũ trụ không có các định luật cơ bản của nhiệt động lực học."}, {"word": "conception", "pos": "noun", "ipa": "/kənˈsep.ʃən/", "meaning": "quan niệm, khái niệm, sự thụ thai", "example": "The philosopher’s conception of justice differs significantly from modern utilitarian perspectives.", "vn_ex": "Quan niệm của nhà triết học về công lý khác biệt đáng kể so với các quan điểm thực dụng hiện đại."}, {"word": "conceptual", "pos": "adjective", "ipa": "/kənˈsep.tʃu.əl/", "meaning": "thuộc về khái niệm, quan niệm", "example": "The first chapter of the dissertation establishes the conceptual framework for the entire research project.", "vn_ex": "Chương đầu tiên của luận án thiết lập khung khái niệm cho toàn bộ dự án nghiên cứu."}, {"word": "conditional", "pos": "adjective", "ipa": "/kənˈdɪʃ.ən.əl/", "meaning": "có điều kiện", "example": "The probability of the event occurring is conditional upon the presence of specific catalyst molecules.", "vn_ex": "Xác suất xảy ra sự kiện có điều kiện phụ thuộc vào sự hiện diện của các phân tử xúc tác cụ thể."}, {"word": "conduction", "pos": "noun", "ipa": "/kənˈdʌk.ʃən/", "meaning": "sự dẫn (nhiệt, điện)", "example": "Metals generally possess high thermal conduction, allowing heat to transfer rapidly through the material.", "vn_ex": "Kim loại nhìn chung có độ dẫn nhiệt cao, cho phép nhiệt truyền đi nhanh chóng qua vật liệu."}], "grammar_theory": "# Nominalisation (Turning verbs and adjectives into nouns) in Research\n## Định nghĩa\nNominalisation là quá trình chuyển đổi động từ và tính từ thành danh từ.\n### Công thức cấu trúc\n- Sử dụng đuôi `-tion`, `-ion`, `-ment`, `-ness`, `-ity` để chuyển đổi động từ thành danh từ.\n- Sử dụng đuôi `-ness`, `-ity` để chuyển đổi tính từ thành danh từ.\n## Cách dùng thực tế\n- Trong nghiên cứu, nominalisation giúp tạo ra ngôn ngữ học thuật chính xác và khách quan.\n- Ví dụ: `The investigation` (cuộc điều tra) thay cho `We investigated` (chúng tôi đã điều tra), `The importance` (tầm quan trọng) thay cho `It is important` (nó quan trọng).\n## Ví dụ cụ thể\n- `The analysis of the data showed that...` (Phân tích dữ liệu cho thấy rằng...)\n- `The significance of this study is that...` (Tầm quan trọng của nghiên cứu này là...)", "quiz": [{"question": "The ___ of the new policy has been widely discussed.", "options": ["implementation", "implement", "implemented", "implementing"], "answer": 0, "explanation": "Câu hỏi yêu cầu sử dụng danh từ để chỉ quá trình thực hiện chính sách mới. Đáp án đúng là 'implementation' vì nó là danh từ được tạo ra từ động từ 'implement' bằng cách thêm đuôi '-tion'."}, {"question": "The company has announced the ___ of a new product line.", "options": ["development", "develop", "developed", "developing"], "answer": 0, "explanation": "Câu hỏi yêu cầu sử dụng danh từ để chỉ quá trình phát triển sản phẩm mới. Đáp án đúng là 'development' vì nó là danh từ được tạo ra từ động từ 'develop' bằng cách thêm đuôi '-ment'."}, {"question": "The ___ of the student's work was very impressive.", "options": ["quality", "qualify", "qualified", "qualifying"], "answer": 0, "explanation": "Câu hỏi yêu cầu sử dụng danh từ để chỉ đặc điểm của công việc học sinh. Đáp án đúng là 'quality' vì nó là danh từ được tạo ra từ tính từ 'qualify' bằng cách thêm đuôi '-ity'."}, {"question": "The ___ of the new technology has improved significantly.", "options": ["efficiency", "efficient", "efficiently", "efficience"], "answer": 0, "explanation": "Câu hỏi yêu cầu sử dụng danh từ để chỉ đặc điểm của công nghệ mới. Đáp án đúng là 'efficiency' vì nó là danh từ được tạo ra từ tính từ 'efficient' bằng cách thêm đuôi '-cy'."}, {"question": "The ___ of the data has been completed.", "options": ["analysis", "analyse", "analysed", "analysing"], "answer": 0, "explanation": "Câu hỏi yêu cầu sử dụng danh từ để chỉ quá trình phân tích dữ liệu. Đáp án đúng là 'analysis' vì nó là danh từ được tạo ra từ động từ 'analyse' bằng cách thêm đuôi '-is'."}]}, "NAWL Unit 3: Academic Word List 301-450": {"vocab": [{"word": "accumulate", "pos": "verb", "ipa": "/əˈkjuːmjəleɪt/", "meaning": "tích lũy", "example": "Researchers accumulate quantitative data over several months to establish a reliable trend.", "vn_ex": "Các nhà nghiên cứu tích lũy dữ liệu định lượng trong vài tháng để thiết lập một xu hướng đáng tin cậy."}, {"word": "acquire", "pos": "verb", "ipa": "/əˈkwaɪər/", "meaning": "đạt được, thu nhận", "example": "Through extensive field studies, the students acquire a deep understanding of ecological ecosystems.", "vn_ex": "Thông qua các nghiên cứu thực địa rộng rãi, sinh viên đạt được sự hiểu biết sâu sắc về các hệ sinh thái."}, {"word": "academic", "pos": "adjective", "ipa": "/ˌækəˈdemɪk/", "meaning": "thuộc học thuật", "example": "Academic integrity is fundamental to maintaining public trust in scientific publications.", "vn_ex": "Sự trung thực học thuật là nền tảng để duy trì niềm tin của công chúng vào các công bố khoa học."}, {"word": "evaluate", "pos": "verb", "ipa": "/ɪˈvæljueɪt/", "meaning": "đánh giá", "example": "Statisticians use rigorous testing methods to evaluate the hypothesis proposed in the study.", "vn_ex": "Các nhà thống kê sử dụng các phương pháp kiểm chứng nghiêm ngặt để đánh giá giả thuyết được đề xuất trong nghiên cứu."}, {"word": "modify", "pos": "verb", "ipa": "/ˈmɑːdɪfaɪ/", "meaning": "điều chỉnh, sửa đổi", "example": "It was necessary to modify the research parameters to account for unforeseen environmental changes.", "vn_ex": "Việc điều chỉnh các thông số nghiên cứu là cần thiết để giải thích cho những thay đổi môi trường không lường trước được."}, {"word": "consequence", "pos": "noun", "ipa": "/ˈkɑːnsɪkwəns/", "meaning": "hậu quả, hệ quả", "example": "The melting of polar ice caps is a direct consequence of global warming.", "vn_ex": "Sự tan chảy của các chỏm băng ở cực là hệ quả trực tiếp của hiện tượng nóng lên toàn cầu."}, {"word": "potential", "pos": "noun", "ipa": "/pəˈtenʃl/", "meaning": "tiềm năng", "example": "The newly discovered compound shows great potential for developing more effective cancer therapies.", "vn_ex": "Hợp chất mới được phát hiện cho thấy tiềm năng lớn trong việc phát triển các liệu pháp điều trị ung thư hiệu quả hơn."}, {"word": "equivalent", "pos": "adjective", "ipa": "/ɪˈkwɪvələnt/", "meaning": "tương đương", "example": "The educational outcomes of online learning are often equivalent to traditional classroom instruction.", "vn_ex": "Kết quả giáo dục của việc học trực tuyến thường tương đương với việc giảng dạy trên lớp truyền thống."}, {"word": "comprehensive", "pos": "adjective", "ipa": "/ˌkɑːmprɪˈhensɪv/", "meaning": "toàn diện", "example": "The literature review provides a comprehensive analysis of the existing research in quantum mechanics.", "vn_ex": "Phần tổng quan tài liệu cung cấp một phân tích toàn diện về các nghiên cứu hiện có trong lĩnh vực cơ học lượng tử."}, {"word": "significant", "pos": "adjective", "ipa": "/sɪɡˈnɪfɪkənt/", "meaning": "đáng kể, có ý nghĩa lớn", "example": "The experimental group showed a significant improvement in cognitive performance compared to the control group.", "vn_ex": "Nhóm thực nghiệm đã cho thấy sự cải thiện đáng kể về hiệu suất nhận thức so với nhóm đối chứng."}, {"word": "factor", "pos": "noun", "ipa": "/ˈfæktər/", "meaning": "nhân tố, yếu tố", "example": "Socioeconomic status is a critical factor influencing academic achievement in primary education.", "vn_ex": "Trình độ kinh tế xã hội là một yếu tố quan trọng ảnh hưởng đến thành tích học tập ở giáo dục tiểu học."}, {"word": "variable", "pos": "noun", "ipa": "/ˈveriəbl/", "meaning": "biến số", "example": "Temperature was kept constant while the independent variable was manipulated in the experiment.", "vn_ex": "Nhiệt độ được giữ không đổi trong khi biến số độc lập được điều chỉnh trong thí nghiệm."}, {"word": "concept", "pos": "noun", "ipa": "/ˈkɑːnsept/", "meaning": "khái niệm", "example": "Understanding the basic concept of biodiversity is essential for ecological conservation research.", "vn_ex": "Hiểu được khái niệm cơ bản về đa dạng sinh học là điều cần thiết cho nghiên cứu bảo tồn sinh thái."}, {"word": "survey", "pos": "noun", "ipa": "/ˈsɜːrveɪ/", "meaning": "cuộc khảo sát", "example": "The researchers designed a comprehensive survey to collect data on public attitudes toward climate change.", "vn_ex": "Các nhà nghiên cứu đã thiết kế một cuộc khảo sát toàn diện để thu thập dữ liệu về thái độ của công chúng đối với biến đổi khí hậu."}, {"word": "methodology", "pos": "noun", "ipa": "/ˌmeθəˈdɑːlədʒi/", "meaning": "phương pháp luận", "example": "The study's research methodology combines both qualitative interviews and quantitative surveys.", "vn_ex": "Phương pháp luận nghiên cứu của đề tài kết hợp cả phỏng vấn định tính và khảo sát định lượng."}, {"word": "thesis", "pos": "noun", "ipa": "/ˈθiːsɪs/", "meaning": "luận án, luận điểm", "example": "The main thesis of the paper argues that renewable energy can fully sustain industrial development.", "vn_ex": "Luận điểm chính của bài báo lập luận rằng năng lượng tái tạo hoàn toàn có thể duy trì sự phát triển công nghiệp."}, {"word": "cognition", "pos": "noun", "ipa": "/kɑːɡˈnɪʃn/", "meaning": "nhận thức", "example": "Studies in cognitive psychology examine how human brain processes visual information during reading.", "vn_ex": "Các nghiên cứu trong tâm lý học nhận thức kiểm tra cách não bộ con người xử lý thông tin hình ảnh trong quá trình đọc."}, {"word": "sustainability", "pos": "noun", "ipa": "/səˌsteɪnəˈbɪləti/", "meaning": "sự bền vững", "example": "Agricultural sustainability depends heavily on protecting regional water resources and soil quality.", "vn_ex": "Sự bền vững nông nghiệp phụ thuộc rất lớn vào việc bảo vệ tài nguyên nước và chất lượng đất của khu vực."}, {"word": "criteria", "pos": "noun", "ipa": "/kraɪˈtɪriə/", "meaning": "tiêu chuẩn", "example": "The selection criteria for the clinical trial participants were extremely strict to ensure accurate results.", "vn_ex": "Các tiêu chuẩn lựa chọn người tham gia thử nghiệm lâm sàng cực kỳ nghiêm ngặt để đảm bảo kết quả chính xác."}, {"word": "investigate", "pos": "verb", "ipa": "/ɪnˈvestɪɡeɪt/", "meaning": "nghiên cứu, điều tra", "example": "Environmentalists plan to investigate the impact of industrial runoff on the marine ecosystem.", "vn_ex": "Các nhà môi trường học có kế hoạch nghiên cứu tác động của nước thải công nghiệp lên hệ sinh thái biển."}, {"word": "coordinate", "pos": "verb", "ipa": "/koʊˈɔːrdɪneɪt/", "meaning": "phối hợp, điều phối", "example": "The laboratory assistant will coordinate the experimental tasks across different research groups.", "vn_ex": "Trợ lý phòng thí nghiệm sẽ phối hợp các nhiệm vụ thực nghiệm giữa các nhóm nghiên cứu khác nhau."}, {"word": "demonstrate", "pos": "verb", "ipa": "/ˈdemənstreɪt/", "meaning": "chứng minh, minh họa", "example": "The statistics demonstrate a clear correlation between daily physical exercise and reduced stress levels.", "vn_ex": "Các số liệu thống kê chứng minh mối tương quan rõ ràng giữa việc tập thể dục hàng ngày và việc giảm mức độ căng thẳng."}, {"word": "accreditation", "pos": "noun", "ipa": "/əˌkredɪˈteɪʃn/", "meaning": "sự công nhận, sự kiểm định", "example": "The university achieved formal accreditation after meeting the national standards for higher education.", "vn_ex": "Trường đại học đã đạt được sự kiểm định chính thức sau khi đáp ứng các tiêu chuẩn quốc gia về giáo dục đại học."}, {"word": "interdisciplinary", "pos": "adjective", "ipa": "/ˌɪntərˈdɪsəplɪneri/", "meaning": "liên ngành", "example": "Solving complex environmental problems requires an interdisciplinary approach combining biology and economics.", "vn_ex": "Giải quyết các vấn đề môi trường phức tạp đòi hỏi một phương pháp liên ngành kết hợp giữa sinh học và kinh tế học."}, {"word": "dissertation", "pos": "noun", "ipa": "/ˌdɪsərˈteɪʃn/", "meaning": "luận văn, công trình nghiên cứu chuyên sâu", "example": "He spent three years conducting surveys and compiling data for his doctoral dissertation.", "vn_ex": "Anh ấy đã dành ba năm để tiến hành các cuộc khảo sát và biên soạn dữ liệu cho luận văn tiến sĩ của mình."}], "grammar_theory": "# Academic Hedging \n## Giới thiệu \n Academic Hedging là một kỹ thuật ngôn ngữ được sử dụng để thể hiện sự không chắc chắn hoặc nghi ngờ trong văn viết học thuật. \n### Công thức cấu trúc \n- Suggest: `It is suggested that` hoặc `There is a suggestion that` \n- Indicate: `It is indicated that` hoặc `There is an indication that` \n- Possibly: `It is possible that` \n- Likely: `It is likely that` \n ## Cách dùng \n- Sử dụng trong văn viết học thuật để thể hiện sự không chắc chắn hoặc nghi ngờ về một thông tin hoặc kết quả. \n ## Ví dụ \n- `It is suggested that` việc học tiếng Anh qua các phương tiện truyền thông xã hội có thể cải thiện kỹ năng nghe và nói. (Việc học tiếng Anh qua các phương tiện truyền媒体 xã hội có thể được đề xuất để cải thiện kỹ năng nghe và nói.) \n- `There is an indication that` sự thay đổi khí hậu có thể ảnh hưởng đến sản lượng lương thực. (Có một dấu hiệu cho thấy sự thay đổi khí hậu có thể ảnh hưởng đến sản lượng lương thực.)", "quiz": [{"question": "Theo nghiên cứu gần đây, ___ rằng việc sử dụng điện thoại thông minh quá mức có thể dẫn đến giảm khả năng tập trung.", "options": ["nó được đề xuất", "nó được chỉ ra", "nó có thể", "nó là chắc chắn"], "answer": 1, "explanation": "Câu hỏi này yêu cầu sử dụng cấu trúc `It is indicated that` để thể hiện sự không chắc chắn về kết quả nghiên cứu. Đáp án đúng là `nó được chỉ ra` vì nó tương đương với `It is indicated that`."}, {"question": "___ rằng việc học ngoại ngữ có thể giúp cải thiện kỹ năng tư duy logic.", "options": ["nó được đề xuất", "nó được chỉ ra", "nó có thể", "nó là chắc chắn"], "answer": 0, "explanation": "Câu hỏi này yêu cầu sử dụng cấu trúc `It is suggested that` để thể hiện sự đề xuất về lợi ích của việc học ngoại ngữ. Đáp án đúng là `nó được đề xuất` vì nó tương đương với `It is suggested that`."}, {"question": "Nghiên cứu cho thấy ___ rằng việc tiêu thụ đường quá mức có thể dẫn đến các vấn đề sức khỏe.", "options": ["nó được đề xuất", "nó được chỉ ra", "nó có thể", "nó là chắc chắn"], "answer": 1, "explanation": "Câu hỏi này yêu cầu sử dụng cấu trúc `It is indicated that` để thể hiện sự chỉ ra về kết quả nghiên cứu. Đáp án đúng là `nó được chỉ ra` vì nó tương đương với `It is indicated that`."}, {"question": "___ rằng việc tập thể dục thường xuyên có thể giúp giảm cân.", "options": ["nó được đề xuất", "nó được chỉ ra", "nó có thể", "nó là chắc chắn"], "answer": 0, "explanation": "Câu hỏi này yêu cầu sử dụng cấu trúc `It is suggested that` để thể hiện sự đề xuất về lợi ích của việc tập thể dục. Đáp án đúng là `nó được đề xuất` vì nó tương đương với `It is suggested that`."}, {"question": "Theo một số nghiên cứu, ___ rằng việc sử dụng công nghệ quá mức có thể ảnh hưởng đến giấc ngủ.", "options": ["nó được đề xuất", "nó được chỉ ra", "nó có thể", "nó là chắc chắn"], "answer": 1, "explanation": "Câu hỏi này yêu cầu sử dụng cấu trúc `It is indicated that` để thể hiện sự chỉ ra về kết quả nghiên cứu. Đáp án đúng là `nó được chỉ ra` vì nó tương đương với `It is indicated that`."}]}, "NAWL Unit 4: Academic Word List 451-600": {"vocab": [{"word": "accumulate", "pos": "verb", "ipa": "/əˈkjuːmjəleɪt/", "meaning": "tích lũy, tích tụ", "example": "Scientists attempt to accumulate sufficient empirical evidence before publishing their theories.", "vn_ex": "Các nhà khoa học cố gắng tích lũy đầy đủ bằng chứng thực nghiệm trước khi công bố các lý thuyết của mình."}, {"word": "adjacent", "pos": "adjective", "ipa": "/əˈdʒeɪsnt/", "meaning": "kế cận, liền kề", "example": "The researchers analyzed the soil samples from adjacent fields to compare nutrient levels.", "vn_ex": "Các nghiên cứu viên đã phân tích các mẫu đất từ các cánh đồng liền kề để so sánh mức độ dinh dưỡng."}, {"word": "albeit", "pos": "conjunction", "ipa": "/ˌɔːlˈbiːɪt/", "meaning": "mặc dù, dẫu cho", "example": "The experiment yielded promising results, albeit with a relatively small sample size.", "vn_ex": "Thực nghiệm đã mang lại kết quả đầy hứa hẹn, mặc dù với quy mô mẫu tương đối nhỏ."}, {"word": "allocate", "pos": "verb", "ipa": "/ˈæləkeɪt/", "meaning": "phân bổ, chỉ định", "example": "The university committee must allocate funding equitably among all research departments.", "vn_ex": "Hội đồng trường đại học phải phân bổ kinh phí một cách công bằng giữa tất cả các khoa nghiên cứu."}, {"word": "ambiguous", "pos": "adjective", "ipa": "/æmˈbɪɡjuəs/", "meaning": "mơ hồ, không rõ ràng", "example": "The survey questions were too ambiguous, leading to inconsistent responses from the participants.", "vn_ex": "Các câu hỏi khảo sát quá mơ hồ, dẫn đến những phản hồi không nhất quán từ những người tham gia."}, {"word": "analogy", "pos": "noun", "ipa": "/əˈnælədʒi/", "meaning": "sự tương tự, phép loại suy", "example": "The professor drew an analogy between the human brain and a complex computer network.", "vn_ex": "Giáo sư đã đưa ra một phép loại suy giữa bộ não con người và một mạng lưới máy tính phức tạp."}, {"word": "anticipate", "pos": "verb", "ipa": "/ænˈtɪsɪpeɪt/", "meaning": "dự đoán, lường trước", "example": "Economists anticipate that the new fiscal policy will stabilize the national inflation rate.", "vn_ex": "Các nhà kinh tế học dự báo rằng chính sách tài khóa mới sẽ ổn định tỷ lệ lạm phát của quốc gia."}, {"word": "appendix", "pos": "noun", "ipa": "/əˈpendɪks/", "meaning": "phụ lục", "example": "Detailed statistical charts and raw data can be found in the appendix at the end of the dissertation.", "vn_ex": "Các biểu đồ thống kê chi tiết và dữ liệu thô có thể được tìm thấy trong phần phụ lục ở cuối luận văn."}, {"word": "arbitrary", "pos": "adjective", "ipa": "/ˈɑːrbɪtrəri/", "meaning": "tùy ý, ngẫu nhiên, không theo quy luật", "example": "The selection of subjects for the control group should not be based on arbitrary criteria.", "vn_ex": "Việc lựa chọn các đối tượng cho nhóm đối chứng không nên dựa trên các tiêu chí tùy ý."}, {"word": "bias", "pos": "noun", "ipa": "/ˈbaɪəs/", "meaning": "thiên kiến, sự thiên lệch", "example": "Double-blind studies are designed to eliminate researcher bias during clinical trials.", "vn_ex": "Các nghiên cứu mù đôi được thiết kế để loại bỏ thiên kiến của nhà nghiên cứu trong các thử nghiệm lâm sàng."}, {"word": "bulk", "pos": "noun", "ipa": "/bʌlk/", "meaning": "phần lớn, số lượng lớn", "example": "The bulk of the literature review focuses on cognitive development theories from the last decade.", "vn_ex": "Phần lớn của phần tổng quan tài liệu tập trung vào các lý thuyết phát triển nhận thức từ thập kỷ qua."}, {"word": "coherent", "pos": "adjective", "ipa": "/koʊˈhɪrənt/", "meaning": "mạch lạc, chặt chẽ", "example": "The author failed to present a coherent argument to support her hypothesis.", "vn_ex": "Tác giả đã thất bại trong việc trình bày một lập luận mạch lạc để hỗ trợ giả thuyết của mình."}, {"word": "coincide", "pos": "verb", "ipa": "/ˌkoʊɪnˈsaɪd/", "meaning": "trùng hợp, xảy ra đồng thời", "example": "The publication of the study was timed to coincide with the international science conference.", "vn_ex": "Thời điểm công bố nghiên cứu được lên lịch trùng với hội nghị khoa học quốc tế."}, {"word": "compatible", "pos": "adjective", "ipa": "/kəmˈpætəbl/", "meaning": "tương thích, phù hợp", "example": "The newly developed software is fully compatible with older operating systems.", "vn_ex": "Phần mềm mới phát triển tương thích hoàn toàn với các hệ điều hành cũ hơn."}, {"word": "compile", "pos": "verb", "ipa": "/kəmˈpaɪl/", "meaning": "biên soạn, thu thập", "example": "The research assistants helped to compile historical census data from various archives.", "vn_ex": "Các trợ lý nghiên cứu đã giúp thu thập dữ liệu điều tra dân số lịch sử từ nhiều nguồn lưu trữ khác nhau."}, {"word": "comprise", "pos": "verb", "ipa": "/kəmˈpraɪz/", "meaning": "bao gồm, gồm có", "example": "The academic committee is comprised of distinguished scholars from several disciplines.", "vn_ex": "Hội đồng học thuật bao gồm các học giả ưu tú từ nhiều ngành học khác nhau."}, {"word": "conceive", "pos": "verb", "ipa": "/kənˈsiːv/", "meaning": "nhận thức, hình dung, phác thảo", "example": "It is difficult to conceive of a solution that satisfies all parties involved in the dispute.", "vn_ex": "Thật khó để hình dung ra một giải pháp làm hài lòng tất cả các bên liên quan đến tranh chấp."}, {"word": "concurrent", "pos": "adjective", "ipa": "/kənˈkʌrənt/", "meaning": "đồng thời, xảy ra cùng lúc", "example": "The patient underwent concurrent chemotherapy and radiation treatments.", "vn_ex": "Bệnh nhân đã trải qua các đợt hóa trị và xạ trị đồng thời."}, {"word": "confine", "pos": "verb", "ipa": "/kənˈfaɪn/", "meaning": "hạn chế, giới hạn", "example": "Please confine your discussion to the academic topics listed on the syllabus.", "vn_ex": "Vui lòng giới hạn cuộc thảo luận của bạn trong các chủ đề học thuật được liệt kê trong giáo trình."}, {"word": "controversy", "pos": "noun", "ipa": "/ˈhjuːmən raɪts/", "meaning": "cuộc tranh luận, sự tranh cãi", "example": "The introduction of genetically modified crops has sparked intense scientific controversy.", "vn_ex": "Việc đưa vào sử dụng cây trồng biến đổi gen đã làm bùng nổ cuộc tranh cãi khoa học dữ dội."}, {"word": "empirical", "pos": "adjective", "ipa": "/ɪmˈpɪrɪkl/", "meaning": "thực nghiệm, dựa trên thực tế", "example": "The researcher provided solid empirical evidence to support her claims.", "vn_ex": "Nhà nghiên cứu đã cung cấp bằng chứng thực nghiệm vững chắc để hỗ trợ các tuyên bố của mình."}, {"word": "hypothesis", "pos": "noun", "ipa": "/haɪˈpɑːθəsɪs/", "meaning": "giả thuyết", "example": "A rigorous experiment was designed to test the validity of the research hypothesis.", "vn_ex": "Một thí nghiệm nghiêm ngặt đã được thiết kế để kiểm tra tính hợp lệ của giả thuyết nghiên cứu."}, {"word": "infer", "pos": "verb", "ipa": "/ɪnˈfɜːr/", "meaning": "suy luận, luận ra", "example": "From the experimental data, we can infer that temperature plays a critical role in the reaction rate.", "vn_ex": "Từ dữ liệu thực nghiệm, chúng ta có thể suy ra rằng nhiệt độ đóng vai trò quyết định đối với tốc độ phản ứng."}, {"word": "paradigm", "pos": "noun", "ipa": "/ˈpærədaɪm/", "meaning": "mô hình, hệ hình", "example": "The discovery of quantum mechanics led to a major paradigm shift in physics.", "vn_ex": "Sự phát hiện ra cơ học lượng tử đã dẫn đến một bước chuyển dịch hệ hình lớn trong vật lý."}, {"word": "subsequent", "pos": "adjective", "ipa": "/ˈsʌbsɪkwənt/", "meaning": "xảy ra sau đó, đến sau", "example": "Subsequent studies have confirmed the initial findings of the scientific team.", "vn_ex": "Các nghiên cứu sau đó đã xác nhận những phát hiện ban đầu của nhóm khoa học."}], "grammar_theory": "# Inversion for Style and Emphasis in Formal Academic Prose\n## Công thức cấu trúc\n- **S + had + P**: Thể bị động với động từ `had` để diễn tả một hành động xảy ra trước một hành động khác trong quá khứ.\n- **Were + S + P**: Thể bị động với động từ `were` để diễn tả một tình huống giả định hoặc không xảy ra.\n## Cách dùng thực tế\n- Sử dụng trong văn viết học thuật để tạo ra sự nhấn mạnh hoặc thay đổi cấu trúc câu.\n- Ví dụ: `Had the research been conducted earlier, the results would have been more accurate.` (Nếu nghiên cứu được thực hiện sớm hơn, kết quả sẽ chính xác hơn.)\n- Ví dụ: `Were the data available, we would have included them in our analysis.` (Nếu dữ liệu có sẵn, chúng tôi sẽ bao gồm chúng trong phân tích của mình.)", "quiz": [{"question": "Had the experiment ___ earlier, the scientists would have obtained different results.", "options": ["been conducted", "been conducting", "conducted", "conducting"], "answer": 0, "explanation": "Chọn đáp án A vì cấu trúc `Had + S + been + P` thể hiện một hành động xảy ra trước một hành động khác trong quá khứ. Câu dịch: Nếu thí nghiệm được thực hiện sớm hơn, các nhà khoa học sẽ có được những kết quả khác."}, {"question": "Were the information ___ , we would have made a different decision.", "options": ["available", "availability", "avail", "to avail"], "answer": 0, "explanation": "Chọn đáp án A vì cấu trúc `Were + S + P` thể hiện một tình huống giả định. Câu dịch: Nếu thông tin có sẵn, chúng tôi sẽ đưa ra một quyết định khác."}, {"question": "Should the company ___ more investment, it would have expanded its operations.", "options": ["have received", "received", "been receiving", "have been receiving"], "answer": 0, "explanation": "Chọn đáp án A vì cấu trúc `Should + S + have + P` thể hiện một điều kiện giả định trong quá khứ. Câu dịch: Nếu công ty nhận được nhiều đầu tư hơn, nó sẽ mở rộng hoạt động của mình."}, {"question": "Had the weather ___ better, we would have gone to the beach.", "options": ["been", "being", "be", "to be"], "answer": 0, "explanation": "Chọn đáp án A vì cấu trúc `Had + S + been + P` thể hiện một hành động xảy ra trước một hành động khác trong quá khứ. Câu dịch: Nếu thời tiết tốt hơn, chúng tôi sẽ đi đến bãi biển."}, {"question": "Were it not for the support of our team, ___ the project.", "options": ["we would not have completed", "we would have completed", "we completed", "we have completed"], "answer": 0, "explanation": "Chọn đáp án A vì cấu trúc `Were + it + not + for + S` thể hiện một tình huống giả định. Câu dịch: Nếu không có sự hỗ trợ của đội chúng tôi, chúng tôi sẽ không hoàn thành dự án."}]}, "BSL Unit 1: Business Core Words 1-150": {"vocab": [{"word": "goods", "pos": "noun", "ipa": "/ɡʊdz/", "meaning": "hàng hóa", "example": "The company specializes in the import and export of consumer goods.", "vn_ex": "Công ty chuyên xuất nhập khẩu hàng hóa tiêu dùng."}, {"word": "equity", "pos": "noun", "ipa": "/ˈekwɪti/", "meaning": "vốn chủ sở hữu, cổ phần", "example": "The startup raised five million dollars in exchange for 10% equity in the company.", "vn_ex": "Công ty khởi nghiệp đã huy động được 5 triệu đô la để đổi lấy 10% cổ phần của công ty."}, {"word": "dividend", "pos": "noun", "ipa": "/ˈdɪvɪdend/", "meaning": "cổ tức", "example": "The board of directors approved a quarterly dividend payment of fifty cents per share.", "vn_ex": "Hội đồng quản trị đã phê duyệt mức chi trả cổ tức hàng quý là năm mươi xu cho mỗi cổ phiếu."}, {"word": "portfolio", "pos": "noun", "ipa": "/pɔːrtˈfəʊlioʊ/", "meaning": "danh mục đầu tư", "example": "Financial advisor
