  <style>
    :root {
      --bg-color: radial-gradient(circle at top, #1a162b 0%, #0d0b15 100%);
      --card-bg: rgba(30, 24, 52, 0.45);
      --text-main: #ffffff;
      --text-muted: #a0aec0;
      --primary: #9f7aea;
      --primary-glow: rgba(159, 122, 234, 0.4);
      --success: #48bb78;
      --error: #f56565;
      --border-color: rgba(255, 255, 255, 0.08);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    header {
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 30%, var(--primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .nav-buttons {
      display: flex;
      gap: 15px;
    }
    button {
      background: rgba(255, 255, 255, 0.05);
      color: white;
      border: 1px solid var(--border-color);
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s ease;
    }
    button:hover {
      background: var(--primary);
      box-shadow: 0 0 15px var(--primary-glow);
      border-color: transparent;
    }
    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
      width: 100%;
      flex: 1;
      display: flex;
      gap: 30px;
    }
    .sidebar {
      width: 300px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      height: fit-content;
      backdrop-filter: blur(10px);
    }
    .sidebar h3 {
      font-family: 'Outfit', sans-serif;
      margin-bottom: 15px;
      font-size: 18px;
      color: var(--primary);
    }
    .unit-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .unit-item {
      padding: 12px 15px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s ease;
    }
    .unit-item:hover, .unit-item.active {
      background: rgba(159, 122, 234, 0.15);
      border-color: var(--primary);
      color: var(--primary);
    }
    .main-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }
    .tab-bar {
      display: flex;
      gap: 15px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }
    .tab-btn {
      background: none;
      border: none;
      padding: 10px 20px;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 16px;
      border-bottom: 3px solid transparent;
      border-radius: 0;
    }
    .tab-btn:hover {
      color: white;
      background: none;
      box-shadow: none;
    }
    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    .content-area {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 40px;
      min-height: 500px;
      backdrop-filter: blur(10px);
      position: relative;
    }
    .vocab-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .vocab-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      transition: all 0.3s ease;
    }
    .vocab-card:hover {
      transform: translateY(-5px);
      border-color: var(--primary);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }
    .vocab-word {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 5px;
    }
    .vocab-meta {
      display: flex;
      gap: 10px;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 15px;
    }
    .vocab-ipa {
      font-family: monospace;
      background: rgba(255, 255, 255, 0.05);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .vocab-meaning {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 15px;
    }
    .vocab-ex {
      font-size: 13px;
      line-height: 1.6;
      border-left: 2px solid var(--primary);
      padding-left: 10px;
    }
    .vocab-ex-vn {
      color: var(--text-muted);
      margin-top: 5px;
    }
    .grammar-area {
      line-height: 1.8;
    }
    .grammar-area h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      color: var(--primary);
      margin-bottom: 20px;
    }
    .grammar-area h3 {
      font-size: 18px;
      margin: 20px 0 10px;
    }
    .grammar-area pre, .grammar-area code {
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      color: #e2e8f0;
    }
    .grammar-area pre {
      padding: 15px;
      display: block;
      margin: 15px 0;
      overflow-x: auto;
    }
    .quiz-container {
      max-width: 800px;
      margin: 0 auto;
    }
    .quiz-title {
      font-family: 'Outfit', sans-serif;
      font-size: 22px;
      margin-bottom: 30px;
      text-align: center;
    }
    .quiz-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 20px;
    }
    .quiz-question {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .quiz-option {
      padding: 15px 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 15px;
      font-weight: 500;
    }
    .quiz-option:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--primary);
    }
    .quiz-option.correct {
      background: rgba(72, 187, 120, 0.15);
      border-color: var(--success);
      color: var(--success);
    }
    .quiz-option.incorrect {
      background: rgba(245, 101, 116, 0.15);
      border-color: var(--error);
      color: var(--error);
    }
    .quiz-explanation {
      margin-top: 20px;
      padding: 15px;
      background: rgba(255, 255, 255, 0.03);
      border-left: 4px solid var(--primary);
      border-radius: 0 8px 8px 0;
      font-size: 14px;
      line-height: 1.6;
    }
    .hidden {
      display: none !important;
    }
    footer {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
      font-size: 14px;
      border-top: 1px solid var(--border-color);
      background: rgba(0, 0, 0, 0.2);
    }
  </style>

    const slideData = {"Advanced Unit 1: Philosophy & Psychology": {"vocab": [{"word": "cognitive", "pos": "adjective", "ipa": "/ˈkɒɡnɪtɪv/", "meaning": "Thuộc nhận thức", "example": "The researcher investigated the cognitive processes underlying language acquisition in bilingual children.", "vn_ex": "Nhà nghiên cứu đã điều tra các quá trình nhận thức làm cơ sở cho sự tiếp thu ngôn ngữ ở trẻ em song ngữ."}, {"word": "empathy", "pos": "noun", "ipa": "/ˈɛmpəθi/", "meaning": "Sự đồng cảm", "example": "Cultivating deep empathy is essential for clinical psychologists to establish a strong therapeutic alliance with their clients.", "vn_ex": "Nuôi dưỡng sự đồng cảm sâu sắc là điều cần thiết để các nhà tâm lý học lâm sàng thiết lập một liên minh trị liệu bền vững với khách hàng của họ."}, {"word": "subconscious", "pos": "noun", "ipa": "/ˌsʌbˈkɒnʃəs/", "meaning": "Tiềm thức", "example": "Dreams are often considered a window into the subconscious mind, revealing repressed desires and unresolved conflicts.", "vn_ex": "Giấc mơ thường được coi là một cửa sổ đi vào tâm trí tiềm thức, tiết lộ những ham muốn bị dồn nén và những xung đột chưa được giải quyết."}, {"word": "psychoanalysis", "pos": "noun", "ipa": "/ˌsaɪkəʊəˈnælɪsɪs/", "meaning": "Phân tâm học", "example": "Freudian psychoanalysis emphasizes the role of early childhood experiences in shaping adult personality and behavior.", "vn_ex": "Phân tâm học của Freud nhấn mạnh vai trò của những trải nghiệm thời thơ ấu trong việc định hình nhân cách và hành vi của người trưởng thành."}, {"word": "neurotransmitter", "pos": "noun", "ipa": "/ˈnjʊərəʊtrænsˌmɪtə/", "meaning": "Chất truyền dẫn thần kinh", "example": "An imbalance of neurotransmitters such as serotonin and dopamine is closely linked to various mood disorders.", "vn_ex": "Sự mất cân bằng của các chất truyền dẫn thần kinh như serotonin và dopamine có liên quan chặt chẽ đến các chứng rối loạn tâm trạng khác nhau."}, {"word": "conditioning", "pos": "noun", "ipa": "/kənˈdɪʃənɪŋ/", "meaning": "Định hình (hoặc Điều kiện hóa)", "example": "Classical conditioning demonstrates how an organism can learn to associate a neutral stimulus with an involuntary reflex.", "vn_ex": "Điều kiện hóa cổ điển chứng minh cách một sinh vật có thể học cách liên kết một kích thích trung tính với một phản xạ không tự ý."}, {"word": "behaviorism", "pos": "noun", "ipa": "/bɪˈheɪvjərɪzəm/", "meaning": "Chủ nghĩa hành vi", "example": "Strict behaviorism rejects the study of internal mental states, focusing instead on observable and measurable actions.", "vn_ex": "Chủ nghĩa hành vi nghiêm ngặt bác bỏ việc nghiên cứu các trạng thái tâm lý nội tại, thay vào đó tập trung vào các hành động có thể quan sát và đo lường được."}, {"word": "cognitive dissonance", "pos": "noun", "ipa": "/ˈkɒɡnɪtɪv ˈdɪsənəns/", "meaning": "Mâu thuẫn nhận thức", "example": "When individuals hold contradictory beliefs, they experience cognitive dissonance, which motivates them to alter their perceptions.", "vn_ex": "Khi các cá nhân giữ những niềm tin mâu thuẫn nhau, họ trải qua sự bất hòa nhận thức, điều này thúc đẩy họ thay đổi nhận thức của mình."}, {"word": "neurosis", "pos": "noun", "ipa": "/njʊəˈrəʊsɪs/", "meaning": "Rối loạn thần kinh (hoặc Chứng loạn thần kinh chức năng)", "example": "Her chronic anxiety was diagnosed as a mild form of neurosis, stemming from prolonged occupational stress.", "vn_ex": "Sự lo âu mãn tính của cô được chẩn đoán là một dạng loạn thần kinh nhẹ, bắt nguồn từ tình trạng căng thẳng kéo dài trong công việc."}, {"word": "self-esteem", "pos": "noun", "ipa": "/ˌsɛlfɪˈstiːm/", "meaning": "Lòng tự trọng", "example": "Psychological resilience is heavily dependent on a stable sense of self-esteem and self-worth.", "vn_ex": "Khả năng phục hồi tâm lý phụ thuộc rất lớn vào ý thức ổn định về lòng tự trọng và giá trị bản thân."}, {"word": "regression", "pos": "noun", "ipa": "/rɪˈɡrɛʃən/", "meaning": "Sự thoái lui", "example": "Under extreme psychological pressure, the patient exhibited regression by adopting childlike coping mechanisms.", "vn_ex": "Dưới áp lực tâm lý cực độ, bệnh nhân đã biểu hiện sự thoái lui bằng cách áp dụng các cơ chế đối phó giống như trẻ con."}, {"word": "altruism", "pos": "noun", "ipa": "/ˈæltrʊɪzəm/", "meaning": "Lòng vị tha", "example": "Evolutionary psychologists study altruism to understand how self-sacrificing behavior could benefit species survival.", "vn_ex": "Các nhà tâm lý học tiến hóa nghiên cứu lòng vị tha để hiểu làm thế nào hành vi tự hy sinh có thể mang lại lợi ích cho sự sống sót của loài."}, {"word": "phobia", "pos": "noun", "ipa": "/ˈfəʊbiə/", "meaning": "Nỗi sợ hãi phi lý", "example": "Cognitive behavioral therapy is highly effective in treating specific phobias by gradually exposing patients to their fears.", "vn_ex": "Liệu pháp nhận thức hành vi rất hiệu quả trong việc điều trị các chứng sợ hãi cụ thể bằng cách cho bệnh nhân tiếp xúc dần dần với nỗi sợ của họ."}, {"word": "therapy", "pos": "noun", "ipa": "/ˈθɛrəpi/", "meaning": "Liệu pháp", "example": "Psychological therapy provides a safe space for individuals to process trauma and develop healthier coping strategies.", "vn_ex": "Trị liệu tâm lý cung cấp một không gian an toàn để các cá nhân xử lý chấn thương và phát triển các chiến lược đối phó lành mạnh hơn."}, {"word": "mindfulness", "pos": "noun", "ipa": "/ˈmaɪndfʊlnəs/", "meaning": "Chánh niệm", "example": "Practicing mindfulness has been scientifically proven to reduce stress and improve emotional regulation.", "vn_ex": "Thực hành chánh niệm đã được chứng minh khoa học là giúp giảm căng thẳng và cải thiện khả năng điều chỉnh cảm xúc."}, {"word": "cognition", "pos": "noun", "ipa": "/kɒɡˈnɪʃən/", "meaning": "Nhận thức", "example": "The study of human cognition encompasses mental activities such as attention, memory, and problem-solving.", "vn_ex": "Nghiên cứu về nhận thức của con người bao gồm các hoạt động tâm trí như sự chú ý, trí nhớ và giải quyết vấn đề."}, {"word": "neuroscience", "pos": "noun", "ipa": "/ˈnjʊəroʊˌsaɪəns/", "meaning": "Khoa học thần kinh", "example": "Advances in cognitive neuroscience have illuminated the neurological bases of decision-making and learning.", "vn_ex": "Những tiến bộ trong khoa học thần kinh nhận thức đã làm sáng tỏ các cơ sở thần kinh của việc ra quyết định và học tập."}, {"word": "phenomenology", "pos": "noun", "ipa": "/fɪˌnɒmɪˈnɒlədʒi/", "meaning": "Hiện tượng học", "example": "Phenomenology explores the structures of conscious experience from the first-person point of view.", "vn_ex": "Hiện tượng học khám phá các cấu trúc của trải nghiệm có ý thức dưới góc nhìn của người trong cuộc."}, {"word": "pragmatism", "pos": "noun", "ipa": "/ˈpræɡmətɪzəm/", "meaning": "Chủ nghĩa thực dụng", "example": "American pragmatism suggests that the value of an idea lies in its practical utility and observable consequences.", "vn_ex": "Chủ nghĩa thực dụng của Mỹ cho rằng giá trị của một ý tưởng nằm ở tính hữu dụng thực tế và các hệ quả có thể quan sát được của nó."}, {"word": "determinism", "pos": "noun", "ipa": "/dɪˈtɜːmɪnɪzəm/", "meaning": "Thuyết quyết định", "example": "The debate between free will and determinism has remained a central philosophical inquiry for centuries.", "vn_ex": "Cuộc tranh luận giữa ý chí tự do và thuyết quyết định vẫn là một cuộc thăm dò triết học trung tâm trong nhiều thế kỷ."}, {"word": "absolutism", "pos": "noun", "ipa": "/ˈæbsəluːtɪzəm/", "meaning": "Thuyết tuyệt đối / Chủ nghĩa tuyệt đối", "example": "In moral philosophy, moral absolutism posits that certain actions are inherently right or wrong, regardless of context.", "vn_ex": "Trong triết học đạo đức, thuyết tuyệt đối đạo đức cho rằng một số hành động vốn dĩ là đúng hoặc sai, bất kể bối cảnh."}, {"word": "biophilia", "pos": "noun", "ipa": "/ˌbaɪoʊˈfɪliə/", "meaning": "Lòng yêu sự sống (Bản năng hướng về sự sống)", "example": "The biophilia hypothesis posits that humans possess an innate tendency to seek connections with nature and other life forms.", "vn_ex": "Giả thuyết lòng yêu sự sống cho rằng con người sở hữu một xu hướng bẩm sinh là tìm kiếm sự kết nối với thiên nhiên và các dạng sự sống khác."}, {"word": "bioethics", "pos": "noun", "ipa": "/ˌbaɪoʊˈɛθɪks/", "meaning": "Đạo đức sinh học", "example": "Bioethics is a crucial interdisciplinary field that addresses moral dilemmas in medical research and genetic engineering.", "vn_ex": "Đạo đức sinh học là một lĩnh vực liên ngành quan trọng giải quyết các tình huống khó xử về mặt đạo đức trong nghiên cứu y học và kỹ thuật di truyền."}, {"word": "cognizant", "pos": "adjective", "ipa": "/ˈkɒɡnɪzənt/", "meaning": "Có nhận thức, hiểu rõ", "example": "Philosophers must remain cognizant of cognitive biases that can distort rational reasoning during philosophical inquiry.", "vn_ex": "Các nhà triết học phải luôn nhận thức được các thiên kiến nhận thức có thể làm bóp méo lập luận lý lý trong quá trình tìm tòi triết học."}, {"word": "psychosomatic", "pos": "adjective", "ipa": "/ˌsaɪkoʊsoʊˈmætɪk/", "meaning": "(Thuộc) tâm thể (do tâm lý ảnh hưởng đến cơ thể)", "example": "Chronic physical ailments can sometimes be psychosomatic, originating from unresolved emotional distress.", "vn_ex": "Các cơn đau thể chất mãn tính đôi khi có thể mang tính tâm thể, bắt nguồn từ những tổn thương cảm xúc chưa được giải quyết."}], "grammar_theory": "# Cleft Sentences for Emphasis in Academic Arguments\n## Công thức cấu trúc\nCleft sentences được sử dụng để nhấn mạnh một phần của câu trong các lập luận học thuật. Công thức cấu trúc như sau:\n- It + was/were + chủ ngữ + who/which/that + động từ\n- It + was/were + chủ ngữ + that + mệnh đề\n## Cách dùng thực tế\nCleft sentences giúp nhấn mạnh một phần của câu để làm rõ lập luận hoặc ý tưởng trong các bài viết và cuộc thảo luận học thuật.\nVí dụ:\n- `It was the research team that discovered the new species.` (Chính là nhóm nghiên cứu đã phát hiện ra loài mới.)\n- `It was the lack of funding that prevented the project from being completed.` (Chính là sự thiếu hụt kinh phí đã ngăn cản dự án được hoàn thành.)", "quiz": [{"question": "It ___ the new policy that has led to the significant increase in sales.", "options": ["was", "were", "is", "are"], "answer": 0, "explanation": "Chọn đáp án 'was' vì chủ ngữ 'the new policy' là một danh từ đơn số, và để nhấn mạnh rằng chính chính sách mới đã dẫn đến sự tăng trưởng đáng kể trong doanh số."}, {"question": "The manager believed that it ___ the employees who were responsible for the mistake.", "options": ["was", "were", "are", "is"], "answer": 1, "explanation": "Chọn đáp án 'were' vì chủ ngữ 'the employees' là một danh từ số nhiều, và để nhấn mạnh rằng chính nhân viên đã chịu trách nhiệm về sai lầm."}, {"question": "It ___ the combination of hard work and dedication that has made her a successful entrepreneur.", "options": ["was", "were", "is", "are"], "answer": 0, "explanation": "Chọn đáp án 'was' vì chủ ngữ 'the combination of hard work and dedication' là một danh từ đơn số, và để nhấn mạnh rằng chính sự kết hợp giữa làm việc chăm chỉ và cống hiến đã khiến cô trở thành một doanh nhân thành đạt."}, {"question": "The professor argued that it ___ the lack of resources that has hindered the progress of the research project.", "options": ["was", "were", "are", "is"], "answer": 0, "explanation": "Chọn đáp án 'was' vì chủ ngữ 'the lack of resources' là một danh từ đơn số, và để nhấn mạnh rằng chính sự thiếu hụt nguồn lực đã cản trở sự tiến bộ của dự án nghiên cứu."}, {"question": "It ___ the innovative approach that has enabled the company to stay ahead of its competitors.", "options": ["was", "were", "are", "is"], "answer": 0, "explanation": "Chọn đáp án 'was' vì chủ ngữ 'the innovative approach' là một danh từ đơn số, và để nhấn mạnh rằng chính cách tiếp cận đổi mới đã cho phép công ty dẫn đầu trước các đối thủ cạnh tranh."}]}, "Advanced Unit 2: Politics & Law": {"vocab": [{"word": "democracy", "pos": "noun", "ipa": "/dɪˈmɒkrəsi/", "meaning": "dân chủ", "example": "True democracy requires not only periodic elections but also the robust protection of minority rights and the preservation of the rule of law.", "vn_ex": "Một nền dân chủ thực sự đòi hỏi không chỉ các cuộc bầu cử định kỳ mà còn cả sự bảo vệ vững chắc các quyền của thiểu số và sự giữ gìn pháp quyền."}, {"word": "socialism", "pos": "noun", "ipa": "/ˈsəʊʃəlɪzəm/", "meaning": "chủ nghĩa xã hội", "example": "The academic debate centers on whether democratic socialism can successfully reconcile state-controlled resources with individual economic freedoms.", "vn_ex": "Cuộc tranh luận học thuật tập trung vào việc liệu chủ nghĩa xã hội dân chủ có thể dung hòa thành công các nguồn lực do nhà nước kiểm soát với các quyền tự do kinh tế cá nhân hay không."}, {"word": "totalitarianism", "pos": "noun", "ipa": "/təʊˌtæl.ɪˈteə.ri.ə.nɪ.zəm/", "meaning": "chủ nghĩa độc tài", "example": "Under totalitarianism, the state exercises absolute control over all aspects of public and private life through propaganda and systematic coercion.", "vn_ex": "Dưới chế độ độc tài, nhà nước thực thi sự kiểm soát tuyệt đối đối với mọi khía cạnh của đời sống công cộng và tư nhân thông qua tuyên truyền và cưỡng chế có hệ thống."}, {"word": "human rights", "pos": "noun", "ipa": "/ˈhjuːmən raɪts/", "meaning": "quyền con người", "example": "The international community is obligated to intervene when sovereign states systematically violate fundamental human rights within their borders.", "vn_ex": "Cộng đồng quốc tế có nghĩa vụ can thiệp khi các quốc gia có chủ quyền vi phạm một cách hệ thống các quyền con người cơ bản trong biên giới của họ."}, {"word": "social justice", "pos": "noun", "ipa": "/ˈsəʊʃəl ˈdʒʌstɪs/", "meaning": "công bằng xã hội", "example": "Advocates of social justice argue that systemic inequalities in wealth distribution must be addressed through targeted institutional reforms.", "vn_ex": "Những người ủng hộ công bằng xã hội lập luận rằng sự bất bình đẳng mang tính hệ thống trong phân phối của cải phải được giải quyết thông qua các cuộc cải cách thể chế có mục tiêu."}, {"word": "diplomacy", "pos": "noun", "ipa": "/dɪˈpləʊməsi/", "meaning": "ngoại giao", "example": "The peaceful resolution of the maritime border dispute was hailed as a triumph of multilateral diplomacy over unilateral military posturing.", "vn_ex": "Việc giải quyết hòa bình tranh chấp biên giới trên biển đã được ca ngợi là một thắng lợi của ngoại giao đa phương trước những thái độ quân sự đơn phương."}, {"word": "bilateral", "pos": "adjective", "ipa": "/baɪˈlætərəl/", "meaning": "song phương, hai bên", "example": "The two neighboring countries signed a bilateral treaty aimed at reducing tariffs and fostering cross-border security cooperation.", "vn_ex": "Hai nước láng giềng đã ký một hiệp ước song phương nhằm cắt giảm thuế quan và thúc đẩy hợp tác an ninh xuyên biên giới."}, {"word": "corruption", "pos": "noun", "ipa": "/kəˈrʌpʃən/", "meaning": "tham nhũng", "example": "Pervasive administrative corruption severely undermines public trust in state institutions and stifles long-term economic development.", "vn_ex": "Nạn tham nhũng hành chính tràn lan làm suy giảm nghiêm trọng niềm tin của công chúng vào các thể chế nhà nước và kìm hãm sự phát triển kinh tế dài hạn."}, {"word": "constitution", "pos": "noun", "ipa": "/ˌkɒnstɪˈtjuːʃən/", "meaning": "hiến pháp", "example": "The supreme court is responsible for interpreting the constitution to ensure that newly enacted laws do not infringe upon civil liberties.", "vn_ex": "Tòa án tối cao chịu trách nhiệm giải thích hiến pháp để đảm bảo rằng các luật mới ban hành không xâm phạm các quyền tự do dân sự."}, {"word": "censorship", "pos": "noun", "ipa": "/ˈsɛnsəʃɪp/", "meaning": "kiểm duyệt", "example": "State censorship of digital media not only restricts freedom of expression but also hampers the dissemination of critical scientific research.", "vn_ex": "Sự kiểm duyệt của nhà nước đối với các phương tiện truyền thông kỹ thuật số không chỉ hạn chế tự do biểu đạt mà còn cản trở việc phổ biến các nghiên cứu khoa học quan trọng."}, {"word": "regime", "pos": "noun", "ipa": "/reɪˈʒiːm/", "meaning": "chế độ, chính thể", "example": "The authoritarian regime maintained its grip on power by suppressing political dissidents and controlling the judicial branch.", "vn_ex": "Chế độ độc tài đã duy trì sự nắm giữ quyền lực bằng cách trấn áp những người bất đồng chính kiến và kiểm soát nhánh tư pháp."}, {"word": "autocracy", "pos": "noun", "ipa": "/ɔːˈtɒkrəsi/", "meaning": "chế độ chuyên quyền", "example": "Historically, autocracy has often led to institutional instability due to the concentration of decision-making power in a single individual.", "vn_ex": "Về mặt lịch sử, chế độ chuyên quyền thường dẫn đến sự bất ổn thể chế do sự tập trung quyền lực ra quyết định vào một cá nhân duy nhất."}, {"word": "suffrage", "pos": "noun", "ipa": "/ˈsʌfrɪdʒ/", "meaning": "quyền bầu cử", "example": "The constitutional amendment guaranteed universal suffrage, effectively eliminating wealth and gender barriers to the ballot box.", "vn_ex": "Sửa đổi hiến pháp đã đảm bảo quyền bầu cử phổ thông, loại bỏ một cách hiệu quả các rào cản về tài sản và giới tính đối với thùng phiếu."}, {"word": "protest", "pos": "noun", "ipa": "/ˈprəʊtɛst/", "meaning": "sự biểu tình, phản đối", "example": "What began as a peaceful protest against public spending cuts quickly escalated into a widespread movement demanding systemic political reform.", "vn_ex": "Những gì bắt đầu như một cuộc biểu tình ôn hòa phản đối việc cắt giảm chi tiêu công đã nhanh chóng leo thang thành một phong trào rộng khắp đòi hỏi cải cách chính trị mang tính hệ thống."}, {"word": "sovereignty", "pos": "noun", "ipa": "/ˈsɒvrənti/", "meaning": "chủ quyền", "example": "The treaty explicitly respects the territorial integrity and national sovereignty of all signatory states.", "vn_ex": "Hiệp ước tôn trọng một cách rõ ràng sự toàn vẹn lãnh thổ và chủ quyền quốc gia của tất cả các quốc gia ký kết."}, {"word": "precedent", "pos": "noun", "ipa": "/ˈpresɪdənt/", "meaning": "tiền lệ pháp lý", "example": "The landmark ruling established a powerful judicial precedent that will govern similar privacy disputes for decades to come.", "vn_ex": "Phán quyết lịch sử đã thiết lập một tiền lệ pháp lý mạnh mẽ sẽ chi phối các tranh chấp tương tự về quyền riêng tư trong nhiều thập kỷ tới."}, {"word": "absolutism", "pos": "noun", "ipa": "/ˈæbsəluːtɪzəm/", "meaning": "chủ nghĩa tuyệt đối", "example": "Enlightenment philosophers rigorously challenged the divine right of kings, which served as the theological foundation for political absolutism.", "vn_ex": "Các nhà triết học Khai sáng đã thách thức một cách nghiêm khắc quyền lực tối cao của các vị vua, vốn đóng vai trò là nền tảng thần học cho chủ nghĩa tuyệt đối chính trị."}, {"word": "discretion", "pos": "noun", "ipa": "/dɪˈskreʃən/", "meaning": "thẩm quyền quyết định, sự tự do hành động", "example": "The judge exercised judicial discretion in sentencing, taking into account the defendant's lack of prior criminal record.", "vn_ex": "Thẩm phán đã thực thi quyền quyết định tư pháp trong việc tuyên án, có cân nhắc đến việc bị cáo không có tiền án tiền sự trước đó."}, {"word": "intervene", "pos": "verb", "ipa": "/ˌɪntəˈviːn/", "meaning": "can thiệp", "example": "The central bank decided to intervene in the foreign exchange market to stabilize the rapidly depreciating national currency.", "vn_ex": "Ngân hàng trung ương quyết định can thiệp vào thị trường ngoại hối nhằm ổn định đồng nội tệ đang mất giá nhanh chóng."}, {"word": "mitigation", "pos": "noun", "ipa": "/ˌmɪtɪˈɡeɪʃən/", "meaning": "sự giảm nhẹ, giảm thiểu", "example": "Legislators proposed several environmental policies aimed at the mitigation of carbon emissions from heavy industries.", "vn_ex": "Các nhà lập pháp đã đề xuất một số chính sách môi trường nhằm giảm thiểu lượng khí thải carbon từ các ngành công nghiệp nặng."}, {"word": "fiscal policy", "pos": "noun", "ipa": "/ˈfɪskəl ˈpɒlɪsi/", "meaning": "chính sách tài khóa", "example": "The government adjusted its fiscal policy, increasing public infrastructure spending to stimulate economic growth during the recession.", "vn_ex": "Chính phủ đã điều chỉnh chính sách tài khóa của mình, tăng chi tiêu cho cơ sở hạ tầng công cộng để kích thích tăng trưởng kinh tế trong thời kỳ suy thoái."}, {"word": "negotiate", "pos": "verb", "ipa": "/nɪˈɡəʊʃieɪt/", "meaning": "đàm phán, thương lượng", "example": "Diplomats from both nations spent months trying to negotiate a mutually acceptable trade agreement.", "vn_ex": "Các nhà ngoại giao từ cả hai quốc gia đã dành nhiều tháng để cố gắng đàm phán một thỏa thuận thương mại được chấp nhận bởi cả hai bên."}, {"word": "accreditation", "pos": "noun", "ipa": "/əˌkredɪˈteɪʃən/", "meaning": "sự kiểm định, sự công nhận chất lượng", "example": "The law school obtained formal accreditation from the national bar association after a rigorous review of its curriculum.", "vn_ex": "Trường luật đã nhận được sự công nhận chính thức từ hiệp hội luật sư quốc gia sau một cuộc đánh giá nghiêm ngặt về chương trình giảng dạy của mình."}, {"word": "contractor", "pos": "noun", "ipa": "/kənˈtræktə(r)/", "meaning": "nhà thầu", "example": "The government hired an independent contractor to modernize the military's communication infrastructure under a legally binding agreement.", "vn_ex": "Chính phủ đã thuê một nhà thầu độc lập để hiện đại hóa cơ sở hạ tầng thông tin liên lạc của quân đội theo một thỏa thuận có tính ràng buộc pháp lý."}, {"word": "academic integrity", "pos": "noun", "ipa": "/ˌækəˈdemɪk ɪnˈteɡrəti/", "meaning": "sự trung thực học thuật", "example": "The university strictly enforces its policy on academic integrity to prevent plagiarism and maintain the credibility of its research.", "vn_ex": "Trường đại học thực thi nghiêm ngặt chính sách của mình về sự trung thực học thuật nhằm ngăn chặn đạo văn và duy trì uy tín cho các nghiên cứu của mình."}], "grammar_theory": "# Concessive Clauses (Albeit, Notwithstanding, However) in Legal Writing\n## Giới thiệu\nConcessive Clauses được sử dụng để thể hiện sự nhượng bộ hoặc chấp nhận một điểm nào đó, ngay cả khi nó đi ngược lại với ý chính của câu. Trong văn viết pháp lý, những từ như `albeit`, `notwithstanding`, và `however` thường được sử dụng để bắt đầu những mệnh đề nhượng bộ này.\n### Công thức cấu trúc\n- Albeit + mệnh đề nhượng bộ: Chỉ ra rằng mặc dù có một thực tế nào đó, nhưng kết quả hoặc tình huống vẫn diễn ra theo cách khác.\n- Notwithstanding + mệnh đề nhượng bộ: Thể hiện rằng một quy định hoặc tình huống cụ thể không bị ảnh hưởng bởi một yếu tố khác.\n- However + mệnh đề nhượng bộ: Được sử dụng để chỉ ra sự tương phản giữa hai ý tưởng.\n## Ví dụ\n- The new policy has been implemented, **albeit** with some minor adjustments. (Chính sách mới đã được thực hiện, mặc dù có một số điều chỉnh nhỏ.)\n- The company will proceed with the merger, **notwithstanding** the objections from some shareholders. (Công ty sẽ tiếp tục với việc sáp nhập, bất chấp sự phản đối từ một số cổ đông.)\n- The law has been passed, **however**, its implementation remains uncertain. (Luật đã được thông qua, tuy nhiên, việc thực thi nó vẫn còn bất ổn.)", "quiz": [{"question": "The court ruled in favor of the defendant, ___ the prosecution's strong evidence.", "options": ["albeit", "notwithstanding", "however", "despite"], "answer": 1, "explanation": "Câu hỏi này yêu cầu sử dụng từ `notwithstanding` để thể hiện rằng mặc dù có bằng chứng mạnh từ phía công tố, tòa án vẫn phán quyết có lợi cho bị cáo. Từ `notwithstanding` chỉ ra rằng quyết định của tòa không bị ảnh hưởng bởi bằng chứng đó."}, {"question": "The new employee was very skilled, ___ he had never worked in this field before.", "options": ["albeit", "notwithstanding", "however", "although"], "answer": 0, "explanation": "Câu hỏi này sử dụng từ `albeit` để chỉ ra rằng mặc dù nhân viên mới rất có kỹ năng, anh ta chưa từng làm việc trong lĩnh vực này trước đây. Từ `albeit` thể hiện sự nhượng bộ về kinh nghiệm của nhân viên."}, {"question": "The company decided to launch the product, ___ the potential risks involved.", "options": ["albeit", "notwithstanding", "however", "despite"], "answer": 1, "explanation": "Câu hỏi này yêu cầu sử dụng từ `notwithstanding` để thể hiện rằng công ty quyết định tung sản phẩm ra thị trường, bất chấp những rủi ro tiềm ẩn. Từ `notwithstanding` chỉ ra rằng quyết định của công ty không bị ảnh hưởng bởi những rủi ro đó."}, {"question": "The law has been changed, ___ its original intent remains the same.", "options": ["albeit", "notwithstanding", "however", "nevertheless"], "answer": 0, "explanation": "Câu hỏi này sử dụng từ `albeit` để chỉ ra rằng mặc dù luật đã được thay đổi, mục đích ban đầu của nó vẫn không đổi. Từ `albeit` thể hiện sự nhượng bộ về sự thay đổi của luật."}, {"question": "The researcher spent years studying the phenomenon, ___ the results were not as expected.", "options": ["albeit", "notwithstanding", "however", "despite"], "answer": 2, "explanation": "Câu hỏi này yêu cầu sử dụng từ `however` để thể hiện rằng mặc dù nhà nghiên cứu đã dành nhiều năm để nghiên cứu hiện tượng, kết quả lại không như mong đợi. Từ `however` chỉ ra sự tương phản giữa thời gian và công sức đầu tư vào nghiên cứu với kết quả không đạt được."}]}, "Advanced Unit 3: Literature & Arts": {"vocab": [{"word": "Abstract", "pos": "Tính từ", "ipa": "/ˈæbstrækt/", "meaning": "Trừu tượng", "example": "The artist's canvas was filled with abstract shapes and vivid colors, defying any conventional representation of reality.", "vn_ex": "Bức tranh của nghệ sĩ tràn ngập các hình dạng trừu tượng và màu sắc sống động, thách thức mọi sự thể hiện thực tế theo quy ước."}, {"word": "Impressionistic", "pos": "Tính từ", "ipa": "/ɪmˌprɛʃəˈnɪstɪk/", "meaning": "Ấn tượng", "example": "Her impressionistic style of writing focuses on capturing sensory details and emotional atmosphere rather than objective facts.", "vn_ex": "Phong cách viết mang tính ấn tượng của cô tập trung vào việc ghi lại các chi tiết cảm quan và bầu không khí cảm xúc hơn là những sự thật khách quan."}, {"word": "Surrealism", "pos": "Danh từ", "ipa": "/səˈrɪəlɪzəm/", "meaning": "Chủ nghĩa siêu thực", "example": "Surrealism in literature often employs dreamlike sequences and illogical juxtapositions to explore the depth of the human subconscious.", "vn_ex": "Chủ nghĩa siêu thực trong văn học thường sử dụng các trình tự như trong mơ và các sự tương phản phi lý để khám phá chiều sâu của tiềm thức con người."}, {"word": "Allegory", "pos": "Danh từ", "ipa": "/ˈæləɡɔːri/", "meaning": "Ẩn dụ, chuyện ngụ ngôn", "example": "The novel serves as a profound political allegory, using the conflicts within a small village to mirror the global geopolitical struggles.", "vn_ex": "Cuốn tiểu thuyết đóng vai trò như một câu chuyện ẩn dụ chính trị sâu sắc, sử dụng những xung đột trong một ngôi làng nhỏ để phản ánh cuộc đấu tranh địa chính trị toàn cầu."}, {"word": "Symbolism", "pos": "Danh từ", "ipa": "/ˈsɪmbəlɪzəm/", "meaning": "Chủ nghĩa tượng trưng", "example": "The playwright utilizes complex symbolism, such as a decaying mansion, to represent the moral decline of the aristocratic family.", "vn_ex": "Nhà viết kịch sử dụng chủ nghĩa tượng trưng phức tạp, chẳng hạn như một dinh thự mục nát, để đại diện cho sự suy đồi đạo đức của gia đình quý tộc."}, {"word": "Renaissance", "pos": "Danh từ", "ipa": "/ˈrɛnəˌsɑːns/", "meaning": "Thời kỳ Phục hưng", "example": "The Renaissance marked a magnificent epoch of intellectual and artistic revival, heavily influenced by classical Greco-Roman ideals.", "vn_ex": "Thời kỳ Phục hưng đánh dấu một kỷ nguyên phục hưng rực rỡ về trí tuệ và nghệ thuật, chịu ảnh hưởng mạnh mẽ bởi các lý tưởng Hy-La cổ điển."}, {"word": "Baroque", "pos": "Tính từ", "ipa": "/bəˈroʊk/", "meaning": "Thời kỳ Baroque", "example": "The cathedral is renowned for its Baroque architecture, characterized by ornate decorations, grand scale, and dramatic use of light.", "vn_ex": "Nhà thờ lớn này nổi tiếng với kiến trúc Baroque, được đặc trưng bởi các chi tiết trang trí công phu, quy mô hoáng tráng và việc sử dụng ánh sáng đầy kịch tính."}, {"word": "Cubism", "pos": "Danh từ", "ipa": "/ˈkjuːbɪzəm/", "meaning": "Chủ nghĩa lập thể", "example": "By decomposing objects into geometric fragments, Cubism fundamentally altered the perspective of modern art.", "vn_ex": "Bằng cách phân rã các đối tượng thành các mảnh hình học, chủ nghĩa lập thể đã thay đổi căn bản góc nhìn của nghệ thuật hiện đại."}, {"word": "Impression", "pos": "Danh từ", "ipa": "/ɪmˈprɛʃən/", "meaning": "Ấn tượng, cảm giác", "example": "The visual exhibition left an indelible impression on the viewers, sparking intense academic debates about contemporary aesthetics.", "vn_ex": "Triển lãm trực quan đã để lại một ấn tượng sâu sắc không thể phai mờ trong lòng người xem, khơi mào cho những cuộc tranh luận học thuật gay gắt về mỹ học đương đại."}, {"word": "Fresco", "pos": "Danh từ", "ipa": "/ˈfɛskoʊ/", "meaning": "Tranh vẽ trên tường", "example": "The restoration of the ancient fresco on the chapel walls revealed vibrant pigments that had been obscured for centuries.", "vn_ex": "Việc phục hồi bức tranh fresco cổ kính trên tường nhà nguyện đã hé lộ những sắc tố rực rỡ vốn bị che mờ trong nhiều thế kỷ."}, {"word": "Mosaic", "pos": "Danh từ", "ipa": "/moʊˈzeɪɪk/", "meaning": "Khảm, ghép hình", "example": "Historians studied the Roman mosaic floor to gain insights into the daily life and cultural practices of the ancient civilization.", "vn_ex": "Các nhà sử học đã nghiên cứu sàn tranh khảm La Mã để hiểu thêm về cuộc sống hàng ngày và các tập tục văn hóa của nền văn minh cổ đại."}, {"word": "Composition", "pos": "Danh từ", "ipa": "/ˌkɑːmpəˈzɪʃən/", "meaning": "Cấu trúc, sự sắp xếp", "example": "The flawless composition of the symphony seamlessly blends classical structures with innovative modernist melodies.", "vn_ex": "Bố cục hoàn hảo của bản giao hưởng đã kết hợp một cách liền mạch các cấu trúc cổ điển với những giai điệu tối tân đầy đổi mới."}, {"word": "Portrait", "pos": "Danh từ", "ipa": "/ˈpɔːrtrət/", "meaning": "Chân dung", "example": "The psychological portrait captured not only the physical features of the subject but also the profound melancholy of her soul.", "vn_ex": "Bức chân dung tâm lý không chỉ ghi lại các đặc điểm thể chất của đối tượng mà còn cả nỗi u sầu sâu thẳm trong tâm hồn cô."}, {"word": "Critique", "pos": "Danh từ", "ipa": "/krɪˈtiːk/", "meaning": "Phê bình", "example": "The scholar published an incisive critique of the play, highlighting its radical departures from traditional dramatic structures.", "vn_ex": "Học giả đã xuất bản một bài phê bình sắc sảo về vở kịch, làm nổi bật sự tách biệt táo bạo của nó khỏi các cấu trúc kịch nghệ truyền thống."}, {"word": "Autobiography", "pos": "Danh từ", "ipa": "/ˌɔːtəbaɪˈɑːɡrəfi/", "meaning": "Tự truyện", "example": "In his celebrated autobiography, the renowned author details the literary influences that shaped his early writing career.", "vn_ex": "Trong cuốn tự truyện nổi tiếng của mình, nhà văn danh tiếng đã trình bày chi tiết về những ảnh hưởng văn học đã định hình sự nghiệp sáng tác thời kỳ đầu của ông."}, {"word": "Memoir", "pos": "Danh từ", "ipa": "/ˈmɛmwɑːr/", "meaning": "Hồi ký", "example": "Her poignant memoir provides an intimate exploration of the creative struggles she faced during the post-war artistic movement.", "vn_ex": "Cuốn hồi ký cảm động của bà mang lại một sự khám phá thân mật về những đấu tranh sáng tạo mà bà phải đối mặt trong phong trào nghệ thuật thời hậu chiến."}, {"word": "Biography", "pos": "Danh từ", "ipa": "/baɪˈɒɡrəfi/", "meaning": "Tiểu sử", "example": "This comprehensive biography meticulously documents the historical context and artistic evolution of the Renaissance master.", "vn_ex": "Cuốn tiểu sử toàn diện này tài liệu hóa một cách tỉ mỉ bối cảnh lịch sử và sự tiến hóa nghệ thuật của bậc thầy thời kỳ Phục hưng."}, {"word": "Cultural Heritage", "pos": "Cụm danh từ", "ipa": "/ˈkʌltʃərəl ˈhɛrɪtɪdʒ/", "meaning": "Di sản văn hóa", "example": "Preserving intangible cultural heritage, such as traditional folk songs and oral storytelling, is vital for community identity.", "vn_ex": "Việc bảo tồn di sản văn hóa phi vật thể, như các bài dân ca truyền thống và nghệ thuật truyền miệng, là vô cùng quan trọng đối với bản sắc cộng đồng."}, {"word": "Symphony", "pos": "Danh từ", "ipa": "/ˈsɪm.fə.ni/", "meaning": "Bản giao hưởng", "example": "Beethoven's Ninth Symphony is celebrated globally as a monumental masterpiece of classical orchestral music.", "vn_ex": "Bản giao hưởng số chín của Beethoven được tôn vinh trên toàn cầu như một kiệt tác vĩ đại của âm nhạc dàn nhạc cổ điển."}, {"word": "Overture", "pos": "Danh từ", "ipa": "/ˈoʊ.vər.tʃʊr/", "meaning": "Khúc dạo đầu", "example": "The opera's dramatic overture set a tense and suspenseful tone for the tragedy that was about to unfold on stage.", "vn_ex": "Khúc dạo đầu đầy kịch tính của vở nhạc kịch đã thiết lập nên một tông giọng căng thẳng và hồi hộp cho bi kịch sắp diễn ra trên sân khấu."}, {"word": "Chamber music", "pos": "Cụm danh từ", "ipa": "/ˈtʃeɪm.bə ˌmjuː.zɪk/", "meaning": "Nhạc thính phòng", "example": "Chamber music, written for a small group of instruments, demands extraordinary intimacy and precise communication among players.", "vn_ex": "Nhạc thính phòng, được viết cho một nhóm nhỏ các nhạc cụ, đòi hỏi sự thân mật phi thường và sự giao tiếp chuẩn xác giữa các nhạc công."}, {"word": "Orchestra", "pos": "Danh từ", "ipa": "/ˈɔː.kɪ.strə/", "meaning": "Dàn nhạc", "example": "The composition of the orchestra was carefully curated to achieve a balanced resonance across all instrumental sections.", "vn_ex": "Cấu trúc của dàn nhạc đã được lựa chọn cẩn thận để đạt được một sự cộng hưởng cân bằng giữa tất cả các bộ nhạc cụ."}, {"word": "Conductor", "pos": "Danh từ", "ipa": "/kənˈdʌk.tər/", "meaning": "Nhạc trưởng", "example": "Under the expressive guidance of the conductor, the musicians delivered a deeply moving rendition of the classical suite.", "vn_ex": "Dưới sự dẫn dắt đầy biểu cảm của vị nhạc trưởng, các nhạc công đã mang đến một màn trình diễn vô cùng xúc động về bản tổ khúc cổ điển."}, {"word": "Composer", "pos": "Danh từ", "ipa": "/kəmˈpoʊ.zər/", "meaning": "Nhà soạn nhạc", "example": "The avant-garde composer experimented with unconventional soundscapes, redefining the boundaries of modern musical art.", "vn_ex": "Nhà soạn nhạc tiên phong đã thử nghiệm những không gian âm thanh độc lạ, định nghĩa lại các ranh giới của nghệ thuật âm nhạc hiện đại."}, {"word": "Sculpture", "pos": "Danh từ", "ipa": "/ˈskʌlptʃər/", "meaning": "Tác phẩm điêu khắc / Điêu khắc", "example": "The museum’s exhibition features a striking marble sculpture that portrays the intricate drapery of classical Greek attire.", "vn_ex": "Triển lãm của bảo tàng trưng bày một tác phẩm điêu khắc bằng đá cẩm thạch nổi bật, mô tả các nếp gấp vải tinh xảo của trang phục Hy Lạp cổ điển."}], "grammar_theory": "# Inversion after Directional and Locational Adverbs in Literary Prose\n## Công thức cấu trúc\nInversion xảy ra khi một số trạng từ chỉ hướng hoặc vị trí đứng đầu câu, thường được sử dụng trong văn viết nghệ thuật. Công thức: `Adverb + Auxiliary Verb + Subject + Main Verb`.\n## Cách dùng thực tế\nTrong văn viết nghệ thuật, đặc biệt là trong tiểu thuyết và thơ, inversion sau các trạng từ chỉ hướng hoặc vị trí được sử dụng để tạo ra hiệu ứng nghệ thuật hoặc nhấn mạnh một hành động. Ví dụ: `Up went the balloon into the sky` (Bóng bay bổng lên trời).", "quiz": [{"question": "___ the sun rises over the mountains, the birds begin to sing.", "options": ["Up", "Up goes", "Down", "Out"], "answer": 1, "explanation": "Chọn đáp án B vì inversion sau trạng từ chỉ hướng 'up' được sử dụng để nhấn mạnh hành động của mặt trời mọc. Câu dịch: Khi mặt trời mọc lên trên dãy núi, những con chim bắt đầu hát."}, {"question": "___ the door opened, a figure appeared in the doorway.", "options": ["In", "In came", "Out", "Down"], "answer": 1, "explanation": "Chọn đáp án B vì inversion sau trạng từ chỉ vị trí 'in' được sử dụng để tạo ra hiệu ứng nghệ thuật. Câu dịch: Khi cửa mở ra, một hình người xuất hiện ở cửa ra vào."}, {"question": "___ the music started, everyone began to dance.", "options": ["Out", "Out came", "On", "Up"], "answer": 1, "explanation": "Chọn đáp án B vì inversion sau trạng từ chỉ hướng 'out' được sử dụng để nhấn mạnh hành động của âm nhạc bắt đầu. Câu dịch: Khi nhạc bắt đầu, mọi người bắt đầu nhảy múa."}, {"question": "___ the lights went out, the room was plunged into darkness.", "options": ["Down", "Down went", "Out", "In"], "answer": 1, "explanation": "Chọn đáp án B vì inversion sau trạng từ chỉ hướng 'down' được sử dụng để tạo ra hiệu ứng nghệ thuật. Câu dịch: Khi đèn tắt, căn phòng chìm trong bóng tối."}, {"question": "___ the curtain fell, the audience erupted into applause.", "options": ["Down", "Down went", "Up", "Out"], "answer": 1, "explanation": "Chọn đáp án B vì inversion sau trạng từ chỉ hướng 'down' được sử dụng để nhấn mạnh hành động của màn hình rơi. Câu dịch: Khi màn hình rơi xuống, khán giả爆 phát ra tiếng vỗ tay."}]}, "Advanced Unit 4: Science & Research": {"vocab": [{"word": "Quantum", "pos": "noun/adjective", "ipa": "/ˈkwɒntəm/", "meaning": "Lượng tử", "example": "The development of quantum computing promises to solve complex algorithmic problems that are currently intractable for classical supercomputers.", "vn_ex": "Sự phát triển của điện toán lượng tử hứa hẹn sẽ giải quyết các vấn đề thuật toán phức tạp mà các siêu máy tính cổ điển hiện nay không thể xử lý được."}, {"word": "Biotechnology", "pos": "noun", "ipa": "/ˌbaɪəʊtɛkˈnɒlədʒi/", "meaning": "Công nghệ sinh học", "example": "Advanced biotechnology has enabled researchers to develop highly targeted immunotherapies that significantly improve patient outcomes in oncology.", "vn_ex": "Công nghệ sinh học tiên tiến đã cho phép các nhà nghiên cứu phát triển các liệu pháp miễn dịch nhắm mục tiêu cao, giúp cải thiện đáng kể kết quả điều trị cho bệnh nhân trong ngành ung bướu."}, {"word": "Nanotechnology", "pos": "noun", "ipa": "/ˌnænəʊtɛkˈnɒlədʒi/", "meaning": "Công nghệ nano", "example": "In modern medicine, nanotechnology is utilized to synthesize targeted drug-delivery systems that release therapeutic agents directly to diseased cells.", "vn_ex": "Trong y học hiện đại, công nghệ nano được sử dụng để tổng hợp các hệ thống dẫn truyền thuốc nhắm mục tiêu nhằm giải phóng các chất điều trị trực tiếp đến các tế bào bị bệnh."}, {"word": "Artificial Intelligence", "pos": "noun", "ipa": "/ˌɑːtɪˈfɪʃəl ˌɪntəˈlɪdʒəns/", "meaning": "Trí tuệ nhân tạo", "example": "The integration of artificial intelligence into diagnostic radiology has greatly enhanced the accuracy and speed of identifying subtle anomalies in medical imaging.", "vn_ex": "Sự tích hợp của trí tuệ nhân tạo vào chẩn đoán hình ảnh đã nâng cao đáng kể độ chính xác và tốc độ nhận diện những bất thường nhỏ trong ảnh chụp y khoa."}, {"word": "Blockchain", "pos": "noun", "ipa": "/ˈblɒktʃeɪn/", "meaning": "Công nghệ chuỗi khối", "example": "Researchers are exploring blockchain technology as a decentralized framework to guarantee the security and immutable logging of clinical trial data.", "vn_ex": "Các nhà nghiên cứu đang khám phá công nghệ chuỗi khối như một khung phi tập trung nhằm đảm bảo an ninh và việc ghi chép bất biến đối với dữ liệu thử nghiệm lâm sàng."}, {"word": "Cybersecurity", "pos": "noun", "ipa": "/ˌsaɪbərsɪˈkjʊərɪti/", "meaning": "An ninh mạng", "example": "Deploying robust cybersecurity measures is imperative for research institutions to safeguard proprietary scientific databases from espionage.", "vn_ex": "Việc triển khai các biện pháp an ninh mạng mạnh mẽ là bắt buộc đối với các tổ chức nghiên cứu để bảo vệ các cơ sở dữ liệu khoa học độc quyền khỏi hành vi gián điệp."}, {"word": "Genome", "pos": "noun", "ipa": "/ˈdʒiːnəʊm/", "meaning": "Hệ gen", "example": "Mapping the entire human genome has unlocked unprecedented insights into the polygenic basis of complex hereditary disorders.", "vn_ex": "Việc lập bản đồ toàn bộ hệ gen người đã mở ra những hiểu biết chưa từng có về cơ sở đa gen của các rối loạn di truyền phức tạp."}, {"word": "Cloning", "pos": "noun", "ipa": "/ˈkləʊnɪŋ/", "meaning": "Nhân bản", "example": "Somatic cell nuclear transfer, a primary method in therapeutic cloning, offers potential avenues for generating patient-specific stem cells.", "vn_ex": "Chuyển nhân tế bào sinh dưỡng, một phương pháp chính trong nhân bản trị liệu, cung cấp các hướng đi tiềm năng để tạo ra các tế bào gốc đặc hiệu cho từng bệnh nhân."}, {"word": "Robotics", "pos": "noun", "ipa": "/rəʊˈbɒtɪks/", "meaning": "Kỹ thuật robot", "example": "The application of robotics in minimally invasive surgery has minimized human error and drastically reduced patient recovery times.", "vn_ex": "Việc ứng dụng kỹ thuật robot trong phẫu thuật xâm lấn tối thiểu đã giảm thiểu sai sót của con người và rút ngắn đáng kể thời gian hồi phục của bệnh nhân."}, {"word": "Automation", "pos": "noun", "ipa": "/ˌɔːtəˈmeɪʃən/", "meaning": "Tự động hóa", "example": "Laboratory automation in high-throughput screening allows for the rapid testing of thousands of chemical compounds against specific biological targets.", "vn_ex": "Tự động hóa phòng thí nghiệm trong sàng lọc hiệu suất cao cho phép thử nghiệm nhanh chóng hàng ngàn hợp chất hóa học đối với các mục tiêu sinh học cụ thể."}, {"word": "Virtual Reality", "pos": "noun", "ipa": "/ˈvɜːtʃʊəl riˈæləti/", "meaning": "Thực tế ảo", "example": "Cognitive rehabilitation therapies often utilize virtual reality to immerse patients in controlled environments to safely rebuild motor functions.", "vn_ex": "Các liệu pháp phục hồi chức năng nhận thức thường sử dụng thực tế ảo để đưa bệnh nhân vào môi trường được kiểm soát nhằm tái thiết lập các chức năng vận động một cách an toàn."}, {"word": "Sustainability", "pos": "noun", "ipa": "/səˌsteɪnəˈbɪləti/", "meaning": "Sự bền vững", "example": "The research project evaluates the long-term sustainability of utilizing cellulosic biofuels as viable alternatives to petroleum-based fuels.", "vn_ex": "Dự án nghiên cứu đánh giá sự bền vững lâu dài của việc sử dụng nhiên liệu sinh học từ cen-lu-lô-zơ như những lựa chọn thay thế khả thi cho nhiên liệu gốc dầu mỏ."}, {"word": "Genetic Engineering", "pos": "noun", "ipa": "/dʒɪˈnɛtɪk ˌɛndʒɪˈnɪərɪŋ/", "meaning": "Kỹ thuật di truyền", "example": "Through genetic engineering, scientists have cultivated transgenic crops that exhibit increased resistance to environmental stressors like salinity and drought.", "vn_ex": "Thông qua kỹ thuật di truyền, các nhà khoa học đã canh tác các loại cây trồng chuyển gen có khả năng kháng cự tăng cường đối với các tác nhân gây căng thẳng môi trường như độ mặn và hạn hán."}, {"word": "Neuroscience", "pos": "noun", "ipa": "/ˈnjʊəroʊˌsaɪəns/", "meaning": "Khoa học thần kinh", "example": "Contemporary neuroscience has made profound strides in elucidating the neural pathways responsible for memory consolidation and emotional regulation.", "vn_ex": "Khoa học thần kinh đương đại đã đạt được những bước tiến sâu sắc trong việc làm sáng tỏ các con đường thần kinh chịu trách nhiệm cho việc củng cố trí nhớ và điều hòa cảm xúc."}, {"word": "Thesis", "pos": "noun", "ipa": "/ˈθiːsɪs/", "meaning": "Luận án", "example": "Her doctoral thesis presents a comprehensive empirical analysis of the relationship between socioeconomic status and cognitive development.", "vn_ex": "Luận án tiến sĩ của cô trình bày một phân tích thực nghiệm toàn diện về mối quan hệ giữa địa vị kinh tế xã hội và sự phát triển nhận thức."}, {"word": "Dissertation", "pos": "noun", "ipa": "/ˌdɪsəˈteɪʃən/", "meaning": "Luận văn", "example": "The researcher successfully defended his dissertation, which proposed a novel theoretical model for explaining quantum entanglement.", "vn_ex": "Nhà nghiên cứu đã bảo vệ thành công luận văn của mình, trong đó đề xuất một mô hình lý thuyết mới để giải thích hiện tượng vướng víu lượng tử."}, {"word": "Research Methodology", "pos": "noun", "ipa": "/rɪˈsɜːʧ ˌmɛθəˈdɒlədʒi/", "meaning": "Phương pháp nghiên cứu", "example": "A rigorous research methodology is essential to eliminate confounding variables and ensure the internal validity of experimental results.", "vn_ex": "Một phương pháp nghiên cứu nghiêm ngặt là điều cần thiết để loại bỏ các biến gây nhiễu và đảm bảo tính hiệu lực nội tại của các kết quả thực nghiệm."}, {"word": "Interdisciplinary", "pos": "adjective", "ipa": "/ˌɪntəˈdɪsɪplɪnəri/", "meaning": "Liên ngành", "example": "Solving global climate challenges requires an interdisciplinary approach that integrates chemistry, ecology, economics, and public policy.", "vn_ex": "Giải quyết các thách thức khí hậu toàn cầu đòi hỏi một cách tiếp cận liên ngành tích hợp hóa học, sinh thái học, kinh tế học và chính sách công."}, {"word": "Cognition", "pos": "noun", "ipa": "/kɒɡˈnɪʃən/", "meaning": "Nhận thức", "example": "Neurodegenerative diseases such as Alzheimer's severely impair human cognition, affecting memory, language, and executive functions.", "vn_ex": "Các bệnh thoái hóa thần kinh như Alzheimer làm suy giảm nghiêm trọng nhận thức của con người, ảnh hưởng đến trí nhớ, ngôn ngữ và các chức năng điều hành."}, {"word": "Cognitive", "pos": "adjective", "ipa": "/ˈkɒɡnɪtɪv/", "meaning": "Thuộc nhận thức", "example": "Cognitive behavioral therapy is designed to modify dysfunctional thought patterns and improve emotional self-regulation.", "vn_ex": "Liệu pháp nhận thức hành vi được thiết kế để điều chỉnh các kiểu suy nghĩ lệch lạc và cải thiện khả năng tự điều chỉnh cảm xúc."}, {"word": "Neurotransmitter", "pos": "noun", "ipa": "/ˈnjʊərəʊtrænsˌmɪtə/", "meaning": "Chất truyền dẫn thần kinh", "example": "Serotonin is a critical neurotransmitter that modulates mood, sleep, and appetite, and its imbalance is often linked to depressive disorders.", "vn_ex": "Serotonin là một chất truyền dẫn thần kinh quan trọng điều hòa tâm trạng, giấc ngủ và sự thèm ăn, và sự mất cân bằng của nó thường liên quan đến các rối loạn trầm cảm."}, {"word": "Psychoanalysis", "pos": "noun", "ipa": "/ˌsaɪkəʊəˈnælɪsɪs/", "meaning": "Phân tâm học", "example": "While classical psychoanalysis heavily emphasizes the interpretation of dreams, modern psychotherapies tend to focus more on cognitive behavioral interventions.", "vn_ex": "Trong khi phân tâm học cổ điển nhấn mạnh nhiều vào việc giải mã các giấc mơ, các liệu pháp tâm lý hiện đại có xu hướng tập trung nhiều hơn vào các can thiệp nhận thức hành vi."}, {"word": "Biodiversity", "pos": "noun", "ipa": "/ˌbaɪəʊdaɪˈvɜːsɪti/", "meaning": "Đa dạng sinh học", "example": "Habitat fragmentation resulting from urbanization poses a severe threat to global biodiversity and the stability of ecological food chains.", "vn_ex": "Sự phân mảnh môi trường sống do đô thị hóa gây ra mối đe dọa nghiêm trọng đối với đa dạng sinh học toàn cầu và sự ổn định của chuỗi thức ăn sinh thái."}, {"word": "Ecosystem", "pos": "noun", "ipa": "/ˈiːkəʊˌsɪstəm/", "meaning": "Hệ sinh thái", "example": "Any disruption in the predator-prey relationship can destabilize the entire ecosystem and cause irreversible ecological damage.", "vn_ex": "Bất kỳ sự gián đoạn nào trong mối quan hệ giữa động vật săn mồi và con mồi đều có thể làm mất ổn định toàn bộ hệ sinh thái và gây ra thiệt hại sinh thái không thể đảo ngược."}, {"word": "Academic Integrity", "pos": "noun", "ipa": "/ˌækəˈdɛmɪk ɪnˈtɛɡrɪti/", "meaning": "Trung thực học thuật", "example": "Upholding academic integrity is vital for maintaining the credibility and trustworthiness of scientific research within the international community.", "vn_ex": "Duy trì sự trung thực học thuật là yếu tố sống còn để giữ vững uy tín và tính đáng tin cậy của nghiên cứu khoa học trong cộng đồng quốc tế."}], "grammar_theory": "# Perfect Participle Clauses (Active and Passive) in Research Reports\n## Công thức cấu trúc\n- Having + P2 (động từ chính ở dạng quá khứ phân từ): Diễn tả hành động xảy ra trước hành động chính trong câu.\n- Having been + P2 (động từ chính ở dạng quá khứ phân từ bị động): Diễn tả hành động bị động xảy ra trước hành động chính trong câu.\n## Cách dùng thực tế\n- Trong ngữ cảnh học thuật và giao tiếp nâng cao, các mệnh đề phân từ hoàn hảo (Perfect Participle Clauses) được sử dụng để mô tả các quá trình nghiên cứu, thí nghiệm hoặc các bước thực hiện dự án một cách rõ ràng và logic.\n## Ví dụ\n- Having conducted the experiment, we analyzed the data. (Sau khi tiến hành thí nghiệm, chúng tôi đã phân tích dữ liệu.)\n- Having been tested, the new material showed excellent durability. (Sau khi được thử nghiệm, vật liệu mới cho thấy độ bền tuyệt vời.)", "quiz": [{"question": "Having ___ the data, the researchers drew conclusions about the experiment.", "options": ["collected", "been collected", "collecting", "been collecting"], "answer": 0, "explanation": "Câu hỏi yêu cầu sử dụng động từ 'collect' ở dạng quá khứ phân từ 'collected' để diễn tả hành động thu thập dữ liệu xảy ra trước hành động rút ra kết luận."}, {"question": "The new drug, ___ extensively in clinical trials, has shown promising results.", "options": ["having been tested", "been tested", "testing", "to test"], "answer": 0, "explanation": "Câu hỏi yêu cầu sử dụng mệnh đề phân từ hoàn hảo bị động 'having been tested' để mô tả thuốc mới đã được thử nghiệm rộng rãi trong các thử nghiệm lâm sàng."}, {"question": "Having ___ the literature review, the team proceeded with the experiment.", "options": ["completed", "been completed", "completing", "been completing"], "answer": 0, "explanation": "Câu hỏi yêu cầu sử dụng động từ 'completed' ở dạng quá khứ phân từ để diễn tả hành động hoàn thành việc xem xét tài liệu xảy ra trước khi tiến hành thí nghiệm."}, {"question": "The samples, ___ in the lab, were then analyzed using advanced equipment.", "options": ["having been prepared", "been prepared", "preparing", "to prepare"], "answer": 0, "explanation": "Câu hỏi yêu cầu sử dụng mệnh đề phân từ hoàn hảo bị động 'having been prepared' để mô tả các mẫu đã được chuẩn bị trong phòng thí nghiệm trước khi được phân tích bằng thiết bị tiên tiến."}, {"question": "Having ___ the results, the scientists published their findings in a prestigious journal.", "options": ["obtained", "been obtained", "obtaining", "been obtaining"], "answer": 0, "explanation": "Câu hỏi yêu cầu sử dụng động từ 'obtained' ở dạng quá khứ phân từ để diễn tả hành động thu được kết quả xảy ra trước khi các nhà khoa học công bố phát hiện của họ trên một tạp chí danh tiếng."}]}, "Advanced Unit 5: Medicine & Biology": {"vocab": [{"word": "Cardiology", "pos": "Noun", "ipa": "/ˌkɑːdɪˈɒlədʒi/", "meaning": "Tim mạch học", "example": "Recent advancements in cardiology have significantly improved the prognosis for patients with complex congenital heart defects.", "vn_ex": "Những tiến bộ gần đây trong tim mạch học đã cải thiện đáng kể tiên lượng cho các bệnh nhân mắc dị tật tim bẩm sinh phức tạp."}, {"word": "Neurosurgery", "pos": "Noun", "ipa": "/ˈnjʊəroʊˌsɜːdʒəri/", "meaning": "Phẫu thuật thần kinh", "example": "The complexity of neurosurgery requires not only exceptional anatomical knowledge but also high-precision micro-instrumentation.", "vn_ex": "Sự phức tạp của phẫu thuật thần kinh không chỉ đòi hỏi kiến thức giải phẫu xuất sắc mà còn cần các dụng cụ vi mô có độ chính xác cao."}, {"word": "Pediatrics", "pos": "Noun", "ipa": "/ˌpiːdɪˈætrɪks/", "meaning": "Nhi khoa", "example": "Pediatrics emphasizes preventative medicine and developmental monitoring to ensure healthy progression from infancy to adolescence.", "vn_ex": "Nhi khoa nhấn mạnh y học dự phòng và theo dõi phát triển để đảm bảo sự tiến triển khỏe mạnh từ giai đoạn sơ sinh đến tuổi vị thành niên."}, {"word": "Nutrition", "pos": "Noun", "ipa": "/njuːˈtrɪʃən/", "meaning": "Dinh dưỡng", "example": "Clinical studies indicate that optimal nutrition plays a critical role in the therapeutic recovery of post-operative patients.", "vn_ex": "Các nghiên cứu lâm sàng chỉ ra rằng dinh dưỡng tối ưu đóng một vai trò quan trọng trong việc phục hồi trị liệu của các bệnh nhân sau phẫu thuật."}, {"word": "Veganism", "pos": "Noun", "ipa": "/ˈviːɡənɪzəm/", "meaning": "Chế độ ăn chay thuần", "example": "The adoption of veganism is often researched in academic literature for its potential cardiovascular benefits and environmental sustainability.", "vn_ex": "Việc áp dụng chế độ ăn chay thuần thường được nghiên cứu trong các tài liệu học thuật vì những lợi ích tim mạch tiềm năng và sự bền vững môi trường của nó."}, {"word": "Hydration", "pos": "Noun", "ipa": "/haɪˈdreɪʃən/", "meaning": "Cung cấp nước", "example": "Maintaining adequate cellular hydration is fundamental for the physiological processes regulating metabolic equilibrium.", "vn_ex": "Duy trì sự cung cấp nước đầy đủ cho tế bào là điều cơ bản cho các quá trình sinh lý điều hòa sự cân bằng chuyển hóa."}, {"word": "Detox", "pos": "Noun", "ipa": "/ˈdiːtɒks/", "meaning": "Thải độc", "example": "While popular media promotes detox diets, the human body relies primarily on the liver and kidneys for metabolic detoxification.", "vn_ex": "Trong khi các phương tiện truyền thông đại chúng quảng bá chế độ ăn thải độc, cơ thể con người chủ yếu dựa vào gan và thận để giải độc chuyển hóa."}, {"word": "Immunology", "pos": "Noun", "ipa": "/ˌɪmjʊˈnɒlədʒi/", "meaning": "Miễn dịch học", "example": "Immunology has paved the way for revolutionary immunotherapy treatments that harness the body's natural defenses to combat malignancies.", "vn_ex": "Miễn dịch học đã mở đường cho các phương pháp điều trị bằng liệu pháp miễn dịch mang tính cách mạng nhằm khai thác các hàng rào phòng thủ tự nhiên của cơ thể để chống lại các khối u ác tính."}, {"word": "Pharmacology", "pos": "Noun", "ipa": "/ˌfɑːməˈkɒlədʒi/", "meaning": "Dược lý học", "example": "Understanding pharmacology is essential for healthcare professionals to predict drug interactions and formulate precise therapeutic dosages.", "vn_ex": "Hiểu rõ dược lý học là điều cần thiết đối với các chuyên gia y tế để dự đoán các tương tác thuốc và công thức hóa các liều lượng điều trị chính xác."}, {"word": "Obesity", "pos": "Noun", "ipa": "/əʊˈbiːsɪti/", "meaning": "Béo phì", "example": "Epidemiological data links childhood obesity to an elevated risk of developing type 2 diabetes and hypertension in later life.", "vn_ex": "Dữ liệu dịch tễ học liên kết tình trạng béo phì ở trẻ em với nguy cơ gia tăng phát triển bệnh tiểu đường tuýp 2 và cao huyết áp trong cuộc sống sau này."}, {"word": "Cholesterol", "pos": "Noun", "ipa": "/kəˈlɛstərɒl/", "meaning": "Cholesterol", "example": "Elevated levels of low-density lipoprotein cholesterol are widely documented as a primary risk factor for atherosclerosis.", "vn_ex": "Mức cholesterol lipoprotein tỷ trọng thấp tăng cao được tài liệu hóa rộng rãi như là một yếu tố nguy cơ chính đối với bệnh xơ vữa động mạch."}, {"word": "Antioxidants", "pos": "Noun", "ipa": "/ˌæntiˈɒksɪdənts/", "meaning": "Chất chống oxy hóa", "example": "Antioxidants neutralize free radicals, thereby mitigating oxidative stress and reducing the risk of chronic cellular degradation.", "vn_ex": "Các chất chống oxy hóa vô hiệu hóa các gốc tự do, từ đó giảm thiểu căng thẳng oxy hóa và giảm nguy cơ thoái hóa tế bào mãn tính."}, {"word": "Metabolism", "pos": "Noun", "ipa": "/mɪˈtæbəlɪzəm/", "meaning": "Chuyển hóa", "example": "Thyroid hormones exert a profound influence on basal metabolism, regulating the rate at which the body expends energy.", "vn_ex": "Các hormone tuyến giáp có ảnh hưởng sâu sắc đến sự chuyển hóa cơ bản, điều hòa tốc độ tiêu hao năng lượng của cơ thể."}, {"word": "Calorie", "pos": "Noun", "ipa": "/ˈkæləri/", "meaning": "Lượng calo", "example": "Accurate calorie expenditure estimation is crucial when designing dietary regimens for athletes undergoing rigorous physical conditioning.", "vn_ex": "Việc ước tính chính xác lượng calo tiêu thụ là rất quan trọng khi thiết kế các chế độ ăn uống cho các vận động viên đang trải qua quá trình rèn luyện thể chất nghiêm ngặt."}, {"word": "Biotechnology", "pos": "Noun", "ipa": "/ˌbaɪəʊtɛkˈnɒlədʒi/", "meaning": "Công nghệ sinh học", "example": "The field of biotechnology has enabled the synthesis of recombinant proteins that are highly effective in targeted therapies.", "vn_ex": "Lĩnh vực công nghệ sinh học đã cho phép tổng hợp các protein tái tổ hợp có hiệu quả cao trong các liệu pháp nhắm mục tiêu."}, {"word": "Genome", "pos": "Noun", "ipa": "/ˈdʒiːnəʊm/", "meaning": "Hệ gen", "example": "Sequencing the human genome has unveiled critical genetic mutations associated with hereditary predisposition to certain cancers.", "vn_ex": "Việc lập bản đồ hệ gen người đã hé lộ những đột biến di truyền quan trọng liên quan đến xu hướng di truyền đối với một số bệnh ung thư nhất định."}, {"word": "Cloning", "pos": "Noun", "ipa": "/ˈkləʊnɪŋ/", "meaning": "Nhân bản", "example": "Somatic cell nuclear transfer remains the primary technique utilized in reproductive cloning research.", "vn_ex": "Chuyển nhân tế bào sinh dưỡng vẫn là kỹ thuật chính được sử dụng trong nghiên cứu nhân bản vô tính sinh sản."}, {"word": "Genetic Engineering", "pos": "Noun", "ipa": "/dʒɪˈnɛtɪk ˌɛndʒɪˈnɪərɪŋ/", "meaning": "Kỹ thuật di truyền", "example": "Genetic engineering enables agricultural scientists to cultivate transgenic crops with enhanced resistance to environmental pathogens.", "vn_ex": "Kỹ thuật di truyền cho phép các nhà khoa học nông nghiệp trồng các loại cây trồng biến đổi gen có khả năng chống chịu nâng cao đối với các mầm bệnh môi trường."}, {"word": "Neuroscience", "pos": "Noun", "ipa": "/ˈnjʊəroʊˌsaɪəns/", "meaning": "Khoa học thần kinh", "example": "Recent breakthroughs in neuroscience have illuminated the synaptic mechanisms underlying memory formation and cognitive decline.", "vn_ex": "Những đột phá gần đây trong khoa học thần kinh đã làm sáng tỏ các cơ chế synap là nền tảng của sự hình thành trí nhớ và sự suy giảm nhận thức."}, {"word": "Neurotransmitter", "pos": "Noun", "ipa": "/ˈnjʊərəʊtrænsˌmɪtə/", "meaning": "Chất truyền dẫn thần kinh", "example": "Serotonin is a vital neurotransmitter that modulates mood, appetite, and sleep architecture within the central nervous system.", "vn_ex": "Serotonin là một chất truyền dẫn thần kinh quan trọng giúp điều chỉnh tâm trạng, sự thèm ăn và cấu trúc giấc ngủ bên trong hệ thần kinh trung ương."}, {"word": "Neurosis", "pos": "Noun", "ipa": "/njʊəˈrəʊsɪs/", "meaning": "Rối loạn thần kinh", "example": "Historically, neurosis was categorized as a functional mental disorder characterized by chronic distress without cognitive detachment from reality.", "vn_ex": "Về mặt lịch sử, rối loạn thần kinh được phân loại là một rối loạn tâm thần chức năng đặc trưng bởi sự đau khổ mãn tính mà không có sự tách rời nhận thức khỏi thực tế."}, {"word": "Biodiversity", "pos": "Noun", "ipa": "/ˌbaɪəʊdaɪˈvɜːsɪti/", "meaning": "Đa dạng sinh học", "example": "Anthropogenic activities have severely compromised regional biodiversity, precipitating the collapse of fragile ecological food webs.", "vn_ex": "Các hoạt động nhân tạo đã làm tổn hại nghiêm trọng đến đa dạng sinh học khu vực, đẩy nhanh sự sụp đổ của các lưới thức ăn sinh thái mỏng manh."}, {"word": "Ecosystem", "pos": "Noun", "ipa": "/ˈiːkəʊˌsɪstəm/", "meaning": "Hệ sinh thái", "example": "The bioaccumulation of heavy metals within a marine ecosystem poses a severe threat to trophic levels across the food chain.", "vn_ex": "Sự tích lũy sinh học của các kim loại nặng bên trong một hệ sinh thái biển gây ra mối đe dọa nghiêm trọng đối với các cấp độ dinh dưỡng trong suốt chuỗi thức ăn."}, {"word": "Ecology", "pos": "Noun", "ipa": "/ɪˈkɒlədʒi/", "meaning": "Sinh thái học", "example": "Theoretical ecology utilizes mathematical modeling to simulate population dynamics and resource competition in biological communities.", "vn_ex": "Sinh thái học lý thuyết sử dụng mô hình toán học để mô phỏng động lực học quần thể và sự cạnh tranh nguồn lực trong các cộng đồng sinh học."}, {"word": "Habitat", "pos": "Noun", "ipa": "/ˈhæbɪtæt/", "meaning": "Môi trường sống", "example": "Deforestation and urbanization result in habitat fragmentation, which isolates wildlife populations and accelerates genetic drift.", "vn_ex": "Phá rừng và đô thị hóa dẫn đến sự phân mảnh môi trường sống, làm cô lập các quần thể động vật hoang dã và đẩy nhanh sự trôi dạt di truyền."}], "grammar_theory": "# Cấu trúc Giả định Tương lai trong Sinh học\n## Công thức và Cách dùng\nCấu trúc `Were it to happen...` được sử dụng để diễn tả một tình huống giả định trong tương lai, thường liên quan đến các sự kiện hoặc tình huống không chắc chắn. Công thức của cấu trúc này là: `Were + chủ ngữ + to + động từ`, thường được sử dụng trong các câu điều kiện loại III.\n\nVí dụ: `Were it to rain tomorrow, the crops would be saved.` - Nếu như trời mưa vào ngày mai, mùa màng sẽ được cứu.\n\n## Sử dụng trong Ngữ cảnh Học thuật và Giao tiếp Nâng cao\nCấu trúc này thường được sử dụng trong các bài viết, thảo luận về các chủ đề khoa học, đặc biệt là sinh học và y học, để đề cập đến các tình huống giả định hoặc các kết quả có thể xảy ra từ một sự kiện cụ thể.\n\nVí dụ: `Were the new species to be discovered, it would significantly impact our understanding of evolution.` - Nếu như loài mới được phát hiện, nó sẽ có tác động đáng kể đến sự hiểu biết của chúng ta về tiến hóa.", "quiz": [{"question": "If ___ to happen, the consequences would be severe.", "options": ["it were", "it was", "it is", "it will be"], "answer": 0, "explanation": "Chọn đáp án 'it were' vì cấu trúc 'Were it to happen' được sử dụng để diễn tả một tình huống giả định trong tương lai. Câu dịch nghĩa: 'Nếu như nó xảy ra, hậu quả sẽ rất nghiêm trọng.'"}, {"question": "The ecosystem ___ to collapse if the pollution continues.", "options": ["were to", "is to", "will", "would"], "answer": 0, "explanation": "Chọn đáp án 'were to' vì nó phù hợp với cấu trúc giả định tương lai. Câu dịch nghĩa: 'Hệ sinh thái sẽ sụp đổ nếu như ô nhiễm tiếp tục.'"}, {"question": "Were the vaccine ___ to be available, many lives would be saved.", "options": ["to", "be", "being", "been"], "answer": 0, "explanation": "Chọn đáp án 'to' vì nó hoàn thành cấu trúc 'Were it to happen'. Câu dịch nghĩa: 'Nếu như vắc-xin được có sẵn, nhiều sinh mạng sẽ được cứu.'"}, {"question": "The scientist warned that if the virus ___ to mutate, it could become highly contagious.", "options": ["were", "was", "is", "will be"], "answer": 0, "explanation": "Chọn đáp án 'were' vì nó phù hợp với cấu trúc giả định. Câu dịch nghĩa: 'Nhà khoa học cảnh báo rằng nếu như virus đột biến, nó có thể trở nên rất dễ lây lan.'"}, {"question": "Were the climate change ___ to continue, polar bears would face extinction.", "options": ["to", "being", "been", "be"], "answer": 0, "explanation": "Chọn đáp án 'to' vì nó phù hợp với cấu trúc 'Were it to happen'. Câu dịch nghĩa: 'Nếu như biến đổi khí hậu tiếp tục, gấu Bắc Cực sẽ đối mặt với tuyệt chủng.'"}]}, "Advanced Unit 6: Economics & Finance": {"vocab": [{"word": "inflation", "pos": "noun", "ipa": "/ɪnˈfleɪʃən/", "meaning": "lạm phát", "example": "Persistent high inflation can erode consumers' purchasing power and distort economic decision-making.", "vn_ex": "Lạm phát cao kéo dài có thể làm xói mòn sức mua của người tiêu dùng và làm bóp méo việc ra các quyết định kinh tế."}, {"word": "equity", "pos": "noun", "ipa": "/ˈɛkwɪti/", "meaning": "vốn chủ sở hữu", "example": "The firm's capital structure is heavily reliant on equity rather than debt financing to minimize bankruptcy risks.", "vn_ex": "Cấu trúc vốn của công ty phụ thuộc nhiều vào vốn chủ sở hữu hơn là tài trợ bằng nợ để giảm thiểu rủi ro phá sản."}, {"word": "fiscal policy", "pos": "noun", "ipa": "/ˈfɪskəl ˈpɒlɪsi/", "meaning": "chính sách tài chính", "example": "Governments often implement expansionary fiscal policy to stimulate economic growth during periods of prolonged recession.", "vn_ex": "Các chính phủ thường thực thi chính sách tài khóa mở rộng để kích thích tăng trưởng kinh tế trong các giai đoạn suy thoái kéo dài."}, {"word": "asset management", "pos": "noun", "ipa": "/ˈæset ˈmænɪdʒmənt/", "meaning": "quản lý tài sản", "example": "Professional asset management firms employ sophisticated algorithms to optimize portfolio yields while mitigating systemic market risks.", "vn_ex": "Các công ty quản lý tài sản chuyên nghiệp sử dụng các thuật toán phức tạp để tối ưu hóa lợi suất danh mục đầu tư đồng thời giảm thiểu các rủi ro thị trường có tính hệ thống."}, {"word": "capital", "pos": "noun", "ipa": "/ˈkæpɪtl/", "meaning": "vốn", "example": "Access to venture capital is crucial for technology startups aiming to scale up their operations in highly competitive markets.", "vn_ex": "Việc tiếp cận nguồn vốn mạo hiểm là vô cùng quan trọng đối với các doanh nghiệp khởi nghiệp công nghệ nhằm mở rộng quy mô hoạt động trong các thị trường cạnh tranh khốc liệt."}, {"word": "recession", "pos": "noun", "ipa": "/rɪˈsɛʃən/", "meaning": "suy thoái kinh tế", "example": "Economists argue that a technical recession is defined by two consecutive quarters of negative gross domestic product growth.", "vn_ex": "Các nhà kinh tế học cho rằng suy thoái kinh tế kỹ thuật được xác định bởi hai quý liên tiếp có mức tăng trưởng tổng sản phẩm quốc nội âm."}, {"word": "supply chain", "pos": "noun", "ipa": "/səˈplaɪ ˈʧeɪn/", "meaning": "chuỗi cung ứng", "example": "Modern multinational corporations must build resilient supply chains to withstand unexpected geopolitical disruptions.", "vn_ex": "Các tập đoàn đa quốc gia hiện đại phải xây dựng các chuỗi cung ứng có khả năng chống chịu cao để chống đỡ những gián đoạn địa chính trị bất ngờ."}, {"word": "liquidity", "pos": "noun", "ipa": "/lɪˈkwɪdəti/", "meaning": "tính thanh khoản", "example": "During financial crises, central banks act as lenders of last resort to inject liquidity into the banking sector.", "vn_ex": "Trong suốt các cuộc khủng hoảng tài chính, các ngân hàng trung ương đóng vai trò là người cho vay cứu cánh cuối cùng để bơm thanh khoản vào khu vực ngân hàng."}, {"word": "bonds", "pos": "noun", "ipa": "/bɒndz/", "meaning": "trái phiếu", "example": "Sovereign bonds are typically considered low-risk investments, though their yields may fail to outpace inflation.", "vn_ex": "Trái phiếu chính phủ thường được coi là các khoản đầu tư rủi ro thấp, mặc dù lợi suất của chúng có thể không vượt qua được lạm phát."}, {"word": "IPO", "pos": "noun", "ipa": "/ˌaɪ piː ˈəʊ/", "meaning": "chào bán cổ phiếu lần đầu ra công chúng", "example": "A successful IPO not only raises substantial capital but also enhances the corporate reputation of the newly public entity.", "vn_ex": "Một đợt chào bán cổ phiếu lần đầu ra công chúng thành công không chỉ huy động được lượng vốn lớn mà còn nâng cao uy tín doanh nghiệp của thực thể mới niêm yết."}, {"word": "dividend", "pos": "noun", "ipa": "/ˈdɪvɪdɛnd/", "meaning": "cổ tức", "example": "Income-oriented investors favor mature corporations that consistently distribute high dividends to their shareholders.", "vn_ex": "Các nhà đầu tư hướng đến thu nhập thường ưa thích các tập đoàn đã trưởng thành liên tục chi trả cổ tức cao cho các cổ đông của họ."}, {"word": "profit margin", "pos": "noun", "ipa": "/ˈprɒfɪt ˈmɑːdʒɪn/", "meaning": "biên lợi nhuận", "example": "The company managed to widen its net profit margin by adopting automated manufacturing processes and reducing overhead costs.", "vn_ex": "Công ty đã nâng cao được biên lợi nhuận ròng của mình bằng cách áp dụng các quy trình sản xuất tự động và cắt giảm chi phí gián tiếp."}, {"word": "Return on Investment (ROI)", "pos": "noun", "ipa": "/rɪˈtɜːn ɒn ɪnˈvɛstmənt/", "meaning": "lợi tức đầu tư", "example": "Evaluating the prospective return on investment is a fundamental step before committing capital to any large-scale infrastructure project.", "vn_ex": "Đánh giá tỷ suất hoàn vốn tiềm năng là một bước đi căn bản trước khi cam kết rót vốn vào bất kỳ dự án cơ sở hạ tầng quy mô lớn nào."}, {"word": "market capitalization", "pos": "noun", "ipa": "/ˈmɑːrkɪt ˌkæpɪtəlaɪˈzeɪʃən/", "meaning": "vốn hóa thị trường", "example": "The tech giant surpassed its competitors, reaching a record-breaking market capitalization of over three trillion dollars.", "vn_ex": "Gã khổng lồ công nghệ đã vượt qua các đối thủ cạnh tranh để đạt mức vốn hóa thị trường kỷ lục hơn ba nghìn tỷ đô la."}, {"word": "entrepreneur", "pos": "noun", "ipa": "/ˌɒntrəprəˈnɜːr/", "meaning": "doanh nhân", "example": "Innovative entrepreneurs drive economic dynamism by introducing disruptive business models that challenge established monopolies.", "vn_ex": "Các doanh nhân đổi mới sáng tạo thúc đẩy động lực kinh tế bằng cách đưa vào các mô hình kinh doanh mang tính đột phá nhằm thách thức các thế độc quyền đã được thiết lập."}, {"word": "freelancer", "pos": "noun", "ipa": "/ˈfriːˌlænsər/", "meaning": "người làm việc tự do", "example": "The rise of the gig economy has enabled highly skilled freelancers to offer specialized consulting services globally.", "vn_ex": "Sự trỗi dậy của nền kinh tế tự do đã cho phép những người làm việc tự do có trình độ cao cung cấp các dịch vụ tư vấn chuyên sâu trên phạm vi toàn cầu."}, {"word": "contractor", "pos": "noun", "ipa": "/ˈkɒntræktə/", "meaning": "nhà thầu", "example": "Independent contractors are utilized by organizations to execute specialized projects without increasing long-term payroll liabilities.", "vn_ex": "Các nhà thầu độc lập được các tổ chức sử dụng để thực hiện các dự án chuyên biệt mà không làm tăng nghĩa vụ quỹ lương dài hạn."}, {"word": "salary", "pos": "noun", "ipa": "/ˈsæləri/", "meaning": "lương", "example": "To attract top-tier talent, corporations must offer competitive salaries paired with comprehensive performance incentives.", "vn_ex": "Để thu hút nhân tài hàng đầu, các tập đoàn phải đưa ra mức lương cạnh tranh đi kèm với các khoản đãi ngộ hiệu suất toàn diện."}, {"word": "benefits", "pos": "noun", "ipa": "/ˈbɛnɪfɪts/", "meaning": "phúc lợi", "example": "A robust employee benefits package, including health insurance and retirement plans, significantly enhances worker retention rates.", "vn_ex": "Một gói phúc lợi nhân viên vững chắc, bao gồm bảo hiểm y tế và kế hoạch hưu trí, giúp nâng cao đáng kể tỷ lệ giữ chân người lao động."}, {"word": "retirement plan", "pos": "noun", "ipa": "/rɪˈtaɪəmənt plæn/", "meaning": "kế hoạch nghỉ hưu", "example": "An effective retirement plan ensures long-term financial security through systematic and diversified wealth accumulation.", "vn_ex": "Một kế hoạch hưu trí hiệu quả đảm bảo an ninh tài chính dài hạn thông qua việc tích lũy tài sản có hệ thống và đa dạng hóa."}, {"word": "negotiate", "pos": "verb", "ipa": "/nɪˈgəʊʃieɪt/", "meaning": "đàm phán", "example": "The diplomatic mission worked diligently to negotiate a bilateral trade agreement aimed at eliminating tariff barriers.", "vn_ex": "Phái đoàn ngoại giao đã làm việc siêng năng để đàm phán một thỏa thuận thương mại song phương nhằm loại bỏ các rào cản thuế quan."}, {"word": "blockchain", "pos": "noun", "ipa": "/ˈblɒktʃeɪn/", "meaning": "công nghệ chuỗi khối", "example": "Blockchain technology has the potential to revolutionize financial systems by offering decentralized, transparent, and secure transaction records.", "vn_ex": "Công nghệ chuỗi khối có tiềm năng cách mạng hóa hệ thống tài chính bằng cách cung cấp các hồ sơ giao dịch phi tập trung, minh bạch và an toàn."}, {"word": "bilateral", "pos": "adjective", "ipa": "/baɪˈlætərəl/", "meaning": "song phương / hai bên", "example": "The bilateral treaty was signed to bolster economic cooperation and lower import tariffs between the two neighboring states.", "vn_ex": "Hiệp ước song phương đã được ký kết nhằm thúc đẩy hợp tác kinh tế và giảm thuế nhập khẩu giữa hai quốc gia láng giềng."
