}, {"word": "accumulate", "pos": "verb", "ipa": "/əˈkjuːmjʊleɪt/", "meaning": "tích lũy", "example": "Central banks consistently accumulate gold reserves as a strategic hedge against currency devaluation and global market instability.", "vn_ex": "Các ngân hàng trung ương liên tục tích lũy dự trữ vàng như một biện pháp phòng ngừa chiến lược chống lại sự mất giá của tiền tệ và sự bất ổn của thị trường toàn cầu."}, {"word": "corruption", "pos": "noun", "ipa": "/kəˈrʌpʃən/", "meaning": "tham nhũng", "example": "Systemic corruption inside the financial regulatory bodies severely undermines investor confidence and stalls sustainable development.", "vn_ex": "Tham nhũng có hệ thống bên trong các cơ quan quản lý tài chính làm suy giảm nghiêm trọng niềm tin của nhà đầu tư và làm trì trệ sự phát triển bền vững."}], "grammar_theory": "# Double Comparatives with Academic Adverbs\n## Công thức cấu trúc\n- The + `sooner`/`more`/`less` + `Subject` + `Verb`, `the` + `sooner`/`more`/`less` + `Subject` + `Verb`\n## Cách dùng thực tế\n- Trong ngữ cảnh học thuật/giao tiếp nâng cao, đặc biệt là khi nói về kinh tế và tài chính, chúng ta thường sử dụng cấu trúc so sánh kép để mô tả sự thay đổi hoặc tương quan giữa các yếu tố.\n## Ví dụ\n- The more exponentially the economy grows, the more likely it is to attract foreign investment. (Càng tăng trưởng kinh tế theo cấp số nhân, càng có khả năng thu hút đầu tư nước ngoài.)", "quiz": [{"question": "The more ___ the company invests in research and development, the more likely it is to innovate and stay ahead of the competition.", "options": ["exponentially", "quickly", "slowly", "carefully"], "answer": 0, "explanation": "Chọn 'exponentially' vì nó chỉ sự tăng trưởng nhanh chóng và theo cấp số nhân, phù hợp với ngữ cảnh đầu tư vào nghiên cứu và phát triển để đổi mới và dẫn đầu cạnh tranh. Câu dịch: Càng đầu tư nhiều vào nghiên cứu và phát triển, công ty càng có khả năng đổi mới và dẫn đầu cạnh tranh."}, {"question": "The ___ the interest rates rise, the less likely people are to borrow money to buy houses.", "options": ["more exponentially", "more quickly", "less slowly", "faster"], "answer": 0, "explanation": "Chọn 'more exponentially' vì nó chỉ sự tăng trưởng nhanh chóng và theo cấp số nhân của lãi suất, làm giảm khả năng người dân vay tiền để mua nhà. Câu dịch: Càng tăng lãi suất theo cấp số nhân, người dân càng ít có khả năng vay tiền để mua nhà."}, {"question": "The more ___ the government regulates the market, the less competitive it becomes.", "options": ["heavily", "lightly", "exponentially", "slowly"], "answer": 0, "explanation": "Chọn 'heavily' vì nó chỉ sự kiểm soát mạnh mẽ của chính phủ đối với thị trường, làm giảm tính cạnh tranh. Câu dịch: Càng kiểm soát thị trường mạnh mẽ, thị trường càng ít cạnh tranh."}, {"question": "The ___ the company expands globally, the more it needs to adapt to different cultural and economic environments.", "options": ["more quickly", "more exponentially", "less slowly", "faster"], "answer": 1, "explanation": "Chọn 'more exponentially' vì nó chỉ sự mở rộng nhanh chóng và theo cấp số nhân của công ty trên toàn cầu, đòi hỏi phải thích nghi với các môi trường văn hóa và kinh tế khác nhau. Câu dịch: Càng mở rộng toàn cầu theo cấp số nhân, công ty càng cần phải thích nghi với các môi trường văn hóa và kinh tế khác nhau."}, {"question": "The more ___ the economy grows, the more pressure it puts on the environment.", "options": ["exponentially", "quickly", "slowly", "steadily"], "answer": 0, "explanation": "Chọn 'exponentially' vì nó chỉ sự tăng trưởng nhanh chóng và theo cấp số nhân của kinh tế, gây áp lực lên môi trường. Câu dịch: Càng tăng trưởng kinh tế theo cấp số nhân, càng gây áp lực lên môi trường."}]}, "Advanced Unit 7: Environment & Ecology": {"vocab": [{"word": "Sustainability", "pos": "Noun", "ipa": "/səˌsteɪnəˈbɪləti/", "meaning": "Sự bền vững", "example": "Achieving long-term ecological sustainability requires a fundamental shift in global industrial practices and consumption patterns.", "vn_ex": "Đạt được sự bền vững sinh thái lâu dài đòi hỏi một sự chuyển dịch căn bản trong các hoạt động công nghiệp và mô hình tiêu dùng toàn cầu."}, {"word": "Conservation", "pos": "Noun", "ipa": "/ˌbɒnsəˈveɪʃən/", "meaning": "Bảo tồn", "example": "Modern conservation methodologies increasingly integrate indigenous knowledge with advanced geographic information systems to protect threatened biomes.", "vn_ex": "Các phương pháp bảo tồn hiện đại ngày càng tích hợp kiến thức bản địa với hệ thống thông tin địa lý tiên tiến để bảo vệ các sinh cảnh bị đe dọa."}, {"word": "Deforestation", "pos": "Noun", "ipa": "/ˌdiːfɒrɪˈsteɪʃən/", "meaning": "Phá rừng", "example": "Rapid deforestation in tropical regions not only accelerates carbon emissions but also causes irreversible loss of critical habitats.", "vn_ex": "Nạn phá rừng nhanh chóng ở các vùng nhiệt đới không chỉ đẩy nhanh lượng phát thải carbon mà còn gây ra sự mất mát không thể đảo ngược của các môi trường sống quan trọng."}, {"word": "Biodiversity", "pos": "Noun", "ipa": "/ˌbaɪəʊdaɪˈvɜːsɪti/", "meaning": "Đa dạng sinh học", "example": "The preservation of biodiversity is crucial for maintaining ecosystem resilience against anthropogenic climate disruptions.", "vn_ex": "Việc bảo tồn đa dạng sinh học là tối quan trọng để duy trì khả năng phục hồi của hệ sinh thái trước những sự tàn phá khí hậu do con người gây ra."}, {"word": "Carbon Footprint", "pos": "Noun phrase", "ipa": "/ˈkɑːbən ˈfʊtprɪnt/", "meaning": "Dấu chân carbon", "example": "Multinational corporations are under growing regulatory pressure to systematically calculate and reduce their institutional carbon footprint.", "vn_ex": "Các tập đoàn đa quốc gia đang chịu áp lực pháp lý ngày càng lớn trong việc tính toán và giảm thiểu dấu chân carbon của tổ chức một cách có hệ thống."}, {"word": "Renewable Energy", "pos": "Noun phrase", "ipa": "/rɪˈnjuːəbl ˈɛnədʒi/", "meaning": "Năng lượng tái tạo", "example": "Transitioning to renewable energy infrastructures is the cornerstone of global decarbonization pathways aimed at limiting temperature rise.", "vn_ex": "Chuyển dịch sang các cơ sở hạ tầng năng lượng tái tạo là nền tảng của các lộ trình khử carbon toàn cầu nhằm hạn chế sự gia tăng nhiệt độ."}, {"word": "Ecosystem", "pos": "Noun", "ipa": "/ˈiːkəʊˌsɪstəm/", "meaning": "Hệ sinh thái", "example": "Any minor perturbation in the food web can trigger a cascade of destabilizing effects throughout the entire aquatic ecosystem.", "vn_ex": "Bất kỳ sự gián đoạn nhỏ nào trong mạng lưới thức ăn đều có thể kích hoạt một chuỗi các tác động gây mất ổn định trong toàn bộ hệ sinh thái dưới nước."}, {"word": "Pollution", "pos": "Noun", "ipa": "/pəˈluːʃən/", "meaning": "Ô nhiễm", "example": "Anthropogenic chemical pollution has severely compromised marine water quality, leading to extensive eutrophication in coastal zones.", "vn_ex": "Ô nhiễm hóa chất do con người gây ra đã làm suy giảm nghiêm trọng chất lượng nước biển, dẫn đến tình trạng phú dưỡng trên diện rộng ở các vùng ven biển."}, {"word": "Climate Change", "pos": "Noun phrase", "ipa": "/ˈklaɪmət ʧeɪndʒ/", "meaning": "Biến đổi khí hậu", "example": "Empirical evidence demonstrates that accelerated climate change is significantly altering precipitation cycles and intensifying extreme weather events.", "vn_ex": "Bằng chứng thực nghiệm chứng minh rằng biến đổi khí hậu gia tốc đang thay đổi đáng kể chu kỳ lượng mưa và làm gia tăng các hiện tượng thời tiết cực đoan."}, {"word": "Habitat", "pos": "Noun", "ipa": "/ˈhæbɪtæt/", "meaning": "Môi trường sống", "example": "Urban encroachment continues to fragment wildlife corridors, leaving endemic species with insufficient natural habitat to sustain viable populations.", "vn_ex": "Sự xâm lấn của đô thị tiếp tục làm phân mảnh các hành lang động vật hoang dã, khiến các loài đặc hữu không có đủ môi trường sống tự nhiên để duy trì các quần thể khả thi."}, {"word": "Sustainable Development", "pos": "Noun phrase", "ipa": "/səˈsteɪnəbl dɪˈvɛləpmənt/", "meaning": "Phát triển bền vững", "example": "Sustainable development policies must strike an equitable balance between macroeconomic growth and environmental preservation.", "vn_ex": "Các chính sách phát triển bền vững phải tạo ra một sự cân bằng công bằng giữa tăng trưởng kinh tế vĩ mô và bảo tồn môi trường."}, {"word": "Endangered Species", "pos": "Noun phrase", "ipa": "/ɪnˈdeɪndʒəd ˈspiːʃiːz/", "meaning": "Các loài có nguy cơ tuyệt chủng", "example": "Urgent legislative measures and habitat restoration are imperative to save these endangered species from the brink of extinction.", "vn_ex": "Các biện pháp luật pháp khẩn cấp và phục hồi môi trường sống là bắt buộc để cứu các loài có nguy cơ tuyệt chủng này khỏi bờ vực tuyệt chủng."}, {"word": "Pollutant", "pos": "Noun", "ipa": "/pəˈluːtənt/", "meaning": "Chất ô nhiễm", "example": "Heavy metals act as persistent organic pollutants that bioaccumulate in trophic levels, posing severe neurological risks to apex predators.", "vn_ex": "Kim loại nặng hoạt động như các chất ô nhiễm hữu cơ khó phân hủy, tích lũy sinh học trong các cấp độ dinh dưỡng, gây ra rủi ro nghiêm trọng về thần kinh cho các loài săn mồi đầu bảng."}, {"word": "Greenhouse Gases", "pos": "Noun phrase", "ipa": "/ˈɡriːnhaʊs ˈɡæsɪz/", "meaning": "Khí nhà kính", "example": "The anthropogenic emission of greenhouse gases continues to trap infrared radiation within the troposphere, driving global thermal anomalies.", "vn_ex": "Việc phát thải khí nhà kính do con người tiếp tục giữ bức xạ hồng ngoại trong tầng đối lưu, dẫn đến các dị thường nhiệt toàn cầu."}, {"word": "Desertification", "pos": "Noun", "ipa": "/dɪˌzɜːtɪfɪˈkeɪʃən/", "meaning": "Sa mạc hóa", "example": "Overgrazing combined with prolonged droughts has dramatically accelerated soil erosion and subsequent desertification in arid regions.", "vn_ex": "Chăn thả quá mức kết hợp với hạn hán kéo dài đã đẩy nhanh đáng kể sự xói mòn đất và quá trình sa mạc hóa tiếp theo ở các vùng khô hạn."}, {"word": "Ecotourism", "pos": "Noun", "ipa": "/ˈiːkəʊˌtʊərɪzəm/", "meaning": "Du lịch sinh thái", "example": "If managed responsibly, ecotourism can generate vital revenue for local communities while fostering environmental stewardship.", "vn_ex": "Nếu được quản lý một cách có trách nhiệm, du lịch sinh thái có thể tạo ra doanh thu quan trọng cho cộng đồng địa phương đồng thời thúc đẩy vai trò quản lý môi trường."}, {"word": "Wilderness", "pos": "Noun", "ipa": "/ˈwɪldənəs/", "meaning": "Hoang dã", "example": "Preserving expansive tracts of pristine wilderness is essential for the survival of large carnivores requiring vast territories.", "vn_ex": "Việc bảo tồn các dải đất hoang dã hoang sơ trải rộng là điều cần thiết cho sự sinh tồn của các loài động vật ăn thịt lớn đòi hỏi lãnh thổ rộng lớn."}, {"word": "Ecology", "pos": "Noun", "ipa": "/usr/bin/ipa", "meaning": "Sinh thái học", "example": "Evolutionary ecology examines how ecological interactions shape natural selection and species adaptation over generational timescales.", "vn_ex": "Sinh thái học tiến hóa nghiên cứu cách các tương tác sinh thái định hình sự chọn lọc tự nhiên và sự thích nghi của loài theo thang thời gian thế hệ."}, {"word": "Glacier", "pos": "Noun", "ipa": "/ˈɡleɪʃər/", "meaning": "Sông băng", "example": "The rapid retreat of alpine glaciers serves as an unambiguous indicator of rising global atmospheric temperatures.", "vn_ex": "Sự rút lui nhanh chóng của các sông băng vùng cao hoạt động như một chỉ báo rõ ràng về nhiệt độ khí quyển toàn cầu đang tăng lên."}, {"word": "Savanna", "pos": "Noun", "ipa": "/səˈvænə/", "meaning": "Đồng cỏ", "example": "The savanna ecosystem is characterized by a delicate coexistence of continuous grass layers and scattered woody canopies.", "vn_ex": "Hệ sinh thái đồng cỏ nhiệt đới được đặc trưng bởi sự chung sống mong manh của các lớp cỏ liên tục và các tán cây thân gỗ rải rác."}, {"word": "Mitigate", "pos": "Verb", "ipa": "/ˈmɪtɪɡeɪt/", "meaning": "Giảm nhẹ, giảm thiểu", "example": "Afforestation programs are extensively implemented to mitigate the adverse impacts of industrial atmospheric carbon accumulation.", "vn_ex": "Các chương trình trồng rừng được thực hiện rộng rãi để giảm thiểu những tác động bất lợi của sự tích tụ carbon trong khí quyển công nghiệp."}, {"word": "Mitigation", "pos": "Noun", "ipa": "/ˌmɪtɪˈɡeɪʃən/", "meaning": "Sự giảm nhẹ, giảm thiểu", "example": "Proactive climate change mitigation strategies must include both aggressive emission reductions and active carbon sequestration.", "vn_ex": "Các chiến lược giảm thiểu biến đổi khí hậu chủ động phải bao gồm cả việc cắt giảm khí thải mạnh mẽ và cô lập carbon tích cực."}, {"word": "Resilience", "pos": "Noun", "ipa": "/rɪˈzɪliəns/", "meaning": "Khả năng phục hồi", "example": "Enhancing the ecological resilience of wetlands is paramount to safeguarding coastal areas from storm surges and rising sea levels.", "vn_ex": "Nâng cao khả năng phục hồi sinh thái của các vùng đất ngập nước là tối quan trọng để bảo vệ các vùng ven biển khỏi nước dâng do bão và mực nước biển dâng cao."}, {"word": "Ecological", "pos": "Adjective", "ipa": "/ˌiːbəˈlɒdʒɪkəl/", "meaning": "Thuộc về sinh thái", "example": "Anthropogenic habitat fragmentation poses a severe ecological threat by disrupting natural gene flow among isolated populations.", "vn_ex": "Sự phân mảnh môi trường sống do con người gây ra đặt ra một mối đe dọa sinh thái nghiêm trọng bằng cách làm gián đoạn dòng gen tự nhiên giữa các quần thể bị cô lập."}, {"word": "Biophilia", "pos": "Noun", "ipa": "/ˌbaɪoʊˈfɪliə/", "meaning": "Tình yêu thiên nhiên, sự gắn kết với sinh giới", "example": "The biophilia hypothesis asserts that humans possess an innate, evolutionary tendency to seek connections with nature and other life forms.", "vn_ex": "Giả thuyết ái kỷ sinh học khẳng định rằng con người sở hữu một khuynh hướng tiến hóa bẩm sinh là tìm kiếm các kết nối với tự nhiên và các dạng sống khác."}], "grammar_theory": "# Subjunctive Mood với Mandative Verbs trong Ecology\n## Công thức cấu trúc\n`It is + tính từ + that + chủ ngữ + động từ nguyên thể` \n<br>\n## Cách dùng thực tế\nĐược sử dụng để thể hiện sự cần thiết, quan trọng hoặc đề xuất trong ngữ cảnh học thuật và giao tiếp nâng cao, đặc biệt là trong lĩnh vực sinh thái học.\n<br>\n## Ví dụ\n- It is imperative that we `reduce` our carbon footprint to protect the environment. (Điều quan trọng là chúng ta phải giảm lượng khí thải carbon để bảo vệ môi trường.)\n- It is essential that the government `take` immediate action to address climate change. (Điều thiết yếu là chính phủ phải hành động ngay lập tức để giải quyết vấn đề biến đổi khí hậu.)", "quiz": [{"question": "It is _______ that we conserve water to ensure a sustainable future.", "options": ["necessary", "important", "imperative", "obligatory"], "answer": 2, "explanation": "Chọn đáp án 'imperative' vì nó thể hiện sự cần thiết và cấp thiết trong việc bảo tồn nước để đảm bảo tương lai bền vững. Câu dịch: 'Điều quan trọng là chúng ta phải bảo tồn nước để đảm bảo một tương lai bền vững.'"}, {"question": "The scientist suggested that it is _______ that we _______ our consumption of single-use plastics.", "options": ["important", "essential", "imperative", "vital"], "answer": 2, "explanation": "Chọn đáp án 'imperative' vì nó thể hiện sự cần thiết và cấp thiết trong việc giảm tiêu thụ nhựa sử dụng một lần. Câu dịch: 'Nhà khoa học đề xuất rằng điều quan trọng là chúng ta phải giảm tiêu thụ nhựa sử dụng một lần.'"}, {"question": "It is _______ that the company _______ its environmental impact by using renewable energy sources.", "options": ["necessary", "important", "imperative", "obligatory"], "answer": 2, "explanation": "Chọn đáp án 'imperative' vì nó thể hiện sự cần thiết và cấp thiết trong việc giảm tác động môi trường bằng cách sử dụng nguồn năng lượng tái tạo. Câu dịch: 'Điều quan trọng là công ty phải giảm tác động môi trường bằng cách sử dụng nguồn năng lượng tái tạo.'"}, {"question": "The government proposed that it is _______ that all new buildings _______ with solar panels to reduce carbon emissions.", "options": ["important", "essential", "imperative", "vital"], "answer": 2, "explanation": "Chọn đáp án 'imperative' vì nó thể hiện sự cần thiết và cấp thiết trong việc lắp đặt tấm pin mặt trời cho tất cả các tòa nhà mới để giảm lượng khí thải carbon. Câu dịch: 'Chính phủ đề xuất rằng điều quan trọng là tất cả các tòa nhà mới phải được lắp đặt với tấm pin mặt trời để giảm lượng khí thải carbon.'"}, {"question": "The environmental organization emphasized that it is _______ that we _______ our waste management practices to protect wildlife.", "options": ["necessary", "important", "imperative", "obligatory"], "answer": 2, "explanation": "Chọn đáp án 'imperative' vì nó thể hiện sự cần thiết và cấp thiết trong việc cải thiện thực hành quản lý chất thải để bảo vệ động vật hoang dã. Câu dịch: 'Tổ chức môi trường nhấn mạnh rằng điều quan trọng là chúng ta phải cải thiện thực hành quản lý chất thải để bảo vệ động vật hoang dã.'"}]}, "Advanced Unit 8: Sociology & Culture": {"vocab": [{"word": "Abstract", "pos": "adjective", "ipa": "/ˈæbstrækt/", "meaning": "Trừu tượng", "example": "Sociological theories often employ abstract concepts to explain the intricate dynamics of human interaction and cultural shifts within modern societies.", "vn_ex": "Các lý thuyết xã hội học thường sử dụng các khái niệm trừu tượng để giải thích động lực phức tạp của sự tương tác giữa con người và những sự chuyển dịch văn hóa trong các xã hội hiện đại."}, {"word": "Impressionistic", "pos": "adjective", "ipa": "/ɪmˌprɛʃəˈnɪstɪk/", "meaning": "Ấn tượng, mang tính cảm tính", "example": "Rather than relying on empirical statistical data, his initial sociological study offered an impressionistic view of urban community life.", "vn_ex": "Thay vì dựa trên dữ liệu thống kê thực nghiệm, nghiên cứu xã hội học ban đầu của ông đã đưa ra một góc nhìn mang tính cảm tính về đời sống cộng đồng đô thị."}, {"word": "Surrealism", "pos": "noun", "ipa": "/səˈrɪəlɪzəm/", "meaning": "Chủ nghĩa siêu thực", "example": "Surrealism emerged not only as an artistic movement but also as a profound cultural critique of post-war rationalism and societal norms.", "vn_ex": "Chủ nghĩa siêu thực xuất hiện không chỉ như một phong trào nghệ thuật mà còn là một lời phê bình văn hóa sâu sắc đối với chủ nghĩa duy lý và các chuẩn mực xã hội thời hậu chiến."}, {"word": "Allegory", "pos": "noun", "ipa": "/ˈæləɡɔːri/", "meaning": "Ẩn dụ, chuyện ngụ ngôn", "example": "The classical play serves as a political allegory, illustrating how cultural hegemonies manipulate collective consciousness to maintain power.", "vn_ex": "Vở kịch cổ điển đóng vai trò như một câu chuyện ẩn dụ chính trị, minh họa cách các thế lực bá quyền văn hóa thao túng ý thức tập thể để duy trì quyền lực."}, {"word": "Symbolism", "pos": "noun", "ipa": "/ˈsɪmbəlɪzəm/", "meaning": "Chủ nghĩa tượng trưng, hệ thống biểu tượng", "example": "Understanding the complex symbolism embedded in traditional rituals is essential for sociologists studying cultural preservation.", "vn_ex": "Hiểu được hệ thống biểu tượng phức tạp lồng ghép trong các nghi lễ truyền thống là điều thiết yếu đối với các nhà xã hội học đang nghiên cứu về việc bảo tồn văn hóa."}, {"word": "Renaissance", "pos": "noun", "ipa": "/ˈrɛnəˌsɑːns/", "meaning": "Thời kỳ phục hưng, sự phục hưng", "example": "The digital era has catalyzed a cultural renaissance, democratizing access to artistic production and redefining societal engagement.", "vn_ex": "Kỷ nguyên số đã thúc đẩy một sự phục hưng văn hóa, dân chủ hóa quyền tiếp cận các sản phẩm nghệ thuật và định nghĩa lại sự tham gia của xã hội."}, {"word": "Baroque", "pos": "adjective", "ipa": "/bəˈroʊk/", "meaning": "Phong cách Baroque (trang trí công phu và kịch tính)", "example": "The baroque architecture of the cathedral reflects the religious fervor and societal stratification of seventeenth-century Europe.", "vn_ex": "Kiến trúc Baroque của nhà thờ lớn phản ánh sự cuồng nhiệt tôn giáo và sự phân tầng xã hội của châu Âu thế kỷ mười bảy."}, {"word": "Cubism", "pos": "noun", "ipa": "/ˈkjuːbɪzəm/", "meaning": "Chủ nghĩa lập thể", "example": "By deconstructing traditional perspectives, Cubism fundamentally altered the cultural landscape of modern visual representation.", "vn_ex": "Bằng cách giải cấu trúc các góc nhìn truyền thống, chủ nghĩa lập thể đã thay đổi căn bản bối cảnh văn hóa của sự biểu đạt thị giác hiện đại."}, {"word": "Impression", "pos": "noun", "ipa": "/ɪmˈprɛʃən/", "meaning": "Ấn tượng, cảm giác", "example": "An individual’s initial impression of a foreign culture is often heavily mediated by mass media representations and stereotypes.", "vn_ex": "Ấn tượng ban đầu của một cá nhân về một nền văn hóa nước ngoài thường bị tác động nặng nề bởi các đại diện truyền thông đại chúng và các khuôn mẫu định kiến."}, {"word": "Composition", "pos": "noun", "ipa": "/ˌkɑːmpəˈzɪʃən/", "meaning": "Cấu trúc, sự sắp xếp, bố cục", "example": "The demographic composition of contemporary urban centers directly influences local cultural synthesis and social integration policies.", "vn_ex": "Cấu trúc nhân khẩu học của các trung tâm đô thị đương đại ảnh hưởng trực tiếp đến sự tổng hòa văn hóa địa phương và các chính sách hội nhập xã hội."}, {"word": "Portrait", "pos": "noun", "ipa": "/ˈpɔːrtrət/", "meaning": "Chân dung, bức chân dung", "example": "The ethnographer painted a vivid portrait of daily life in the marginalized community, highlighting their resilience against systemic inequalities.", "vn_ex": "Nhà dân tộc học đã vẽ nên một bức chân dung sống động về cuộc sống hàng ngày trong cộng đồng bị gạt ra lề xã hội, làm nổi bật khả năng phục hồi của họ chống lại những bất bình đẳng mang tính hệ thống."}, {"word": "Critique", "pos": "noun", "ipa": "/krɪˈtiːk/", "meaning": "Phê bình, bài phê bình", "example": "Marx’s comprehensive critique of capitalism remains a foundational text in sociological studies of social stratification.", "vn_ex": "Bài phê bình toàn diện của Marx về chủ nghĩa tư bản vẫn là một văn bản nền tảng trong các nghiên cứu xã hội học về phân tầng xã hội."}, {"word": "Democracy", "pos": "noun", "ipa": "/dɪˈmɒkrəsi/", "meaning": "Dân chủ, nền dân chủ", "example": "A robust civil society is a fundamental prerequisite for sustaining democracy and ensuring that marginalized voices are represented.", "vn_ex": "Một xã hội dân sự vững mạnh là điều kiện tiên quyết cơ bản để duy trì nền dân chủ và đảm bảo rằng các tiếng nói bị gạt ra lề xã hội được đại diện."}, {"word": "Socialism", "pos": "noun", "ipa": "/ˈsəʊʃəlɪzəm/", "meaning": "Chủ nghĩa xã hội", "example": "Sociological analysis reveals that democratic socialism seeks to mitigate wealth disparities through the collective management of public services.", "vn_ex": "Phân tích xã hội học chỉ ra rằng chủ nghĩa xã hội dân chủ tìm cách giảm thiểu sự phân hóa giàu nghèo thông qua việc quản lý tập thể các dịch vụ công."}, {"word": "Totalitarianism", "pos": "noun", "ipa": "/təʊˌtælɪˈtɛəɹɪəˌnɪzəm/", "meaning": "Chủ nghĩa độc tài, chủ nghĩa cực quyền", "example": "Under totalitarianism, state-sanctioned propaganda systematically dismantles independent cultural organizations to enforce ideological conformity.", "vn_ex": "Dưới chủ nghĩa độc tài, các hoạt động tuyên truyền được nhà nước phê duyệt sẽ tháo dỡ một cách hệ thống các tổ chức văn hóa độc lập để bắt buộc tuân thủ hệ tư tưởng."}, {"word": "Human Rights", "pos": "noun", "ipa": "/ˈhjuːmən raɪts/", "meaning": "Quyền con người", "example": "The sociopolitical discourse surrounding human rights has expanded to encompass digital privacy and environmental protection as fundamental liberties.", "vn_ex": "Cuộc thảo luận chính trị xã hội xung quanh quyền con người đã mở rộng để bao gồm quyền riêng tư kỹ thuật số và bảo vệ môi trường như các quyền tự do cơ bản."}, {"word": "Social Justice", "pos": "noun", "ipa": "/ˈsəʊʃəl ˈdʒʌstɪs/", "meaning": "Công bằng xã hội", "example": "Grassroots movements play a pivotal role in advocating for social justice and dismantling institutionalized discriminatory practices.", "vn_ex": "Các phong trào cơ sở đóng một vai trò then chốt trong việc vận động cho công bằng xã hội và xóa bỏ các thực hành phân biệt đối xử mang tính thể chế."}, {"word": "Diplomacy", "pos": "noun", "ipa": "/dɪˈpləʊməsi/", "meaning": "Ngoại giao, hoạt động ngoại giao", "example": "Cultural diplomacy facilitates mutual understanding between diverse societies, fostering cooperation beyond formal political treaties.", "vn_ex": "Ngoại giao văn hóa tạo điều kiện cho sự hiểu biết lẫn nhau giữa các xã hội đa dạng, thúc đẩy sự hợp tác vượt ra ngoài các hiệp ước chính trị chính thức."}, {"word": "Corruption", "pos": "noun", "ipa": "/kəˈrʌpʃən/", "meaning": "Tham nhũng, sự đồi bại", "example": "Systemic corruption within public institutions severely erodes social trust and undermines the efficacy of developmental policies.", "vn_ex": "Tham nhũng mang tính hệ thống trong các cơ quan công quyền làm xói mòn nghiêm trọng niềm tin xã hội và làm suy yếu hiệu quả của các chính sách phát triển."}, {"word": "Constitution", "pos": "noun", "ipa": "/ˌkɒnstɪˈtjuːʃən/", "meaning": "Hiến pháp", "example": "The nation's constitution acts as a foundational framework, codifying cultural values and defining the legal boundaries of civic rights.", "vn_ex": "Hiến pháp của quốc gia hoạt động như một khuôn khổ nền tảng, luật hóa các giá trị văn hóa và xác định ranh giới pháp lý của các quyền công dân."}, {"word": "Censorship", "pos": "noun", "ipa": "/ˈsɛnsəʃɪp/", "meaning": "Sự kiểm duyệt, kiểm duyệt", "example": "In many restrictive societies, political censorship is deployed to suppress subversive cultural expressions and maintain ideological control.", "vn_ex": "Trong nhiều xã hội hạn chế, sự kiểm duyệt chính trị được triển khai để đàn áp các biểu đạt văn hóa mang tính lật đổ và duy trì sự kiểm soát hệ tư tưởng."}, {"word": "Regime", "pos": "noun", "ipa": "/reɪˈʒiːm/", "meaning": "Chế độ, chính thể", "example": "The transition from an authoritarian regime to a democratic society requires a fundamental restructuring of cultural values and civic behavior.", "vn_ex": "Sự chuyển đổi từ một chế độ độc tài sang một xã hội dân chủ đòi hỏi một sự tái cấu trúc căn bản các giá trị văn hóa và hành vi công dân."}, {"word": "Autocracy", "pos": "noun", "ipa": "/ɔːˈtɒkrəsi/", "meaning": "Chế độ chuyên quyền, nền độc tài", "example": "An autocracy concentrates absolute political authority in the hands of a single ruler, severely stifling societal debates and public discourse.", "vn_ex": "Một chế độ chuyên quyền tập trung quyền lực chính trị tuyệt đối vào tay một nhà lãnh đạo duy nhất, kìm hãm nghiêm trọng các cuộc tranh luận xã hội và diễn ngôn công cộng."}, {"word": "Suffrage", "pos": "noun", "ipa": "/ˈsʌfrɪdʒ/", "meaning": "Quyền bầu cử, quyền đi bầu", "example": "The historic struggle for universal suffrage fundamentally reshaped the democratic landscape and empowered marginalized social groups.", "vn_ex": "Cuộc đấu tranh lịch sử cho quyền bầu cử phổ thông đã tái định hình căn bản bối cảnh dân chủ và trao quyền cho các nhóm xã hội bị gạt ra lề."}, {"word": "Protest", "pos": "noun", "ipa": "/ˈprəʊtɛst/", "meaning": "Cuộc biểu tình, sự phản kháng", "example": "Peaceful protest is recognized as a vital mechanism for societal change, allowing citizens to hold institutions accountable for injustices.", "vn_ex": "Biểu tình ôn hòa được công nhận là một cơ chế quan trọng cho sự thay đổi xã hội, cho phép công dân buộc các thể chế phải chịu trách nhiệm về những bất công."}], "grammar_theory": "# Nominalisation (Noun Phrases) in Academic and Scientific Writing\n## Định nghĩa\nNominalisation là quá trình chuyển đổi động từ hoặc tính từ thành danh từ. Trong viết học thuật và khoa học, nominalisation giúp tạo ra câu phức tạp và chính xác hơn.\n### Công thức cấu trúc\n- `the + động từ + of + danh từ` (sự + động từ + của + danh từ)\n- `the + tính từ + noun` (sự + tính từ + danh từ)\n## Cách dùng thực tế\n- Sử dụng để chỉ một quá trình hoặc hành động như một thực thể riêng biệt.\n- Giúp tránh lặp lại thông tin và tạo ra câu văn đa dạng.\n### Ví dụ\n- `The investigation of the crime scene revealed important clues.` (Cuộc điều tra hiện trường tội phạm đã tiết lộ những manh mối quan trọng.)\n- `The importance of education cannot be overstated.` (Tầm quan trọng của giáo dục không thể được nhấn mạnh quá mức.)", "quiz": [{"question": "The ___ of the new policy has been controversial among citizens.", "options": ["implementation", "implementing", "to implement", "implementation of"], "answer": 0, "explanation": "Câu hỏi yêu cầu một danh từ để chỉ quá trình thực hiện chính sách mới. 'Implementation' là danh từ chỉ sự thực hiện, phù hợp với ngữ cảnh."}, {"question": "The company has announced the ___ of a new product line next quarter.", "options": ["launch", "launching", "to launch", "launch of"], "answer": 3, "explanation": "Câu hỏi cần một cụm danh từ chỉ sự ra mắt sản phẩm mới. 'Launch of' là cụm từ phù hợp, chỉ sự kiện ra mắt sản phẩm."}, {"question": "The ___ of climate change is a pressing issue globally.", "options": ["effect", "affect", "to affect", "effects of"], "answer": 3, "explanation": "Câu hỏi yêu cầu một cụm danh từ chỉ ảnh hưởng của biến đổi khí hậu. 'Effects of' là cụm từ phù hợp, chỉ các tác động của biến đổi khí hậu."}, {"question": "The university emphasizes the ___ of research in its curriculum.", "options": ["importance", "important", "to importance", "importance of"], "answer": 3, "explanation": "Câu hỏi cần một cụm danh từ chỉ tầm quan trọng của nghiên cứu. 'Importance of' là cụm từ phù hợp, chỉ sự quan trọng của nghiên cứu trong chương trình học."}, {"question": "The ___ of the data showed a significant increase in sales.", "options": ["analysis", "analyzing", "to analyze", "analysis of"], "answer": 3, "explanation": "Câu hỏi yêu cầu một cụm danh từ chỉ sự phân tích dữ liệu. 'Analysis of' là cụm từ phù hợp, chỉ quá trình phân tích dữ liệu."}]}, "Advanced Unit 9: Media & Communication": {"vocab": [{"word": "bias", "pos": "noun", "ipa": "/'baɪəs/", "meaning": "thiên kiến, thiên vị", "example": "Scholars must critically evaluate historical archives to detect any inherent political bias that may skew the narrative.", "vn_ex": "Các học giả phải đánh giá một cách phê phán các kho lưu trữ lịch sử để phát hiện bất kỳ thiên kiến chính trị vốn có nào có thể làm lệch hướng câu chuyện."}, {"word": "credible", "pos": "adjective", "ipa": "/'kredəbl/", "meaning": "đáng tin cậy", "example": "In the era of digital dissemination, distinguishing credible scientific research from sensationalized claims is paramount for public trust.", "vn_ex": "Trong kỷ nguyên phổ biến kỹ thuật số, việc phân biệt nghiên cứu khoa học đáng tin cậy với các tuyên bố giật gân là điều tối quan trọng đối với niềm tin của công chúng."}, {"word": "interactive", "pos": "adjective", "ipa": "/ɪntər'æktɪv/", "meaning": "có thể tương tác được", "example": "The university introduced an interactive digital platform that allows students to engage directly with complex simulation models.", "vn_ex": "Trường đại học đã giới thiệu một nền tảng kỹ thuật số tương tác cho phép sinh viên tham gia trực tiếp vào các mô hình mô phỏng phức tạp."}, {"word": "presence", "pos": "noun", "ipa": "/'prezns/", "meaning": "sức thu hút, sức ảnh hưởng", "example": "The media conglomerate established a formidable global presence by acquiring several regional broadcasting networks.", "vn_ex": "Tập đoàn truyền thông đã thiết lập một sự hiện diện toàn cầu mạnh mẽ bằng cách mua lại một số mạng lưới phát thanh truyền hình khu vực."}, {"word": "publicity", "pos": "noun", "ipa": "/pʌb'lɪsəti/", "meaning": "sự quan tâm, chú ý của công chúng", "example": "The scientific breakthrough received widespread publicity, generating substantial funding from both governmental and private sectors.", "vn_ex": "Bước đột phá khoa học đã nhận được sự chú ý rộng rãi của công chúng, tạo ra nguồn tài trợ đáng kể từ cả lĩnh vực chính phủ và tư nhân."}, {"word": "accessible", "pos": "adjective", "ipa": "/ək'sesəbl/", "meaning": "có thể tiếp cận được", "example": "The primary objective of open-access journals is to make empirical research universally accessible to researchers worldwide.", "vn_ex": "Mục tiêu chính của các tạp chí truy cập mở là làm cho nghiên cứu thực nghiệm có thể tiếp cận được trên toàn cầu đối với các nhà nghiên cứu trên toàn thế giới."}, {"word": "mass media", "pos": "noun", "ipa": "/mæs 'miːdiə/", "meaning": "phương tiện truyền thông đại chúng", "example": "Sociologists argue that mass media plays a crucial role in shaping public perceptions of socio-economic inequalities.", "vn_ex": "Các nhà xã hội học cho rằng truyền thông đại chúng đóng một vai trò quan trọng trong việc định hình nhận thức của công chúng về sự bất bình đẳng kinh tế xã hội."}, {"word": "fact-check", "pos": "verb", "ipa": "/'fækt tʃek/", "meaning": "kiểm chứng thông tin", "example": "Journalists are professionally obligated to rigorously fact-check all source materials before publishing articles on controversial political developments.", "vn_ex": "Các nhà báo có nghĩa vụ chuyên môn phải kiểm chứng thông tin một cách nghiêm ngặt đối với tất cả các tài liệu nguồn trước khi xuất bản các bài báo về các diễn biến chính trị gây tranh cãi."}, {"word": "fake news", "pos": "noun", "ipa": "/feɪk 'njuːz/", "meaning": "tin giả, tin bịa đặt", "example": "The proliferation of fake news on social media platforms poses a severe threat to the integrity of democratic elections.", "vn_ex": "Sự gia tăng nhanh chóng của tin giả trên các nền tảng mạng xã hội đặt ra mối đe dọa nghiêm trọng đối với sự liêm chính của các cuộc bầu cử dân chủ."}, {"word": "broadcast", "pos": "verb", "ipa": "/'brɔːdkɑːst/", "meaning": "phát sóng", "example": "The state network will broadcast the international peace summit live to ensure complete transparency of the diplomatic proceedings.", "vn_ex": "Mạng lưới truyền hình quốc gia sẽ phát sóng trực tiếp hội nghị thượng đỉnh hòa bình quốc tế để đảm bảo tính minh bạch hoàn toàn của các thủ tục ngoại giao."}, {"word": "disclose", "pos": "verb", "ipa": "/dɪˈskləʊz/", "meaning": "công bố, phơi bày", "example": "Public corporations are legally mandated to disclose their annual financial audits to prevent fraudulent investment schemes.", "vn_ex": "Các tập đoàn công chúng được bắt buộc về mặt pháp lý phải công bố các cuộc kiểm toán tài chính hàng năm của họ để ngăn chặn các kế hoạch đầu tư gian lận."}, {"word": "exaggerate", "pos": "verb", "ipa": "/ɪɡˈzædʒəreɪt/", "meaning": "phóng đại", "example": "Marketing campaigns often exaggerate the efficacy of dietary supplements without substantial clinical evidence.", "vn_ex": "Các chiến dịch tiếp thị thường phóng đại hiệu quả của các chất bổ sung chế độ ăn uống mà không có bằng chứng lâm sàng đáng kể."}, {"word": "ambiguous", "pos": "adjective", "ipa": "/æmˈbɪɡjuəs/", "meaning": "mơ hồ", "example": "The statutory language of the new regulation remains highly ambiguous, leading to conflicting judicial interpretations.", "vn_ex": "Ngôn ngữ luật định của quy định mới vẫn rất mơ hồ, dẫn đến các cách giải thích tư pháp mâu thuẫn nhau."}, {"word": "critic", "pos": "noun", "ipa": "/ˈkrɪt.ɪk/", "meaning": "nhà phê bình", "example": "A prominent literary critic praised the novel for its innovative narrative structure and profound socio-political commentary.", "vn_ex": "Một nhà phê bình văn học lỗi lạc đã ca ngợi cuốn tiểu thuyết vì cấu trúc tự sự đổi mới và những lời bình luận chính trị xã hội sâu sắc."}, {"word": "tabloid", "pos": "noun", "ipa": "/ˈtæblɔɪd/", "meaning": "báo lá cải", "example": "Unlike serious journalistic broadsheets, tabloid newspapers rely heavily on sensationalism and celebrity gossip to drive sales.", "vn_ex": "Không giống như các tờ báo khổ lớn nghiêm túc, các tờ báo lá cải phụ thuộc nhiều vào sự giật gân và tin đồn về người nổi tiếng để thúc đẩy doanh số bán hàng."}, {"word": "distribute", "pos": "verb", "ipa": "/dɪ'strɪbjuːt/", "meaning": "phân phát, phân phối", "example": "The humanitarian organization formulated a strategic plan to distribute medical supplies to remote rural clinics.", "vn_ex": "Tổ chức nhân đạo đã xây dựng một kế hoạch chiến lược để phân phối vật tư y tế đến các phòng khám nông thôn hẻo lánh."}, {"word": "spread", "pos": "verb", "ipa": "/spred/", "meaning": "lan truyền", "example": "Social networks facilitate the rapid spread of public health announcements during pandemics.", "vn_ex": "Các mạng xã hội tạo điều kiện cho sự lan truyền nhanh chóng của các thông báo y tế công cộng trong các thời kỳ đại dịch."}, {"word": "the press", "pos": "noun", "ipa": "/ðə pres/", "meaning": "báo chí", "example": "A free and independent press is widely recognized as a fundamental pillar of a healthy democratic society.", "vn_ex": "Một nền báo chí tự do và độc lập được công nhận rộng rãi là trụ cột cơ bản của một xã hội dân chủ lành mạnh."}, {"word": "digital billboard", "pos": "noun phrase", "ipa": "/'dɪdʒɪtl 'bɪlbɔːd/", "meaning": "bảng quảng cáo kỹ thuật số", "example": "The introduction of the high-resolution digital billboard has revolutionized outdoor advertising in metropolitan centers.", "vn_ex": "Việc giới thiệu bảng quảng cáo kỹ thuật số độ phân giải cao đã cách mạng hóa ngành quảng cáo ngoài trời tại các trung tâm đô thị lớn."}, {"word": "as opposed to", "pos": "preposition", "ipa": "/æz ə'pəʊzd tuː/", "meaning": "khác với, đối lập với", "example": "The study focuses on qualitative research methodologies, as opposed to quantitative statistical analyses.", "vn_ex": "Nghiên cứu tập trung vào các phương pháp nghiên cứu định tính, trái ngược với các phân tích thống kê định lượng."}, {"word": "by contrast", "pos": "phrase", "ipa": "/baɪ 'kɒntrɑːst/", "meaning": "ngược lại", "example": "The coastal regions experienced severe flooding; the inland areas, by contrast, suffered from a prolonged drought.", "vn_ex": "Các vùng ven biển bị lũ lụt nghiêm trọng; ngược lại, các khu vực nội địa lại phải gánh chịu một đợt hạn hán kéo dài."}, {"word": "meanwhile", "pos": "adverb", "ipa": "/'miːnwaɪl/", "meaning": "trong khi đó", "example": "The central bank implemented strict fiscal policies; meanwhile, the government initiated infrastructure development projects to stimulate growth.", "vn_ex": "Ngân hàng trung ương đã thực hiện các chính sách tài chính nghiêm ngặt; trong khi đó, chính phủ đã khởi xướng các dự án phát triển cơ sở hạ tầng để kích thích tăng trưởng."}, {"word": "account for", "pos": "verb", "ipa": "/ə'kaʊnt fɔː/", "meaning": "chiếm (tỉ lệ)", "example": "Renewable energy resources now account for approximately thirty percent of the nation's total electricity generation.", "vn_ex": "Các nguồn năng lượng tái tạo hiện chiếm khoảng ba mươi phần trăm tổng lượng phát điện của cả nước."}, {"word": "informative", "pos": "adjective", "ipa": "/ɪnˈfɔː.mə.tɪv/", "meaning": "cung cấp nhiều thông tin", "example": "The documentary provided an exceptionally informative overview of the ecological changes occurring in the Antarctic region.", "vn_ex": "Bộ phim tài liệu đã cung cấp một cái nhìn tổng quan cực kỳ nhiều thông tin về những thay đổi sinh thái đang diễn ra ở vùng Nam Cực."}, {"word": "article", "pos": "noun", "ipa": "/ˈɑː.tɪ.kəl/", "meaning": "bài báo", "example": "The peer-reviewed article offers a comprehensive analysis of contemporary macroeconomic trends in developing countries.", "vn_ex": "Bài báo được bình duyệt cung cấp một phân tích toàn diện về các xu hướng kinh tế vĩ mô đương đại ở các nước đang phát triển."}], "grammar_theory": "# Advanced Impersonal Passive Constructions\n## Công thức cấu trúc\n- `is/was + reputed + to have + P2` (được cho là đã làm gì)\n- `is/was + said + to have + P2` (nói là đã làm gì)\n- `is/was + believed + to have + P2` (tin là đã làm gì)\n- `is/was + thought + to have + P2` (nghĩ là đã làm gì)\n- `is/was + known + to have + P2` (biết là đã làm gì)\n## Cách dùng thực tế\n- Trong ngữ cảnh học thuật và giao tiếp nâng cao, các cấu trúc bị động vô nhân (impersonal passive constructions) được sử dụng để thể hiện sự khách quan, không đề cập trực tiếp đến chủ thể thực hiện hành động.\n## Ví dụ cụ thể\n- `He is reputed to have lived in Paris for several years.` (Anh ta được cho là đã sống ở Paris trong vài năm)\n- `The company is said to have invested heavily in renewable energy.` (Công ty nói là đã đầu tư mạnh mẽ vào năng lượng tái tạo)", "quiz": [{"question": "The new policy ___ to have a significant impact on the environment.", "options": ["is reputed", "is said", "is believed", "is thought"], "answer": 1, "explanation": "Câu hỏi này sử dụng cấu trúc bị động vô nhân để thể hiện thông tin về chính sách mới. Đáp án 'is said' phù hợp vì nó thường được sử dụng trong ngữ cảnh thông tin chung hoặc đồn đoán. Câu dịch: 'Chính sách mới nói là sẽ có tác động đáng kể đến môi trường.'"}, {"question": "The ancient city ___ to have been built over 2,000 years ago.", "options": ["is known", "is thought", "is believed", "is reputed"], "answer": 2, "explanation": "Câu hỏi này sử dụng cấu trúc bị động vô nhân để thể hiện thông tin lịch sử. Đáp án 'is believed' phù hợp vì nó thường được sử dụng trong ngữ cảnh thông tin lịch sử hoặc khoa học. Câu dịch: 'Thành phố cổ nói là đã được xây dựng hơn 2.000 năm trước.'"}, {"question": "The artist ___ to have created some of the most iconic paintings of the 20th century.", "options": ["is said", "is thought", "is believed", "is reputed"], "answer": 3, "explanation": "Câu hỏi này sử dụng cấu trúc bị động vô nhân để thể hiện thông tin về nghệ sĩ. Đáp án 'is reputed' phù hợp vì nó thường được sử dụng trong ngữ cảnh thông tin về danh tiếng hoặc uy tín. Câu dịch: 'Nghệ sĩ được cho là đã tạo ra một số bức tranh mang tính biểu tượng nhất của thế kỷ 20.'"}, {"question": "The company ___ to have made significant contributions to the development of renewable energy.", "options": ["is known", "is thought", "is believed", "is said"], "answer": 0, "explanation": "Câu hỏi này sử dụng cấu trúc bị động vô nhân để thể hiện thông tin về công ty. Đáp án 'is known' phù hợp vì nó thường được sử dụng trong ngữ cảnh thông tin đã được xác minh hoặc công nhận. Câu dịch: 'Công ty được biết là đã đóng góp đáng kể vào sự phát triển của năng lượng tái tạo.'"}, {"question": "The new technology ___ to have the potential to revolutionize the way we communicate.", "options": ["is thought", "is believed", "is said", "is reputed"], "answer": 0, "explanation": "Câu hỏi này sử dụng cấu trúc bị động vô nhân để thể hiện thông tin về công nghệ mới. Đáp án 'is thought' phù hợp vì nó thường được sử dụng trong ngữ cảnh thông tin về quan điểm hoặc suy nghĩ. Câu dịch: 'Công nghệ mới được nghĩ là có tiềm năng cách mạng hóa cách chúng ta giao tiếp.'"}]}, "Advanced Unit 10: History & Archaeology": {"vocab": [{"word": "Renaissance", "pos": "noun", "ipa": "/ˈrɛnəˌsɑːns/", "meaning": "Thời kỳ Phục hưng", "example": "The Renaissance was characterized by a profound revival of classical art, literature, and learning across Europe.", "vn_ex": "Thời kỳ Phục hưng được đặc trưng bởi sự hồi sinh sâu sắc của nghệ thuật, văn học và học thuật cổ điển trên khắp châu Âu."}, {"word": "Baroque", "pos": "noun", "ipa": "/bəˈroʊk/", "meaning": "Thời kỳ Baroque", "example": "Scholars of architectural history analyze how the Baroque style emphasized dramatic lighting and ornate detail.", "vn_ex": "Các học giả lịch sử kiến trúc phân tích cách phong cách Baroque nhấn mạnh vào ánh sáng kịch tính và chi tiết trang trí công phu."}, {"word": "Cultural Heritage", "pos": "noun phrase", "ipa": "/ˈkʌltʃərəl ˈhɛrɪtɪdʒ/", "meaning": "Di sản văn hóa", "example": "The preservation of cultural heritage is crucial for maintaining the historical identity of local communities.", "vn_ex": "Việc bảo tồn di sản văn hóa là vô cùng quan trọng để duy trì bản sắc lịch sử của các cộng đồng địa phương."}, {"word": "Expedition", "pos": "noun", "ipa": "/ˌɛkspəˈdɪʃən/", "meaning": "Cuộc thám hiểm", "example": "The archaeological expedition to the ancient valley successfully unearthed several well-preserved artifacts.", "vn_ex": "Cuộc thám hiểm khảo cổ đến thung lũng cổ đại đã khai quật thành công một số cổ vật được bảo tồn tốt."}, {"word": "Regime", "pos": "noun", "ipa": "/reɪˈʒiːm/", "meaning": "Chế độ, chính thể", "example": "Historians studied the rise and fall of the imperial regime to understand its long-term societal impacts.", "vn_ex": "Các nhà sử học đã nghiên cứu sự trỗi dậy và sụp đổ của chế độ đế quốc để hiểu được các tác động xã hội lâu dài của nó."}, {"word": "Totalitarianism", "pos": "noun", "ipa": "/təʊˌtælɪˈtɛəɹɪəˌnɪzəm/", "meaning": "Chủ nghĩa độc tài, chủ nghĩa cực quyền", "example": "The mid-twentieth century witnessed the devastating consequences of totalitarianism on democratic institutions.", "vn_ex": "Giữa thế kỷ hai mươi đã chứng kiến những hậu quả tàn khốc của chủ nghĩa độc tài đối với các thể chế dân chủ."}, {"word": "Autocracy", "pos": "noun", "ipa": "/ɔːˈtɒkrəsi/", "meaning": "Chế độ chuyên quyền, chế độ độc tài", "example": "Throughout human history, autocracy has often led to the systematic suppression of civil liberties.", "vn_ex": "Trong suốt lịch sử loài người, chế độ chuyên quyền thường dẫn đến sự đàn áp có hệ thống đối với các quyền tự do dân sự."}, {"word": "Suffrage", "pos": "noun", "ipa": "/ˈsʌfrɪdʒ/", "meaning": "Quyền bầu cử", "example": "The women's suffrage movement was a pivotal historical milestone that fundamentally reshaped modern democracies.", "vn_ex": "Phong trào quyền bầu cử của phụ nữ là một cột mốc lịch sử then chốt đã định hình lại các nền dân chủ hiện đại một cách cơ bản."}, {"word": "Fresco", "pos": "noun", "ipa": "/ˈfrɛskoʊ/", "meaning": "Tranh vẽ trên tường (bằng cách vẽ trên thạch cao ướt)", "example": "Archaeologists uncovered a stunning Roman fresco that depicted vivid scenes of ancient daily life.", "vn_ex": "Các nhà khảo cổ đã phát hiện ra một bức tranh tường La Mã tuyệt đẹp mô tả những cảnh tượng sinh động về cuộc sống hàng ngày thời cổ đại."}, {"word": "Mosaic", "pos": "noun", "ipa": "/moʊˈzeɪɪk/", "meaning": "Tranh khảm, tranh ghép hình", "example": "The floor of the ancient temple was adorned with a mosaic consisting of thousands of tiny colored stones.", "vn_ex": "Sàn của ngôi đền cổ được trang trí bằng một bức tranh khảm bao gồm hàng ngàn viên đá màu nhỏ li ti."}, {"word": "Allegory", "pos": "noun", "ipa": "/ˈæləɡɔːri/", "meaning": "Phép ẩn dụ, truyện ngụ ngôn", "example": "Many medieval texts utilize complex allegory to convey historical and political criticisms of the ruling class.", "vn_ex": "Nhiều văn bản thời trung cổ sử dụng phép ẩn dụ phức tạp để truyền tải những lời phê bình lịch sử và chính trị đối với giai cấp thống trị."}, {"word": "Symbolism", "pos": "noun", "ipa": "/ˈsɪmbəlɪzəm/", "meaning": "Chủ nghĩa tượng trưng, tính tượng trưng", "example": "Understanding the religious symbolism of ancient artifacts requires a deep knowledge of their historical context.", "vn_ex": "Việc hiểu được tính tượng trưng tôn giáo của các cổ vật cổ đại đòi hỏi một kiến thức sâu rộng về bối cảnh lịch sử của chúng."}, {"word": "Democracy", "pos": "noun", "ipa": "/dɪˈmɒkrəsi/", "meaning": "Dân chủ, nền dân chủ", "example": "Classical Athens is often celebrated as the historical birthplace of direct democracy.", "vn_ex": "Athens cổ điển thường được ca ngợi là nơi khai sinh lịch sử của nền dân chủ trực tiếp."}, {"word": "Socialism", "pos": "noun", "ipa": "/ˈsəʊʃəlɪzəm/", "meaning": "Chủ nghĩa xã hội", "example": "The historical development of socialism in Europe sparked intense political debates throughout the nineteenth century.", "vn_ex": "Sự phát triển lịch sử của chủ nghĩa xã hội ở châu Âu đã gây ra những cuộc tranh luận chính trị gay gắt trong suốt thế kỷ mười chín."}, {"word": "Constitution", "pos": "noun", "ipa": "/ˌkɒnstɪˈtjuːʃən/", "meaning": "Hiến pháp", "example": "The writing of the nation's first constitution was a landmark historical event that established the rule of law.", "vn_ex": "Việc soạn thảo hiến pháp đầu tiên của quốc gia là một sự kiện lịch sử mang tính bước ngoặt thiết lập nên pháp quyền."}, {"word": "Diplomacy", "pos": "noun", "ipa": "/dɪˈpləʊməsi/", "meaning": "Ngoại giao, hoạt động ngoại giao", "example": "Historical records indicate that diplomacy was often preferred over military conflict to resolve border disputes.", "vn_ex": "Các ghi chép lịch sử chỉ ra rằng hoạt động ngoại giao thường được ưu tiên hơn xung đột quân sự để giải quyết các tranh chấp biên giới."}, {"word": "Conservation", "pos": "noun", "ipa": "/ˌkɒnsəˈveɪʃən/", "meaning": "Sự bảo tồn", "example": "The conservation of archaeological sites is essential to safeguard physical evidence of past civilizations.", "vn_ex": "Việc bảo tồn các di chỉ khảo cổ là cần thiết để bảo vệ các bằng chứng vật chất của các nền văn minh trong quá khứ."}, {"word": "Interdisciplinary", "pos": "adjective", "ipa": "/ˌɪntəˈdɪsɪplɪnəri/", "meaning": "Liên ngành, mang tính liên ngành", "example": "The study of ancient climates relies on interdisciplinary cooperation between archaeologists and geologists.", "vn_ex": "Nghiên cứu về khí hậu cổ đại dựa vào sự hợp tác liên ngành giữa các nhà khảo cổ học và các nhà địa chất học."}, {"word": "Thesis", "pos": "noun", "ipa": "/ˈθiːsɪs/", "meaning": "Luận án, luận điểm", "example": "Her doctoral thesis presents a highly innovative methodology for dating archaeological ceramics.", "vn_ex": "Luận án tiến sĩ của cô trình bày một phương pháp luận cực kỳ đổi mới để xác định niên đại của đồ gốm khảo cổ."}, {"word": "Dissertation", "pos": "noun", "ipa": "/ˌdɪsəˈteɪʃən/", "meaning": "Luận văn, công trình nghiên cứu", "example": "His history dissertation meticulously explores the social changes during the industrial revolution.", "vn_ex": "Luận văn lịch sử của anh nghiên cứu một cách tỉ mỉ những thay đổi xã hội trong cuộc cách mạng công nghiệp."}, {"word": "Research Methodology", "pos": "noun phrase", "ipa": "/rɪˈsɜːʧ ˌmɛθəˈdɒlədʒi/", "meaning": "Phương pháp nghiên cứu, phương pháp luận nghiên cứu", "example": "Historians must establish a rigorous research methodology when interpreting fragmented ancient chronicles.", "vn_ex": "Các nhà sử học phải thiết lập một phương pháp luận nghiên cứu nghiêm ngặt khi giải thích các biên niên sử cổ đại bị phân mảnh."}, {"word": "Accumulate", "pos": "verb", "ipa": "/əˈkjuːmjʊleɪt/", "meaning": "Tích lũy", "example": "Over centuries, dust and soil accumulate over ancient ruins, forming the layers studied by archaeologists today.", "vn_ex": "Trải qua nhiều thế kỷ, bụi bẩn và đất tích lũy trên các tàn tích cổ xưa, tạo thành các lớp được nghiên cứu bởi các nhà khảo cổ ngày nay."}, {"word": "Regression", "pos": "noun", "ipa": "/rɪˈɡrɛʃən/", "meaning": "Sự thoái lui, sự suy thoái", "example": "The economic regression of the ancient empire ultimately led to a decline in archaeological monuments.", "vn_ex": "Sự suy thoái kinh tế của đế chế cổ đại cuối cùng đã dẫn đến sự suy giảm của các di tích khảo cổ."}, {"word": "Archipelago", "pos": "noun", "ipa": "/ˌɑːkɪˈpɛləɡəʊ/", "meaning": "Quần đảo", "example": "The ancient maritime civilization established trade networks across the volcanic archipelago.", "vn_ex": "Nền văn minh hàng hải cổ đại đã thiết lập các mạng lưới thương mại trên khắp quần đảo núi lửa."}, {"word": "Censorship", "pos": "noun", "ipa": "/ˈsɛnsəʃɪp/", "meaning": "Sự kiểm duyệt, công tác kiểm duyệt", "example": "Throughout various historical eras, strict censorship was imposed by autocratic regimes to suppress dissent.", "vn_ex": "Trong suốt các kỷ nguyên lịch sử khác nhau, sự kiểm duyệt nghiêm ngặt đã được các chế độ chuyên quyền áp đặt nhằm đàn áp các ý kiến bất đồng."}], "grammar_theory": "# Past Perfect và Past Perfect Continuous trong Câu Chuyện Khảo Cổ \n## Công Thức Cấu Trúc \n- Past Perfect: `had + V-ed` \n- Past Perfect Continuous: `had been + V-ing` \n## Cách Dùng \n- Past Perfect dùng để chỉ hành động xảy ra trước một hành động khác trong quá khứ. \n- Past Perfect Continuous dùng để chỉ hành động xảy ra liên tục trước một hành động khác trong quá khứ. \n## Ví Dụ \n- By the time the archaeologists arrived, the thieves **had stolen** many valuable artifacts. (Vào thời điểm các nhà khảo cổ đến, những tên trộm **đã đánh cắp** nhiều hiện vật quý giá.) \n- The team **had been excavating** the site for months before they found the ancient temple. (Đội ngũ **đã đào** khu vực trong nhiều tháng trước khi họ tìm thấy ngôi đền cổ.)", "quiz": [{"question": "By the time the archaeologists arrived, the thieves ___ many valuable artifacts.", "options": ["had stolen", "stole", "were stealing", "have stolen"], "answer": 0, "explanation": "Chọn đáp án A vì hành động đánh cắp xảy ra trước khi các nhà khảo cổ đến, sử dụng Past Perfect để chỉ hành động xảy ra trước một hành động khác trong quá khứ. Câu dịch: Vào thời điểm các nhà khảo cổ đến, những tên trộm đã đánh cắp nhiều hiện vật quý giá."}, {"question": "The team ___ the site for months before they found the ancient temple.", "options": ["had been excavating", "excavated", "were excavating", "have excavated"], "answer": 0, "explanation": "Chọn đáp án A vì hành động đào khu vực xảy ra liên tục trước khi tìm thấy ngôi đền cổ, sử dụng Past Perfect Continuous để chỉ hành động xảy ra liên tục trước một hành động khác trong quá khứ. Câu dịch: Đội ngũ đã đào khu vực trong nhiều tháng trước khi họ tìm thấy ngôi đền cổ."}, {"question": "The archaeologists ___ the ancient city by the time the funding ran out.", "options": ["had been excavating", "had excavated", "were excavating", "excavated"], "answer": 1, "explanation": "Chọn đáp án B vì hành động khai quật xảy ra trước khi nguồn tài trợ hết, sử dụng Past Perfect để chỉ hành động xảy ra trước một hành động khác trong quá khứ. Câu dịch: Các nhà khảo cổ đã khai quật thành phố cổ vào thời điểm nguồn tài trợ hết."}, {"question": "By the time the museum opened, the curators ___ the artifacts for weeks.", "options": ["had been arranging", "arranged", "were arranging", "have arranged"], "answer": 0, "explanation": "Chọn đáp án A vì hành động sắp xếp hiện vật xảy ra liên tục trước khi bảo tàng mở cửa, sử dụng Past Perfect Continuous để chỉ hành động xảy ra liên tục trước một hành động khác trong quá khứ. Câu dịch: Vào thời điểm bảo tàng mở cửa, những người phụ trách đã sắp xếp hiện vật trong nhiều tuần."}, {"question": "The researchers ___ their findings by the time the conference started.", "options": ["had been publishing", "published", "were publishing", "have published"], "answer": 1, "explanation": "Chọn đáp án B vì hành động xuất bản kết quả xảy ra trước khi hội nghị bắt đầu, sử dụng Past Perfect để chỉ hành động xảy ra trước một hành động khác trong quá khứ. Câu dịch: Các nhà nghiên cứu đã xuất bản kết quả của họ vào thời điểm hội nghị bắt đầu."}]}};
    let currentUnit = Object.keys(slideData)[0];
    let currentTab = 'vocab';

    function init() {
      const listContainer = document.getElementById('unitList');
      listContainer.innerHTML = '';
      
      Object.keys(slideData).forEach((unitName, idx) => {
        const li = document.createElement('li');
        li.className = 'unit-item' + (unitName === currentUnit ? ' active' : '');
        li.textContent = unitName;
        li.onclick = () => selectUnit(unitName);
        listContainer.appendChild(li);
      });

      renderContent();
    }

    function selectUnit(unitName) {
      currentUnit = unitName;
      document.querySelectorAll('.unit-item').forEach(item => {
        item.classList.toggle('active', item.textContent === unitName);
      });
      renderContent();
    }

    function switchTab(tabName) {
      currentTab = tabName;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('onclick').includes(tabName));
      });
      
      document.getElementById('vocabTab').classList.toggle('hidden', tabName !== 'vocab');
      document.getElementById('grammarTab').classList.toggle('hidden', tabName !== 'grammar');
      document.getElementById('quizTab').classList.toggle('hidden', tabName !== 'quiz');
    }

    function renderContent() {
      const unit = slideData[currentUnit];
      
      // Render Vocab
      const vocabTab = document.getElementById('vocabTab');
      vocabTab.innerHTML = unit.vocab.map(w => `
        <div class="vocab-card">
          <div class="vocab-word">${w.word}</div>
          <div class="vocab-meta">
            <span>(${w.pos})</span>
            <span class="vocab-ipa">${w.ipa || ''}</span>
          </div>
          <div class="vocab-meaning">${w.meaning}</div>
          <div class="vocab-ex">
            <div>${w.example}</div>
            <div class="vocab-ex-vn">${w.vn_ex}</div>
          </div>
        </div>
      `).join('');

      // Render Grammar
      const grammarTab = document.getElementById('grammarTab');
      // Simple markdown parser wrapper
      let mdHtml = unit.grammar_theory || '<p>Đang cập nhật...</p>';
      mdHtml = mdHtml
        .replace(/### (.*)/g, '<h3>$1</h3>')
        .replace(/## (.*)/g, '<h2>$1</h2>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/`(.*?)`/g, '<code>$1</code>')
        .replace(/\n/g, '<br>');
      grammarTab.innerHTML = mdHtml;

      // Render Quiz
      document.getElementById('quizUnitName').textContent = currentUnit;
      const quizContent = document.getElementById('quizContent');
      quizContent.innerHTML = (unit.quiz || []).map((q, qIdx) => `
        <div class="quiz-card" id="q_${qIdx}">
          <div class="quiz-question">${qIdx + 1}. ${q.question}</div>
          <div class="quiz-options">
            ${q.options.map((opt, oIdx) => `
              <div class="quiz-option" onclick="answerQuiz(${qIdx}, ${oIdx}, ${q.answer})">
                <span>${['A', 'B', 'C', 'D'][oIdx]}.</span>
                <span>${opt}</span>
              </div>
            `).join('')}
          </div>
          <div class="quiz-explanation hidden" id="exp_${qIdx}">
            <strong>Giải thích:</strong> ${q.explanation}
          </div>
        </div>
      `).join('');
    }

    function answerQuiz(qIdx, selectedIdx, correctIdx) {
      const card = document.getElementById(`q_${qIdx}`);
      const options = card.querySelectorAll('.quiz-option');
      const exp = document.getElementById(`exp_${qIdx}`);
      
      // Lock click
      options.forEach(opt => opt.style.pointerEvents = 'none');
      
      options[selectedIdx].classList.add(selectedIdx === correctIdx ? 'correct' : 'incorrect');
      if (selectedIdx !== correctIdx) {
        options[correctIdx].classList.add('correct');
      }
      
      exp.classList.remove('hidden');
    }

    let fontSize = 16;
    function changeFontSize(dir) {
      fontSize += dir * 2;
      document.body.style.fontSize = fontSize + 'px';
    }

    window.onload = init;
  </script>
</body>
</html>
