ện văn hóa tuyệt vời tối qua."}, {"word": "diversity", "pos": "noun", "ipa": "/daɪˈvɜːrsəti/", "meaning": "sự đa dạng", "example": "This neighborhood is known for its cultural diversity.", "vn_ex": "Khu phố này nổi tiếng vì sự đa dạng văn hóa."}, {"word": "generation", "pos": "noun", "ipa": "/ˌdʒenəˈreɪʃn/", "meaning": "thế hệ", "example": "The younger generation is very comfortable with technology.", "vn_ex": "Thế hệ trẻ ngày nay sử dụng công nghệ rất thành thạo."}, {"word": "identity", "pos": "noun", "ipa": "/aɪˈdentəti/", "meaning": "bản sắc, danh tính", "example": "We must preserve our national identity.", "vn_ex": "Chúng ta phải gìn giữ bản sắc dân tộc của mình."}, {"word": "influence", "pos": "noun", "ipa": "/ˈɪnfluəns/", "meaning": "sự ảnh hưởng, tác động", "example": "My parents have a huge influence on my life.", "vn_ex": "Cha mẹ có ảnh hưởng rất lớn đến cuộc đời tôi."}, {"word": "institution", "pos": "noun", "ipa": "/ˌɪnstɪˈtuːʃn/", "meaning": "thể chế, cơ quan, tổ chức", "example": "Marriage is a sacred social institution.", "vn_ex": "Hôn nhân là một thể chế xã hội thiêng liêng."}, {"word": "justice", "pos": "noun", "ipa": "/ˈdʒʌstɪs/", "meaning": "công lý, sự công bằng", "example": "They are marching to demand justice for the victims.", "vn_ex": "Họ đang tuần hành để đòi lại công lý cho các nạn nhân."}, {"word": "mass", "pos": "adjective", "ipa": "/mæs/", "meaning": "đại chúng, hàng loạt", "example": "Social media has a huge impact on mass communication.", "vn_ex": "Mạng xã hội có tác động khổng lồ đến truyền thông đại chúng."}, {"word": "opinion", "pos": "noun", "ipa": "/əˈpɪnjən/", "meaning": "ý kiến, quan điểm", "example": "In my opinion, everyone should learn a second language.", "vn_ex": "Theo ý kiến của tôi, mọi người nên học một ngôn ngữ thứ hai."}, {"word": "politics", "pos": "noun", "ipa": "/ˈpɑːlətɪks/", "meaning": "chính trị", "example": "I don't like to talk about politics during dinner.", "vn_ex": "Tôi không thích bàn luận về chính trị trong bữa ăn."}, {"word": "value", "pos": "noun", "ipa": "/ˈvæljuː/", "meaning": "giá trị", "example": "Honesty is a core value in our family.", "vn_ex": "Sự trung thực là một giá trị cốt lõi trong gia đình chúng tôi."}, {"word": "conflict", "pos": "noun", "ipa": "/ˈkɑːnflɪkt/", "meaning": "sự xung đột, mâu thuẫn", "example": "We should try to resolve this conflict peacefully.", "vn_ex": "Chúng ta nên cố gắng giải quyết mâu thuẫn này một cách hòa bình."}], "grammar_theory": "# Adjective Order (OSASCOMP) trong Mô Tả Văn Hóa và Xã Hội\n## Công Thức Cấu Trúc\n`OSASCOMP` là viết tắt của Opinion, Size, Age, Shape, Color, Origin, Material, Purpose.\n## Cách Dùng Thực Tiễn\nTrong ngữ cảnh học thuật và giao tiếp nâng cao, việc sử dụng `OSASCOMP` giúp mô tả một cách chi tiết và chính xác các đối tượng trong văn hóa và xã hội.\n### Ví Dụ\n- `The beautiful, old, rectangular, brown, wooden, antique table.` (Bàn gỗ cổ, đẹp, cũ, hình chữ nhật, màu nâu, có mục đích trang trí)\n<br>\n## Lưu Ý\nKhi sử dụng `OSASCOMP`, cần lưu ý đến thứ tự của các tính từ để đảm bảo câu văn được rõ ràng và dễ hiểu.", "quiz": [{"question": "Trong mô tả về một bức tranh, từ `magnificent` nên được đặt ở vị trí ___ trong thứ tự tính từ.", "options": ["đầu tiên", "sau khi mô tả hình dạng", "sau khi mô tả màu sắc", "cuối cùng"], "answer": 0, "explanation": "Từ `magnificent` là một tính từ chỉ quan điểm (opinion), vì vậy nó nên được đặt ở vị trí đầu tiên trong thứ tự tính từ OSASCOMP. Dịch nghĩa: `Trong mô tả về một bức tranh, từ `magnificent` nên được đặt ở vị trí đầu tiên trong thứ tự tính từ.`"}, {"question": "Khi mô tả một chiếc xe hơi, từ `red` nên được đặt ở vị trí ___ trong thứ tự tính từ.", "options": ["sau khi mô tả kích thước", "sau khi mô tả hình dạng", "sau khi mô tả tuổi", "trước khi mô tả mục đích"], "answer": 2, "explanation": "Từ `red` là một tính từ chỉ màu sắc (color), vì vậy nó nên được đặt sau khi mô tả hình dạng (shape) trong thứ tự tính từ OSASCOMP. Dịch nghĩa: `Khi mô tả một chiếc xe hơi, từ `red` nên được đặt sau khi mô tả hình dạng trong thứ tự tính từ.`"}, {"question": "Từ `leather` nên được đặt ở vị trí ___ trong mô tả về một chiếc ghế.", "options": ["sau khi mô tả quan điểm", "sau khi mô tả kích thước", "sau khi mô tả màu sắc", "sau khi mô tả mục đích"], "answer": 3, "explanation": "Từ `leather` là một tính từ chỉ chất liệu (material), vì vậy nó nên được đặt sau khi mô tả mục đích (purpose) trong thứ tự tính từ OSASCOMP. Dịch nghĩa: `Từ `leather` nên được đặt sau khi mô tả mục đích trong mô tả về một chiếc ghế.`"}, {"question": "Khi mô tả một tòa nhà, từ `old` nên được đặt ở vị trí ___ trong thứ tự tính từ.", "options": ["sau khi mô tả hình dạng", "sau khi mô tả kích thước", "sau khi mô tả quan điểm", "trước khi mô tả mục đích"], "answer": 2, "explanation": "Từ `old` là một tính từ chỉ tuổi (age), vì vậy nó nên được đặt sau khi mô tả kích thước (size) trong thứ tự tính từ OSASCOMP. Dịch nghĩa: `Khi mô tả một tòa nhà, từ `old` nên được đặt sau khi mô tả kích thước trong thứ tự tính từ.`"}, {"question": "Từ `circular` nên được đặt ở vị trí ___ trong mô tả về một chiếc đồng hồ.", "options": ["sau khi mô tả màu sắc", "sau khi mô tả chất liệu", "sau khi mô tả kích thước", "trước khi mô tả tuổi"], "answer": 3, "explanation": "Từ `circular` là một tính từ chỉ hình dạng (shape), vì vậy nó nên được đặt trước khi mô tả tuổi (age) trong thứ tự tính từ OSASCOMP. Dịch nghĩa: `Từ `circular` nên được đặt trước khi mô tả tuổi trong mô tả về một chiếc đồng hồ.`"}]}};
    let currentUnit = Object.keys(slideData)[0];
    let currentTab = 'vocab';

    function init() {
      const listContainer = document.getElementById('unitList');
      listContainer.innerHTML = '';
      
      Object.keys(slideData).forEach((unitName, idx) => {
        const li = document.createElement('li');
        li.className = 'unit-item' + (unitName === currentUnit ? ' active' : '');
        li.textContent = unitName;
        li.onclick = () => selectUnit(unitName);
        listContainer.appendChild(li);
      });

      renderContent();
    }

    function selectUnit(unitName) {
      currentUnit = unitName;
      document.querySelectorAll('.unit-item').forEach(item => {
        item.classList.toggle('active', item.textContent === unitName);
      });
      renderContent();
    }

    function switchTab(tabName) {
      currentTab = tabName;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('onclick').includes(tabName));
      });
      
      document.getElementById('vocabTab').classList.toggle('hidden', tabName !== 'vocab');
      document.getElementById('grammarTab').classList.toggle('hidden', tabName !== 'grammar');
      document.getElementById('quizTab').classList.toggle('hidden', tabName !== 'quiz');
    }

    function renderContent() {
      const unit = slideData[currentUnit];
      
      // Render Vocab
      const vocabTab = document.getElementById('vocabTab');
      vocabTab.innerHTML = unit.vocab.map(w => `
        <div class="vocab-card">
          <div class="vocab-word">${w.word}</div>
          <div class="vocab-meta">
            <span>(${w.pos})</span>
            <span class="vocab-ipa">${w.ipa || ''}</span>
          </div>
          <div class="vocab-meaning">${w.meaning}</div>
          <div class="vocab-ex">
            <div>${w.example}</div>
            <div class="vocab-ex-vn">${w.vn_ex}</div>
          </div>
        </div>
      `).join('');

      // Render Grammar
      const grammarTab = document.getElementById('grammarTab');
      // Simple markdown parser wrapper
      let mdHtml = unit.grammar_theory || '<p>Đang cập nhật...</p>';
      mdHtml = mdHtml
        .replace(/### (.*)/g, '<h3>$1</h3>')
        .replace(/## (.*)/g, '<h2>$1</h2>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/`(.*?)`/g, '<code>$1</code>')
        .replace(/\n/g, '<br>');
      grammarTab.innerHTML = mdHtml;

      // Render Quiz
      document.getElementById('quizUnitName').textContent = currentUnit;
      const quizContent = document.getElementById('quizContent');
      quizContent.innerHTML = (unit.quiz || []).map((q, qIdx) => `
        <div class="quiz-card" id="q_${qIdx}">
          <div class="quiz-question">${qIdx + 1}. ${q.question}</div>
          <div class="quiz-options">
            ${q.options.map((opt, oIdx) => `
              <div class="quiz-option" onclick="answerQuiz(${qIdx}, ${oIdx}, ${q.answer})">
                <span>${['A', 'B', 'C', 'D'][oIdx]}.</span>
                <span>${opt}</span>
              </div>
            `).join('')}
          </div>
          <div class="quiz-explanation hidden" id="exp_${qIdx}">
            <strong>Giải thích:</strong> ${q.explanation}
          </div>
        </div>
      `).join('');
    }

    function answerQuiz(qIdx, selectedIdx, correctIdx) {
      const card = document.getElementById(`q_${qIdx}`);
      const options = card.querySelectorAll('.quiz-option');
      const exp = document.getElementById(`exp_${qIdx}`);
      
      // Lock click
      options.forEach(opt => opt.style.pointerEvents = 'none');
      
      options[selectedIdx].classList.add(selectedIdx === correctIdx ? 'correct' : 'incorrect');
      if (selectedIdx !== correctIdx) {
        options[correctIdx].classList.add('correct');
      }
      
      exp.classList.remove('hidden');
    }

    let fontSize = 16;
    function changeFontSize(dir) {
      fontSize += dir * 2;
      document.body.style.fontSize = fontSize + 'px';
    }

    window.onload = init;
  </script>
</body>
